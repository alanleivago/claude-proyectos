// =====================================================================
//  ¿QUÉ PASARÍA SI DUPLICARAS TU TAMAÑO CADA 2 SEGUNDOS? — 9:16, 60 s, 24 fps.

const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const SAFE = { top: 240, bottom: 420, right: 140 };
const HAND = 'Georgia, Cambria, "Times New Roman", serif';
const CX = 540;
// her height in metres: 1.60 m doubling every 2 s
const HGT = (t) => 1.6 * Math.pow(2, t / 2);

const ERA_LIST = [[0, 60, () => sceneMain()]];
const SHOTS = [
  ['walk',    0,    3,    'camina por la avenida'],
