<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overnight Charge</title>
<style>
  html, body { margin: 0; height: 100%; background: #04031a; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { height: min(100vh, calc(100vw * 16 / 9)); width: auto; aspect-ratio: 9 / 16; display: block; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
"use strict";
// =====================================================================
//  IS IT DANGEROUS TO CHARGE YOUR PHONE OVERNIGHT? — 9:16, voice-led, 24fps, style voltreal (cinematic 2.5D +
//  karaoke captions). One stage: a phone charging on a nightstand; cutaways into the battery and the charger.
// =====================================================================
const FPS = 24, W = 1080, H = 1920;
const BPM = 120, BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4, GRID0 = 0;
const VL = (id) => VOICE.lines.find((l) => l.id === id);
const VW = (id, w, n = 1) => { const L = VL(id); let k = 0; for (const x of L.words) if (x.w.toLowerCase().replace(/[^a-z0-9']/g, '') === w.toLowerCase() && ++k === n) return x.t0; return L.t0; };
const DURATION = Math.round(VOICE.duration * FPS) / FPS;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const SAFE = { top: 240, bottom: 420, right: 140 };
const VMONO = '"SF Mono", Menlo, "JetBrains Mono", "DejaVu Sans Mono", Consolas, monospace';
const HAND = VMONO;
const CX = 520;
const onBeat = (t) => t;

const S = (id) => VL(id).t0 - 0.3;                    // a beat starts ~0.3s before its line
const HIT = VL('layers').t1 + 0.2;                     // the payoff: the layers touch and the cell runs away, in the pause after the line
const IDS = ['title', 'night', 'think', 'lie', 'boss', 'decide', 'sip', 'heat', 'opt', 'news', 'layers', 'pierce', 'rare', 'note7', 'hand', 'pillow', 'fake', 'test', 'weigh', 'recap', 'end'];
const TB = IDS.map((id, i) => (i === 0 ? 0 : S(id)));
const SUB = (id) => TB[IDS.indexOf(id)], SUBEND = (id) => (IDS.indexOf(id) + 1 < IDS.length ? TB[IDS.indexOf(id) + 1] : DURATION);
const ERA_LIST = [[0, DURATION, () => sceneStage()]];
const SHOTS = IDS.map((id, i) => [id, 0, TB[i], i + 1 < IDS.length ? TB[i + 1] : DURATION, id]);
const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, gridOffset: GRID0, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE, aspect: '9:16',
  format: 'fixed-stage',
  shots: SHOTS.map(([key, era, t0, t1, title], i) => ({ id: i + 1, key, era, t0, t1, title })),
  cuts: [],
  morphs: [],
  cues: { hit: HIT },
  acts: [
    { name: '1 Myth',    role: 'build',   t0: 0, t1: S('boss') },
    { name: '2 Phone',   role: 'build',   t0: S('boss'), t1: S('news') },
    { name: '3 Cell',    role: 'peak',    t0: S('news'), t1: VW('layers', 'spiral') - 0.3 },
    { name: '4 Silence', role: 'silence', t0: VW('layers', 'spiral') - 0.3, t1: HIT },
    { name: '5 Fire',    role: 'gift',    t0: HIT, t1: VL('pierce').t1 },
    { name: '6 Advice',  role: 'build',   t0: VL('pierce').t1, t1: S('end') },
    { name: '7 End',     role: 'goodbye', t0: S('end'), t1: DURATION },
  ],
  board: IDS.map((id, i) => ({ t: i + 1 === IDS.length ? DURATION - 0.4 : Math.min(VL(id).t1 - 0.2, TB[i + 1] - 0.1), title: id, sound: '', next: '' })),
  narration: VOICE.lines.map((l) => ({ id: l.id, t0: l.t0, t1: l.t1, text: l.text })),
};
window.TIMELINE = TIMELINE;
