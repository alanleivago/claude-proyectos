<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Cyclops</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b0c0f; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { width: min(100vw, calc(100vh * 16 / 9)); height: auto; aspect-ratio: 16 / 9; display: block; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
"use strict";
// =====================================================================
//  THE ENTIRE ODYSSEY, TOLD ON A GREEK VASE — Chapter 3: The Cyclops. 16:9, voice-led (~5 min), 24fps, style amphora-bf.
//  Nano Banana layers (Flow) animated in code; the friezes are fixed, the picture slides right panel to panel.
// =====================================================================
const FPS = 24, W = 1920, H = 1080;
const BPM = 120, BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4, GRID0 = 0;
const VL = (id) => VOICE.lines.find((l) => l.id === id);
const VW = (id, w, n = 1) => { const L = VL(id); let k = 0; for (const x of L.words) if (x.w.toLowerCase().replace(/[^a-z0-9']/g, '') === w.toLowerCase() && ++k === n) return x.t0; console.warn('VW miss', id, w); return L.t0; };
const DURATION = Math.round(VOICE.duration * FPS) / FPS;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const SAFE = { top: 90, bottom: 158, right: 0 };
const HAND = 'Georgia, serif';
const CX = 960;
const onBeat = (t) => t;

// the panels (the approved board p01..p24; p21, p23 and p24 split in two/three) and the line each one starts on
const PANEL_START = [['p01', 'c01'], ['p02', 'c04'], ['p03', 'c06'], ['p04', 'c07'], ['p05', 'c09'], ['p06', 'c11'], ['p07', 'c13'], ['p08', 'c14'],
  ['p09', 'c15'], ['p10', 'c17'], ['p11', 'c18'], ['p12', 'c19'], ['p13', 'c20'], ['p14', 'c23'], ['p15', 'c24'], ['p16', 'c26'], ['p17', 'c29'],
  ['p18', 'c32'], ['p19', 'c33'], ['p20', 'c37'], ['p21', 'c40'], ['p21b', 'c41'], ['p22', 'c43'], ['p23', 'c44'], ['p23b', 'c46'],
  ['p24', 'c49'], ['p24b', 'c50'], ['p24c', 'c52']];
const IDS = PANEL_START.map((p) => p[0]);
const S = (lid) => (lid === 'c01' ? 0 : VL(lid).t0 - 0.25);      // a panel starts (the slide is centred) just before its first line
const TB = PANEL_START.map(([, l]) => S(l));
const SUB = (id) => TB[IDS.indexOf(id)], SUBEND = (id) => (IDS.indexOf(id) + 1 < IDS.length ? TB[IDS.indexOf(id) + 1] : DURATION);
const LINE_PANEL = {};   // line id -> panel id
VOICE.lines.forEach((L) => { let p = IDS[0]; for (let i = 0; i < IDS.length; i++) if (L.t0 >= TB[i] - 0.3) p = IDS[i]; LINE_PANEL[L.id] = p; });
const HIT = VW('c34', 'eye') - 0.04;                               // the climax: the stake goes into the eye on "eye"
const CAPS = [];
const ERA_LIST = [[0, DURATION, () => sceneStage()]];
const SHOTS = IDS.map((id, i) => [id, 0, TB[i], i + 1 < IDS.length ? TB[i + 1] : DURATION, id]);
const BOARD_T = {};      // storyboard frame per panel (the board's anchor line), filled in scenes.js
const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, gridOffset: GRID0, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE, aspect: '16:9',
  format: 'black-figure-strip',
  shots: SHOTS.map(([key, era, t0, t1, title], i) => ({ id: i + 1, key, era, t0, t1, title })),
  cuts: TB.slice(1),
  morphs: [],
  cues: { hit: HIT },
  acts: [
    { name: '1 The island', role: 'build', t0: 0, t1: SUB('p06') },
    { name: '2 Polyphemus', role: 'build', t0: SUB('p06'), t1: SUB('p13') },
    { name: '3 The plan',   role: 'build', t0: SUB('p13'), t1: SUB('p19') },
    { name: '4 The eye',    role: 'peak',  t0: SUB('p19'), t1: SUB('p21') },
    { name: '5 Escape',     role: 'gift',  t0: SUB('p21'), t1: SUB('p23') },
    { name: '6 The curse',  role: 'goodbye', t0: SUB('p23'), t1: DURATION },
  ],
  board: [],
  narration: VOICE.lines.map((l) => ({ id: l.id, t0: l.t0, t1: l.t1, text: l.text })),
};
window.TIMELINE = TIMELINE;
