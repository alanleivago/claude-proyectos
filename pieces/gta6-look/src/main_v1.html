<!doctype html>
<html><head><meta charset="utf-8"><title>gta6-look</title>
<style>html,body{margin:0;background:#111}canvas{display:block;max-height:100vh;margin:auto}</style>
</head><body><canvas id="c" width="1080" height="1920"></canvas>
<script>
"use strict";
// GTA-6 loading-screen look test: Flow layers + parallax, every moving thing stepped on 2s (12 fps) like the ref.
const STYLE = { name: 'gta6', ones: false };
const W = 1080, H = 1920, FPS = 24, STEP = 12, DUR = 9.5;
window.TIMELINE = { width: W, height: H, fps: FPS, duration: DUR, frames: Math.round(DUR * FPS) };
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lin = (t, a, b) => clamp((t - a) / (b - a));
const outCubic = (x) => 1 - Math.pow(1 - x, 3);
const outBack = (x) => { const c = 1.6; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const inCubic = (x) => x * x * x;
const io = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;

// ---- print texture: halftone dot screen + paper grain, made once
let PRINT = null;
function makePrint() {
  const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');
  const id = g.createImageData(W, H), d = id.data; let s = 1234567;
  const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const P = 7, ang = 0.5, ca = Math.cos(ang), sa = Math.sin(ang);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const u = (x * ca + y * sa) / P, v = (-x * sa + y * ca) / P;
    const fu = u - Math.floor(u) - .5, fv = v - Math.floor(v) - .5;
    const dot = Math.sqrt(fu * fu + fv * fv) < .28 ? 1 : 0;
    const n = rnd();
    const i = (y * W + x) * 4; const val = 128 + (dot ? -22 : 6) + (n - .5) * 30;
    d[i] = d[i + 1] = d[i + 2] = val; d[i + 3] = 255;
  }
  g.putImageData(id, 0, 0); return c;
}

// draw a full-frame layer (9:16 Flow image) with the camera: zoom about (cx,cy), depth-weighted
function layer(g, img, cam, depth, dx = 0, dy = 0, extra = 1, alpha = 1) {
  if (alpha <= 0) return;
  const k = Math.pow(cam.z, 0.35 + depth * 1.3) * extra;            // deeper = less zoom
  const w = W * 1.002 * k, h = (img.height / img.width) * W * 1.002 * k;
  const px = cam.px * (0.3 + depth), py = cam.py * (0.3 + depth);
  g.globalAlpha = alpha;
  g.drawImage(img, W / 2 - w / 2 + dx + px, H * 0.5 - h / 2 + dy + py, w, h);
  g.globalAlpha = 1;
}
function sprite(g, img, cam, depth, cx, cy, w, alpha = 1) {   // a non-full-frame object centred at (cx,cy)
  const k = Math.pow(cam.z, 0.35 + depth * 1.3);
  const px = cam.px * (0.3 + depth), py = cam.py * (0.3 + depth);
  const ww = w * k, hh = ww * img.height / img.width;
  const X = W / 2 + (cx - W / 2) * k + px, Y = H / 2 + (cy - H / 2) * k + py;
  g.globalAlpha = alpha; g.drawImage(img, X - ww / 2, Y - hh / 2, ww, hh); g.globalAlpha = 1;
}

// our own title lettering (no game fonts/logos): heavy condensed caps, black outline, hard drop shadow, slight tilt
function title(g, lines, x, y, size, p, tilt = -0.06, sticker = null) {
  if (p <= 0) return;
  const s = outBack(clamp(p));
  g.save(); g.translate(x, y); g.rotate(tilt); g.scale(s, s);
  g.font = `900 ${size}px "Impact","Haettenschweiler","Arial Narrow Bold",sans-serif`;
  g.textAlign = 'left'; g.textBaseline = 'alphabetic'; g.lineJoin = 'round';
  lines.forEach((t, i) => {
    const yy = i * size * 0.92;
    g.fillStyle = '#2a1036'; g.fillText(t, 10, yy + 12);                 // hard shadow
    g.lineWidth = size * 0.16; g.strokeStyle = '#140818'; g.strokeText(t, 0, yy);
    const gr = g.createLinearGradient(0, yy - size, 0, yy);
    gr.addColorStop(0, '#FFFFFF'); gr.addColorStop(1, '#FFE9B8');
    g.fillStyle = gr; g.fillText(t, 0, yy);
  });
  if (sticker) {
    const [txt, sx, sy] = sticker; g.translate(sx, sy); g.rotate(0.09);
    g.font = `900 ${size * 0.55}px "Impact",sans-serif`; const tw = g.measureText(txt).width;
    g.fillStyle = '#140818'; g.fillRect(-16 + 8, -size * 0.55 - 6 + 8, tw + 32, size * 0.72);
    g.fillStyle = '#FFE14D'; g.fillRect(-16, -size * 0.55 - 6, tw + 32, size * 0.72);
    g.fillStyle = '#140818'; g.fillText(txt, 0, 4);
  }
  g.restore();
}

function grade(g) {
  // warm sun-bleach + vignette + print texture
  g.globalCompositeOperation = 'soft-light'; g.globalAlpha = 0.35; g.drawImage(PRINT, 0, 0); g.globalAlpha = 1;
  g.globalCompositeOperation = 'screen'; const sun = g.createLinearGradient(0, 0, W, H);
  sun.addColorStop(0, 'rgba(255,120,170,0.10)'); sun.addColorStop(.6, 'rgba(255,200,140,0.06)'); sun.addColorStop(1, 'rgba(120,90,200,0.0)');
  g.fillStyle = sun; g.fillRect(0, 0, W, H);
  g.globalCompositeOperation = 'multiply'; const v = g.createRadialGradient(W / 2, H * .48, H * .3, W / 2, H * .5, H * .78);
  v.addColorStop(0, 'rgba(255,255,255,1)'); v.addColorStop(1, 'rgba(120,80,150,1)');
  g.globalAlpha = 0.45; g.fillStyle = v; g.fillRect(0, 0, W, H); g.globalAlpha = 1;
  g.globalCompositeOperation = 'source-over';
}

// ---- the 3 shots. Times (s): A beach bar 0-3.6 | bg swap 3.6-4.4 | B street 4.4-6.3 | char swap 6.3-7.0 | C car 7.0-9.5
function frame(g, T) {
  const A = ASSETS;
  g.fillStyle = '#F7A6B8'; g.fillRect(0, 0, W, H);
  // camera: ease-out push on each new shot + slow creep, like the ref's openings
  let z = 1, px = 0, py = 0;
  if (T < 4.4) { z = 1 + 0.10 * outCubic(lin(T, 0, 1.1)) + 0.035 * lin(T, 1.1, 4.4); py = -30 * outCubic(lin(T, 0, 1.1)); }
  else if (T < 7.0) { z = 1.06 + 0.07 * outCubic(lin(T, 4.4, 5.4)) + 0.03 * lin(T, 5.4, 7); px = -20 * lin(T, 4.4, 7); }
  else { z = 1.0 + 0.09 * outCubic(lin(T, 7.0, 8.0)) + 0.03 * lin(T, 8, 9.5); px = 18 * lin(T, 7, 9.5); }
  const cam = { z, px, py };

  // --- background swap (ref 4.0-4.8 s): old plate + fronds leave upward staggered, new plate rises from below
  const out1 = inCubic(lin(T, 3.6, 4.1)), outF = inCubic(lin(T, 3.55, 3.95)), in2 = outCubic(lin(T, 3.85, 4.45));
  if (T < 4.45) layer(g, A['bar_plate.jpg'], cam, 0.0, 0, -H * 1.05 * out1);
  if (T >= 3.85) layer(g, A['street_plate.jpg'], cam, 0.0, 0, H * 1.05 * (1 - in2));

  // --- man: rises in at the open, idles, gets shoved out right by the car (ref 6.0-6.8 s push-from-left)
  const shove = inCubic(lin(T, 6.3, 6.75));
  const manIn = outCubic(lin(T, 0, 0.9));
  const bob = Math.sin(T * 2.2) * 6;
  if (T < 6.8) {
    const bump = T > 3.85 && T < 4.6 ? -18 * Math.sin(Math.PI * lin(T, 3.85, 4.6)) : 0;
    layer(g, A['man.png'], cam, 0.55, -10 + W * 1.1 * shove, 360 + 160 * (1 - manIn) + bob + bump, 0.80);
  }

  // --- car slides in from the left, overshoots a hair and settles; woman follows 4 frames later
  const carP = lin(T, 6.25, 6.75), womP = lin(T, 6.6, 7.1);
  if (T >= 6.25) sprite(g, A['car.png'], cam, 0.5, -700 + (W * 0.62 + 700) * outBack(carP), 1560, 1150);
  if (T >= 6.6) {
    const sway = Math.sin((T - 7) * 1.8) * 5;
    layer(g, A['woman.png'], cam, 0.75, -W * 1.2 * (1 - outCubic(womP)) - 170, 300 + sway, 0.80);
  }

  // --- foreground: fronds drop in from the top, cash flies up from the bottom (ref 0-0.8 s)
  const fIn = outCubic(lin(T, 0, 0.8)), cIn = outCubic(lin(T, 0.05, 0.9));
  if (T < 3.95) layer(g, A['fronds.png'], cam, 1.0, 20 * Math.sin(T * 1.3), -560 - 420 * (1 - fIn) - H * 0.8 * outF);
  const cashOut = inCubic(lin(T, 3.55, 3.95));
  if (T < 3.95) layer(g, A['cash.png'], cam, 1.15, 0, 430 + 520 * (1 - cIn) + 600 * cashOut + Math.sin(T * 1.7) * 8, 0.95);
  // fronds come back on the street shot from the right side, deeper
  const f2 = outCubic(lin(T, 4.1, 4.7));
  if (T >= 4.1) layer(g, A['fronds.png'], cam, 0.95, 60, -500 * (1 - f2) - 640, 1.0, 0.92);

  grade(g);

  // titles (our own lettering)
  if (T > 0.35 && T < 3.5) title(g, ['SUNSHINE', 'STATE'], 90, 330, 150, lin(T, 0.35, 0.65) * (1 - lin(T, 3.25, 3.5)), -0.07, ['EP.1', 330, 175]);
  if (T > 7.4) title(g, ['KEYS TO', 'THE CITY'], 90, 340, 130, lin(T, 7.4, 7.75), -0.06);
}

window.renderFrame = function (t, canvas) {
  const cv = canvas || document.getElementById('c'); const g = cv.getContext('2d');
  if (!PRINT) PRINT = makePrint();
  const T = Math.floor(t * STEP + 1e-6) / STEP;          // everything on 2s
  g.save(); g.imageSmoothingQuality = 'high'; frame(g, T); g.restore();
};
if (!/export=1/.test(location.search)) {
  let t0 = performance.now();
  const loop = () => { if (window.renderFrame) window.renderFrame(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(loop); };
  (window.ASSETS_READY || Promise.resolve()).then(loop);
}
</script></body></html>
