<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luckier</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0d12; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { width: min(100vw, calc(100vh * 16 / 9)); height: auto; aspect-ratio: 16 / 9; display: block; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
"use strict";
// =====================================================================
//  WHAT IF YOU KEPT GETTING LUCKIER AND COULDN'T STOP? — 16:9, 8:30, 30 fps. Style pov3d-hd (character variant).
//  One person, third person. Every lucky break has someone on the other side who loses: a red counter keeps score.
//  It opens and closes on the same coin flip; the last one lands on its edge and, for once, nobody loses.
// =====================================================================
const FPS = 30, W = 1920, H = 1080;
const BPM = 120, BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4;
const DURATION = 510.0;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const SAFE = { top: 60, bottom: 60, right: 60 };
const HAND = 'Georgia, Cambria, "Times New Roman", serif';
const CX = W / 2;
const ERA_LIST = [[0, DURATION, () => sceneMain()]];
const SHOTS = [['look', 0, 0, DURATION, 'look check']];
const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE,
  format: 'F5',
  shots: SHOTS.map(([key, era, t0, t1, title], i) => ({ id: i + 1, key, era, t0, t1, title })),
  cuts: [], morphs: [], cues: {}, anchor: null, acts: [], board: [], narration: [],
};
window.TIMELINE = TIMELINE;
