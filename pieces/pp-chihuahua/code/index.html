<!doctype html>
<html><head><meta charset="utf-8"><title>pp-chihuahua code</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
(() => {
'use strict';
const W = 180, H = 320, S = 6;
const C = document.getElementById('c'), cx = C.getContext('2d');
const mk = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; return c; };
const L = mk(), LCTX = L.getContext('2d', { willReadFrequently: true });
let l = LCTX;
const M = mk(), mctx = M.getContext('2d', { willReadFrequently: true });
const O = mk(), OCTX = O.getContext('2d', { willReadFrequently: true });
let o = OCTX;
const NULLCTX = mk().getContext('2d');
const TMP = mk(), tg = TMP.getContext('2d');
const BGC = mk(), bgc = BGC.getContext('2d');

// ---------------- palette ----------------
const K = {
  skL: '#e0a49b', sk: '#dc968d', skS: '#b87066', skD: '#8e4f45', skM: '#cd8077', blu: '#e2898a', lp: '#b45a5e', lpL: '#c87074', rmV: '#1a0038', rmV2: '#2e1052', lip: '#c0364a', mD: '#4a0f18',
  tW: '#f4f1ee', tG: '#c9c4cc', ir: '#2a64c8', irD: '#0d2a6e', irL: '#5a94e8', rim: '#d0606a', brow: '#4a2a18',
  rmD: '#120a1e', rmP: '#3a2050', grid: '#050308', flL: '#c8c4d0', f1: '#ffb030', f2: '#ff6a10', f3: '#ff3a00',
  brW: '#f2f2f2', brG: '#c8c8d0', nail: '#37d317', nailD: '#1c9a2a', hg: '#616161', ol: '#1a1014',
  // extras (lighting ramps)
  skP1: '#c08088', skP2: '#94607a', skP3: '#5e3a66', skP4: '#3c2450', skW: '#eab4aa', pal: '#cb796f', palD: '#ad6258',
  lv1: '#4e3a6e', lv2: '#76689a', lv3: '#a49cbc', lv4: '#cfc8dc', pr2: '#26163a', pr3: '#1c1228',
  gy0: '#18161c', gy1: '#26242a', gy2: '#36343c', gy3: '#4a4850', gy4: '#5c5a62', gy5: '#82808a', gy6: '#9c9aa4',
  wm1: '#6a3428', wm2: '#a85a30', bone: '#ffe0a0', red: '#e8141c', redD: '#8a0a10', gum: '#a8243a', gumL: '#d65a6a',
  thr: '#2a0610', sclR: '#e49a98', scl: '#f0d4d0', wht: '#ffffff', blk: '#000000', tng: '#b22a44'
};
const PAL = Object.values(K).map(h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]);
const QC = new Int32Array(32768).fill(-1);
function qlookup(r, g, b) {
  const key = ((r >> 3) << 10) | ((g >> 3) << 5) | (b >> 3);
  let v = QC[key];
  if (v >= 0) return v;
  r = (r & 0xf8) | 4; g = (g & 0xf8) | 4; b = (b & 0xf8) | 4;
  let i1 = 0, d1 = 1e9, i2 = 0, d2 = 1e9;
  for (let i = 0; i < PAL.length; i++) {
    const p = PAL[i], dr = r - p[0], dg = g - p[1], db = b - p[2];
    const d = dr * dr * 0.3 + dg * dg * 0.59 + db * db * 0.11 + (dr * dr + dg * dg + db * db) * 0.25;
    if (d < d1) { d2 = d1; i2 = i1; d1 = d; i1 = i; } else if (d < d2) { d2 = d; i2 = i; }
  }
  const a = PAL[i1], c = PAL[i2];
  const vx = c[0] - a[0], vy = c[1] - a[1], vz = c[2] - a[2];
  const vv = vx * vx + vy * vy + vz * vz || 1;
  const t = ((r - a[0]) * vx + (g - a[1]) * vy + (b - a[2]) * vz) / vv;
  const flag = t > 0.27 ? 1 : 0;
  v = i1 | (i2 << 8) | (flag << 16);
  QC[key] = v;
  return v;
}
function quantize() {
  const id = l.getImageData(0, 0, W, H), d = id.data;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const k = (y * W + x) * 4;
    const v = qlookup(d[k], d[k + 1], d[k + 2]);
    const pi = ((v >> 16) && ((x + y) & 1)) ? (v >> 8) & 255 : v & 255;
    const p = PAL[pi];
    d[k] = p[0]; d[k + 1] = p[1]; d[k + 2] = p[2]; d[k + 3] = 255;
  }
  l.putImageData(id, 0, 0);
}

// ---------------- RNG ----------------
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

// ---------------- drawing helpers ----------------
let sc = 1; const stk = [];
function push(x, y, sx, sy, r) {
  if (sy === undefined) sy = sx;
  stk.push(sc);
  for (const g of [l, o]) { g.save(); g.translate(x, y); if (r) g.rotate(r); g.scale(sx, sy); }
  sc *= Math.sqrt(Math.abs(sx * sy));
}
function pop() { l.restore(); o.restore(); sc = stk.pop(); }
function path(g, p, closed = true, smooth = true) {
  g.beginPath();
  const n = p.length / 2;
  if (!smooth || n < 3) {
    g.moveTo(p[0], p[1]);
    for (let i = 1; i < n; i++) g.lineTo(p[2 * i], p[2 * i + 1]);
    if (closed) g.closePath();
    return;
  }
  if (closed) {
    g.moveTo((p[2 * n - 2] + p[0]) / 2, (p[2 * n - 1] + p[1]) / 2);
    for (let i = 0; i < n; i++) {
      const j = (i + 1) % n;
      g.quadraticCurveTo(p[2 * i], p[2 * i + 1], (p[2 * i] + p[2 * j]) / 2, (p[2 * i + 1] + p[2 * j + 1]) / 2);
    }
    g.closePath();
  } else {
    g.moveTo(p[0], p[1]);
    for (let i = 1; i < n - 1; i++) g.quadraticCurveTo(p[2 * i], p[2 * i + 1], (p[2 * i] + p[2 * i + 2]) / 2, (p[2 * i + 1] + p[2 * i + 3]) / 2);
    g.lineTo(p[2 * n - 2], p[2 * n - 1]);
  }
}
function F(p, col, smooth = true) { l.fillStyle = col; path(l, p, true, smooth); l.fill(); }
function OL(p, closed = true, smooth = true, w = 1, col = K.ol) { o.strokeStyle = col; o.lineWidth = w / sc; o.lineJoin = 'round'; o.lineCap = 'round'; path(o, p, closed, smooth); o.stroke(); }
function FO(p, col, smooth = true) { F(p, col, smooth); OL(p, true, smooth); }
function LN(p, col, w = 1, smooth = true) { OL(p, false, smooth, w, col); }
function E(x, y, rx, ry, col, r = 0) { l.fillStyle = col; l.beginPath(); l.ellipse(x, y, Math.abs(rx), Math.abs(ry), r, 0, 6.2832); l.fill(); }
function EO(x, y, rx, ry, w = 1, col = K.ol) { o.strokeStyle = col; o.lineWidth = w / sc; o.beginPath(); o.ellipse(x, y, Math.abs(rx), Math.abs(ry), 0, 0, 6.2832); o.stroke(); }
function lg(x0, y0, x1, y1, stops) { const g = l.createLinearGradient(x0, y0, x1, y1); for (let i = 0; i < stops.length; i += 2) g.addColorStop(stops[i], stops[i + 1]); return g; }
function rg(x, y, r0, r1, stops) { const g = l.createRadialGradient(x, y, r0, x, y, r1); for (let i = 0; i < stops.length; i += 2) g.addColorStop(stops[i], stops[i + 1]); return g; }
function rect(x, y, w, h, col) { l.fillStyle = col; l.fillRect(x, y, w, h); }
// outline/line mask -> crisp pixels in L
function flush() {
  const a = o.getImageData(0, 0, W, H).data;
  const id = l.getImageData(0, 0, W, H), d = id.data;
  let any = false;
  for (let k = 0; k < a.length; k += 4) {
    if (a[k + 3] > 105) { d[k] = a[k]; d[k + 1] = a[k + 1]; d[k + 2] = a[k + 2]; d[k + 3] = 255; any = true; }
  }
  if (any) l.putImageData(id, 0, 0);
  o.setTransform(1, 0, 0, 1, 0, 0); o.clearRect(0, 0, W, H);
  // restore current transform stack of o is lost by setTransform; we only flush at stack depth 0
}
function hexRGB(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
// draw fn (mono) into a mask with the current transform and write its silhouette edge into the outline layer
function outlineOf(fn, col = K.ol) {
  const tr = l.getTransform();
  mctx.setTransform(1, 0, 0, 1, 0, 0); mctx.clearRect(0, 0, W, H); mctx.setTransform(tr);
  const keep = l, keepSc = sc; l = mctx; l.filter = 'none'; l.globalAlpha = 1;
  const keepO = o; o = NULLCTX;
  try { fn(); } finally { l = keep; o = keepO; sc = keepSc; }
  const m = mctx.getImageData(0, 0, W, H).data; const od = o.getImageData(0, 0, W, H), d = od.data; const c = hexRGB(col);
  const T = 120, rw = W * 4;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const a = (y * W + x) * 4;
    if (m[a + 3] <= T) continue;
    if ((x > 0 && m[a - 1] <= T) || (x < W - 1 && m[a + 7] <= T) || (y > 0 && m[a - rw + 3] <= T) || (y < H - 1 && m[a + rw + 3] <= T)) { d[a] = c[0]; d[a + 1] = c[1]; d[a + 2] = c[2]; d[a + 3] = 255; }
  }
  o.putImageData(od, 0, 0);
}
const LY = mk(), ly = LY.getContext('2d');
const H_ = H;
function inMask(fn, alpha = 1) {
  ly.setTransform(1, 0, 0, 1, 0, 0); ly.clearRect(0, 0, W, H); ly.setTransform(l.getTransform());
  const keep = l; l = ly; try { fn(); } finally { l = keep; }
  ly.setTransform(1, 0, 0, 1, 0, 0); ly.globalCompositeOperation = 'destination-in'; ly.drawImage(M, 0, 0); ly.globalCompositeOperation = 'source-over';
  const tr = l.getTransform(); l.setTransform(1, 0, 0, 1, 0, 0); l.globalAlpha = alpha; l.drawImage(LY, 0, 0); l.globalAlpha = 1; l.setTransform(tr);
}
function rimLight(dx, dy, col) {
  ly.setTransform(1, 0, 0, 1, 0, 0); ly.clearRect(0, 0, W, H); ly.drawImage(M, 0, 0);
  ly.globalCompositeOperation = 'source-in'; ly.fillStyle = col; ly.fillRect(0, 0, W, H);
  ly.globalCompositeOperation = 'destination-out'; ly.drawImage(M, -dx, -dy); ly.globalCompositeOperation = 'source-over';
  const tr = l.getTransform(); l.setTransform(1, 0, 0, 1, 0, 0); l.drawImage(LY, 0, 0); l.setTransform(tr);
}
function flushAt() { const tr = o.getTransform(); flush(); o.setTransform(tr); }
function clip(p, fn, smooth = true) { l.save(); path(l, p, true, smooth); l.clip(); o.save(); path(o, p, true, smooth); o.clip(); try { fn(); } finally { o.restore(); l.restore(); } }
function smear(dx, dy, n, a = 0.35) {
  tg.setTransform(1, 0, 0, 1, 0, 0); tg.clearRect(0, 0, W, H); tg.drawImage(L, 0, 0);
  l.save(); l.setTransform(1, 0, 0, 1, 0, 0);
  for (let i = 1; i <= n; i++) { l.globalAlpha = a; l.drawImage(TMP, dx * i / n, dy * i / n); l.globalAlpha = a; l.drawImage(TMP, -dx * i / n * 0.5, -dy * i / n * 0.5); }
  l.restore();
}
const lerp = (a, b, t) => a + (b - a) * t;
const cl = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const ss = (a, b, t) => { const x = cl((t - a) / (b - a)); return x * x * (3 - 2 * x); };
const on2 = t => Math.floor(t * 15 + 1e-6) / 15;
// limb polygon from a centre polyline and widths
function limbPts(p, w) {
  const n = p.length / 2, A = [], B = [];
  for (let i = 0; i < n; i++) {
    const i0 = Math.max(0, i - 1), i1 = Math.min(n - 1, i + 1);
    let dx = p[2 * i1] - p[2 * i0], dy = p[2 * i1 + 1] - p[2 * i0 + 1];
    const len = Math.hypot(dx, dy) || 1; dx /= len; dy /= len;
    const nx = -dy, ny = dx, ww = w[i] / 2;
    A.push(p[2 * i] + nx * ww, p[2 * i + 1] + ny * ww);
    B.push(p[2 * i] - nx * ww, p[2 * i + 1] - ny * ww);
  }
  const out = A.slice();
  for (let i = n - 1; i >= 0; i--) out.push(B[2 * i], B[2 * i + 1]);
  return out;
}

// ---------------- eye ----------------
// x,y centre, r iris radius, lx look offset, opts {rimW, socket, lid, big}
function eye(x, y, r, lx, ly, op = {}) {
  const w = op.w || r * 1.9, h = op.h || r * 1.25;
  if (op.socket !== false) E(x + r * 0.1, y + r * 0.25, w * 1.25, h * 1.55, op.sockCol || K.skS);
  if (op.bag) E(x, y + h * 1.1, w * 1.05, h * 0.7, op.bagCol || K.skD);
  const al = [x - w, y + h * 0.1, x - w * 0.45, y - h * 0.95, x + w * 0.4, y - h, x + w, y - h * 0.05, x + w * 0.45, y + h * 0.85, x - w * 0.4, y + h * 0.8];
  F(al, K.rim);
  const inner = al.map((v, i) => (i % 2 ? y + (v - y) * 0.78 : x + (v - x) * 0.82));
  F(inner, op.scl || K.scl);
  clip(inner, () => {
    const ix = x + lx, iy = y + ly;
    E(ix, iy, r, r, K.irD);
    E(ix, iy, r * 0.82, r * 0.82, K.ir);
    if (op.big) {
      l.strokeStyle = K.irL; l.lineWidth = Math.max(0.35, r * 0.06);
      for (let a = 0; a < 24; a++) { const an = a / 24 * 6.2832; l.beginPath(); l.moveTo(ix + Math.cos(an) * r * 0.42, iy + Math.sin(an) * r * 0.42); l.lineTo(ix + Math.cos(an) * r * 0.78, iy + Math.sin(an) * r * 0.78); l.stroke(); }
    }
    E(ix, iy, r * 0.38, r * 0.38, K.blk);
    E(ix - r * 0.35, iy - r * 0.35, Math.max(0.55 / sc, r * 0.16), Math.max(0.55 / sc, r * 0.16), K.wht);
  });
  // upper lid line
  LN([x - w * 1.02, y + h * 0.12, x - w * 0.45, y - h * 0.98, x + w * 0.4, y - h * 1.02, x + w * 1.0, y - h * 0.05], K.ol, op.lidW || 1);
  if (op.rimLine) LN([x - w * 0.9, y + h * 0.25, x - w * 0.3, y + h * 0.85, x + w * 0.45, y + h * 0.85, x + w * 0.95, y + h * 0.05], K.rim, op.rimLine);
}

// ---------------- 3/4 head (facing left) ----------------
// origin = under jaw, units ~ px at s=1. p: {m mouth 0..1, eyeS, earS, k (0 normal -> 1 apple-skull), lx}
function head3q(p) {
  const m = p.m, J = m * 8.5, eS = p.eyeS || 1, aS = p.earS || 1, k = p.k || 0;
  const bk = k * 16, cr = k * 6; // skull grows back and up
  const sil = [-14, -96 - cr, 6 + bk * 0.4, -95 - cr, 18 + bk * 0.8, -88 - cr * 0.8, 25 + bk, -74, 28 + bk, -56, 27 + bk * 0.8, -40, 25 + bk * 0.4, -27, 21, -14, 8, -4,
    -6, J * 0.5, -18, 2 + J, -27, -1 + J, -31, -7 + J, -34, -14 + J * 0.6, -35, -22, -34, -27, -33, -30, -37.5, -33, -35, -39, -33, -43, -36, -48, -37.5, -53, -35.5, -63, -31, -77, -24, -89 - cr * 0.5];
  // neck
  const Ln = p.neckLen || 40;
  const neck = [-9, -2, 22, -18, 24 + k * 2, Ln - 8, 34, Ln, -16, Ln, -7 + k * 4, Ln - 8];
  F(neck, K.sk);
  clip(neck, () => { F([4, -10, 24, -18, 26, Ln, 12, Ln, 6, 8], K.skS); F([-9, -2, 4, -6, 0, 12, -8, 14], K.skS); });
  const Lo = p.neckOL || Ln; OL([22, -18, 24 + k * 2, Lo], false, false); OL([-8, 6, -7 + k * 4, Lo], false, false);
  F(sil, K.sk);
  clip(sil, () => {
    // crown / forehead light planes
    F([-34, -62, -30, -80, -18, -94 - cr, 6, -96 - cr, 16, -84, 10, -70, -4, -64, -22, -60], K.skL);
    E(2 + bk * 0.3, -86 - cr, 11, 5, K.skW, -0.25);
    // temple + side skull shade
    F([4, -64, 18, -76, 30 + bk, -66, 30 + bk, -36, 18, -34, 12, -46], K.skM);
    // eye sockets (brow shadow)
    F([-30, -50, -20, -54, -6, -52, -2, -44, -8, -39, -22, -38, -30, -42], K.skS);
    F([-37, -51, -33, -51, -31, -44, -35, -40], K.skS);
    // cheekbone light
    E(-8, -35, 8, 4.2, K.skL, -0.35);
    // lower-face shade band (under cheekbone to jaw)
    F([-20, -27, -6, -26, 10, -31, 22, -30, 24, -16, 10, -5, -4, 0 + J * 0.5, -14, -6 + J * 0.6, -18, -18], K.skM);
    // jaw underside / neck shadow
    F([26 + bk * 0.4, -26, 22, -12, 8, -3, -6, 1 + J * 0.5, -8, 8, 30, 8], K.skS);
    // nasolabial fold
    F([-29, -31, -26, -29, -21, -21, -18, -11, -21, -11, -25, -20, -29, -28], K.skD);
    // nose: side plane + bridge light
    F([-26, -47, -24, -40, -26, -32, -31, -30, -33, -35, -30, -43], K.skS);
    F([-32, -47, -34, -40, -37, -34, -35, -42], K.skL);
    // chin light
    E(-22, -2 + J, 4, 2.2, K.skL);
    // lip ring
    E(-25, -14 + J * 0.5, 11, 6.5 + J * 0.6, K.skM);
  });
  // forehead wrinkles
  for (let i = 0; i < 3; i++) LN([-30, -64 - i * 5, -20, -67 - i * 5, -8, -66 - i * 5, 2, -68 - i * 5], K.skS, 1);
  LN([-26, -44, -28, -38], K.skS, 1);
  // ear
  push(18 + bk * 0.9, -36 - k * 6, aS, aS);
  const ear = [-3, -12, 2, -15, 7, -13, 9, -5, 8, 4, 5, 11, 0, 13, -3, 7, -2, -1];
  F(ear, K.sk);
  F([-1, -10, 3, -12, 6, -8, 6, 1, 4, 8, 1, 9, 0, 2], K.skS);
  F([0, -3, 3, -4, 3, 3, 1, 5], K.skD);
  LN([1, -11, 5, -11, 7, -6], K.skL, 0.8);
  OL(ear);
  pop();
  // brows (angry: inner end low)
  F([-29, -48, -25, -54, -18, -57, -6, -55, -3, -52, -14, -53, -22, -51, -27, -46], K.brow);
  F([-38, -50, -36, -54, -32, -54, -31, -52, -35, -50], K.brow);
  // eyes
  const ew = Math.max(1, eS * 0.92);
  eye(-15, -45, 2.4 * eS, -0.7 * eS + (p.lx || 0), 0, { w: 4.6 * ew, h: 2.8 * ew, socket: false, bag: eS > 1.25, bagCol: K.skS });
  eye(-32.5, -45, 2.0 * eS, -0.6 * eS + (p.lx || 0), 0, { w: 2.5 * ew, h: 2.6 * ew, socket: false });
  // nostril
  F([-34, -31.5, -30, -32.5, -27, -30.5, -30, -29.5], K.mD);
  LN([-27, -34, -24, -31, -26, -28], K.skD, 1);
  // mouth
  mouth3q(-25, -15 + J * 0.45, 9.6, 2.4 + J * 0.8, m);
  OL(sil, true, true, 1);
}
function mouth3q(x, y, w, h, m) {
  const outer = [x - w, y - h * 0.15, x - w * 0.55, y - h * 1.05, x + w * 0.35, y - h * 1.05, x + w, y - h * 0.15, x + w * 0.5, y + h * 1.0, x - w * 0.55, y + h * 0.95];
  F(outer.map((v, i) => i % 2 ? y + (v - y) * 1.25 + 0.6 : x + (v - x) * 1.15), K.skD);
  F(outer, K.lip);
  if (m < 0.08) { LN([x - w, y, x, y + 0.5, x + w, y], K.mD, 1); return; }
  const inner = outer.map((v, i) => i % 2 ? y + (v - y) * 0.78 : x + (v - x) * 0.84);
  F(inner, K.gum);
  clip(inner, () => {
    E(x + w * 0.3, y - h * 0.1, w * 0.6, h * 0.65, K.mD);
    E(x - w * 0.05, y + h * 0.95, w * 0.8, h * 0.5, K.tng);
    // upper teeth
    F([x - w, y - h * 1.3, x + w * 0.45, y - h * 1.3, x + w * 0.4, y - h * 0.62, x - w * 0.95, y - h * 0.5], K.tW, false);
    rect(x - w * 0.35, y - h * 1.2, Math.max(0.5 / sc, 0.3), h * 0.6, K.tG);
    rect(x - w * 0.95, y - h * 0.68, w * 1.35, Math.max(0.5 / sc, h * 0.1), K.tG);
    if (m > 0.35) {
