<script>
"use strict";
// =====================================================================
//  ¿QUÉ PASARÍA SI EL INFIERNO FUERA REAL? — 9:16, 70 s, 24 fps.
//  A night fiesta in a colonial plaza. A bang: your heart stops in the middle of the party. You see yourself lying
//  there, expect to go up — and fall, through a tunnel of fire, into a lake of fire with millions of people. You
//  remember everything; you beg for a drop of water; far away you see heaven, across a gap no one can cross.
//  No rest, day or night. It was made for the devil — not for you. And it never ends.
// =====================================================================
const FPS = 24, W = 1080, H = 1920;
const BPM = 120, BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4;
const DURATION = 70.0;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const SAFE = { top: 240, bottom: 420, right: 140 };
const HAND = 'Georgia, Cambria, "Times New Roman", serif';
const CX = 540;

const ERA_LIST = [[0, 70, () => sceneMain()]];
// [key, t0, t1, title] — owners: fiesta.js (party, bang, body, memory, phone), fall.js (rise, tunnel, fireball),
// hell.js (lake, crowd, water, heaven, rest, devil, blaze, never); main.js (silence, card)
const SHOTS = [
  ['party',    0,    3.5,  'la fiesta de noche; título'],
  ['bang',     3.5,  4.75,  'un estallido; caes al suelo'],
  ['body',     4.75, 9.0,  'te ves tirado en la calle; subes'],
  ['rise',     9.0,  11.0, 'esperas subir: una luz arriba'],
  ['tunnel',   11.0, 16.0, 'pero caes: el túnel de fuego'],
  ['fireball', 16.0, 18.0, 'cada segundo más calor: la bola de fuego'],
  ['lake',     18.0, 26.0, 'un lago de fuego; millones de personas'],
  ['crowd',    26.0, 31.0, 'caes entre ellos; no hay salida'],
  ['memory',   31.0, 34.0, 'recuerdas todo: la fiesta'],
  ['phone',    34.0, 37.0, 'cada oportunidad que tuviste: el teléfono'],
  ['water',    37.0, 43.0, 'ruegas por una gota de agua'],
  ['heaven',   43.0, 49.0, 'el cielo a lo lejos; el abismo'],
  ['rest',     49.0, 55.0, 'sin descanso; el humo sube'],
  ['devil',    55.0, 57.75, 'fue preparado para el diablo'],
  ['silence',  57.75, 58.5, 'silencio'],
  ['blaze',    58.5, 63.0, 'no para ti: todo arde'],
  ['never',    63.0, 67.0, 'y nunca termina'],
  ['card',     67.0, 70.0, 'tarjeta'],
];
const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE,
  format: 'F5',
  shots: SHOTS.map(([key, t0, t1, title], i) => ({ id: i + 1, key, era: 0, t0, t1, title })),
  cuts: SHOTS.slice(1).map((s) => s[1]), morphs: [],
  cues: { bang: 3.5, fall: 11.0, lake: 18.0, heaven: 43.0, blaze: 58.5, card: 67.0 },
  acts: [
    { name: '1 La fiesta', role: 'build', t0: 0, t1: 4.75 },
    { name: '2 La caída', role: 'turn', t0: 4.75, t1: 18 },
    { name: '3 El lago', role: 'journey', t0: 18, t1: 43 },
    { name: '4 El abismo', role: 'peak', t0: 43, t1: 57.75 },
    { name: '5 Silencio', role: 'silence', t0: 57.75, t1: 58.5 },
    { name: '6 No para ti', role: 'gift', t0: 58.5, t1: 63 },
    { name: '7 Nunca termina', role: 'goodbye', t0: 63, t1: 70 },
  ],
  board: [[2.0, 'título, la fiesta'], [4.2, 'el estallido'], [6.6, 'tu cuerpo'], [10.0, 'esperas subir'], [12.6, 'pero caes'], [14.8, 'más hondo'], [17.0, 'la bola de fuego'], [20.0, 'el lago de fuego'], [24.0, 'millones de personas'], [28.5, 'no hay salida'], [32.5, 'recuerdas todo'], [35.5, 'el teléfono'], [39.0, 'una gota de agua'], [41.8, 'nunca llega'], [45.0, 'el cielo'], [47.5, 'el abismo'], [51.0, 'sin descanso'], [53.5, 'el humo'], [56.4, 'el diablo'], [60.5, 'no para ti'], [65.0, 'nunca termina'], [69.0, 'tarjeta']].map(([t, title]) => ({ t, title, sound: '', next: '' })),
  narration: [],
};
window.TIMELINE = TIMELINE;
