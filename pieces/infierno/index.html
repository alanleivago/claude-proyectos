"use strict";
// =====================================================================
//  ¿QUÉ PASARÍA SI EL INFIERNO FUERA REAL? — 9:16, 70 s, 24 fps.
//  A night fiesta in a colonial plaza. A bang: your heart stops in the middle of the party. You see yourself lying
//  there, expect to go up — and fall, through a tunnel of fire, into a lake of fire with millions of people. You
//  remember everything; you beg for a drop of water; far away you see heaven, across a gap no one can cross.
//  No rest, day or night. It was made for the devil — not for you. And it never ends.

const FPS = 24, W = 1080, H = 1920;

const DURATION = 70.0;

const CX = 540;

const ERA_LIST = [[0, 70, () => sceneMain()]];
// [key, t0, t1, title] — owners: fiesta.js (party, bang, body, memory, phone), fall.js (rise, tunnel, fireball),
// hell.js (lake, crowd, water, heaven, rest, devil, blaze, never); main.js (silence, card)
const SHOTS = [

  ['bang',     3.5,  4.75,  'un estallido; caes al suelo'],

  ['rise',     9.0,  11.0, 'esperas subir: una luz arriba'],
  ['tunnel',   11.0, 16.0, 'pero caes: el túnel de fuego'],

  ['lake',     18.0, 26.0, 'un lago de fuego; millones de personas'],
  ['crowd',    26.0, 31.0, 'caes entre ellos; no hay salida'],
  ['memory',   31.0, 34.0, 'recuerdas todo: la fiesta'],
  ['phone',    34.0, 37.0, 'cada oportunidad que tuviste: el teléfono'],
  ['water',    37.0, 43.0, 'ruegas por una gota de agua'],
  ['heaven',   43.0, 49.0, 'el cielo a lo lejos; el abismo'],
  ['rest',     49.0, 55.0, 'sin descanso; el humo sube'],
  ['devil',    55.0, 57.75, 'fue preparado para el diablo'],

  ['card',     67.0, 70.0, 'tarjeta'],

const TIMELINE = {

  format: 'F5',

  cuts: SHOTS.slice(1).map((s) => s[1]), morphs: [],
  cues: { bang: 3.5, fall: 11.0, lake: 18.0, heaven: 43.0, blaze: 58.5, card: 67.0 },
  acts: [
    { name: '1 La fiesta', role: 'build', t0: 0, t1: 4.75 },
    { name: '2 La caída', role: 'turn', t0: 4.75, t1: 18 },
    { name: '3 El lago', role: 'journey', t0: 18, t1: 43 },
    { name: '4 El abismo', role: 'peak', t0: 43, t1: 57.75 },
    { name: '5 Silencio', role: 'silence', t0: 57.75, t1: 58.5 },
    { name: '6 No para ti', role: 'gift', t0: 58.5, t1: 63 },
    { name: '7 Nunca termina', role: 'goodbye', t0: 63, t1: 70 },

window.TIMELINE = TIMELINE;
// =====================================================================
//  kit/core.js — seeded RNG, math, easing, palette, geometry, the hand-drawn drawing kit
//  (wobble on the boil, ink, paint, hatch, pencil, stipple, grain), cameras, mono text.
//  Needs from the piece head: FPS, W, H. Render state: ctx, F (frame), B (boil = floor(F/2)).
// =====================================================================

// ---------------------------------------------------------------------
//  seeded RNG
// ---------------------------------------------------------------------
function mulberry32(a) {

    i: (a, b) => a + Math.floor(f() * (b - a + 1)),
    pick: (arr) => arr[Math.floor(f() * arr.length)],

// ---------------------------------------------------------------------
//  math
// ---------------------------------------------------------------------
const TAU = Math.PI * 2, DEG = Math.PI / 180;
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
// has absolute time t reached cut time c? (cuts snap to the nearest frame, like shot boundaries)
const past = (t, c) => Math.round(t * FPS + 1e-6) >= Math.round(c * FPS);
const dist = (a, b) => Math.hypot(b[0] - a[0], b[1] - a[1]);
const EZ = {
  o2: (t) => 1 - (1 - clamp(t)) ** 2,
  o3: (t) => 1 - (1 - clamp(t)) ** 3,
  i2: (t) => clamp(t) ** 2,
  i3: (t) => clamp(t) ** 3,
  io: (t) => { t = clamp(t); return t < 0.5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2; },
  back: (t) => { t = clamp(t) - 1; return 1 + 2.70158 * t * t * t + 1.70158 * t * t; },

// ---------------------------------------------------------------------
//  render state
// ---------------------------------------------------------------------
let ctx = null;   // current 2d context
let F = 0;        // absolute frame index
let B = 0;        // boil index — reseeds every 2 frames (Math.floor(t*12))

const C = {
  ink: '#3a2417', cream: '#efe5cf', paper: '#f4ecd9', paperLine: 'rgba(90,130,190,0.32)',
  orange: '#e58a4e', orangeD: '#c3622e', orangeL: '#f4b27c', terra: '#d97757',
  rose: '#d98b8b', roseD: '#b0616a', roseL: '#efb9b0',
  wood: '#d6a466', woodD: '#a8773f', woodL: '#e9c48f',
  sky: '#9cc4d6', skyD: '#6f9fb8', skyL: '#c9e1ea',
  teal: '#3d9f96', tealL: '#86c9be',
  yellow: '#f0c55a', yellowL: '#f7dd92',
  green: '#5f9c5c', greenL: '#a3cf92',
  red: '#d4382c', redL: '#ea7a6c',
  skin: '#ebb68f', skinD: '#c7815d', skinL: '#f7d4b4',
  lav: 'rgba(104,112,214,0.7)', lavS: 'rgba(104,112,214,0.42)',
  navy: '#0c0d1c', navy2: '#15173a', peri: '#c8d0f0', periD: '#7c86c4', periS: 'rgba(150,164,230,0.20)',
  cyan: '#52d6c4', mag: '#e0368f', glow: '#5de37a', white: '#f4f6ff',
};
const RAINBOW = ['#f0d042', '#e050b8', '#46cde0', '#7ad866', '#a47ef0'];
const MONO = 'Consolas, "Cascadia Mono", Menlo, "DejaVu Sans Mono", "Courier New", monospace';   // Windows first, then macOS / Linux

// ---------------------------------------------------------------------
//  geometry
// ---------------------------------------------------------------------
function ellipsePts(cx, cy, rx, ry, rot = 0, n = 64, a0 = 0, a1 = TAU) {
  const P = [], c = Math.cos(rot), s = Math.sin(rot), full = Math.abs(a1 - a0 - TAU) < 1e-6;
  for (let i = 0; i < n; i++) {
    const a = a0 + (a1 - a0) * i / (full ? n : n - 1);
    const x = Math.cos(a) * rx, y = Math.sin(a) * ry;
    P.push([cx + x * c - y * s, cy + x * s + y * c]);
  }
  return P;
}
function rrectPts(x, y, w, h, r, n = 6) {
  r = Math.min(r, w / 2, h / 2);
  const P = [], cs = [[x + w - r, y + r, -Math.PI / 2], [x + w - r, y + h - r, 0], [x + r, y + h - r, Math.PI / 2], [x + r, y + r, Math.PI]];
  for (const [cx, cy, a0] of cs) for (let i = 0; i <= n; i++) { const a = a0 + (Math.PI / 2) * i / n; P.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); }
  return P;
}
function arcPts(cx, cy, r, a0, a1, n = 18, sy = 1) {
  const P = [];
  for (let i = 0; i <= n; i++) { const a = a0 + (a1 - a0) * i / n; P.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r * sy]); }
  return P;
}
function xform(P, tx, ty, rot = 0, sx = 1, sy = sx) {
  const c = Math.cos(rot), s = Math.sin(rot);
  return P.map(([x, y]) => [tx + x * sx * c - y * sy * s, ty + x * sx * s + y * sy * c]);
}
function bbox(P, pad = 0) {
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const [x, y] of P) { if (x < x0) x0 = x; if (y < y0) y0 = y; if (x > x1) x1 = x; if (y > y1) y1 = y; }

function resample(P, closed, step) {

    for (let j = 0; j < k; j++) out.push([a[0] + (b[0] - a[0]) * j / k, a[1] + (b[1] - a[1]) * j / k]);

}

    if (want >= d) { out.push(P[i]); want -= d; }
    else { const k = want / (d || 1); out.push([lerp(P[i - 1][0], P[i][0], k), lerp(P[i - 1][1], P[i][1], k)]); break; }

}
function pointAt(P, frac) { const S = subPath(P, frac); return S[S.length - 1]; }

// ---------------------------------------------------------------------
//  drawing kit — boil, sketchy lines, hatching, stipple, pencil, grain
// ---------------------------------------------------------------------
// smooth hand wobble along the normal; reseeded every boil step
function wobble(P, closed, amt, key, step = 7) {
  const Q = resample(P, closed, step), n = Q.length;
  const R = RNG('wob', key, B);
  const f1 = R.r(0.012, 0.03), f2 = R.r(0.05, 0.1), p1 = R.r(0, TAU), p2 = R.r(0, TAU);
  const sx = R.n(amt * 0.5), sy = R.n(amt * 0.5);
  const out = new Array(n); let s = 0;
  for (let i = 0; i < n; i++) {
    const a = Q[closed ? (i - 1 + n) % n : Math.max(0, i - 1)], b = Q[closed ? (i + 1) % n : Math.min(n - 1, i + 1)];
    const nx = a[1] - b[1], ny = b[0] - a[0], l = Math.hypot(nx, ny) || 1;
    if (i) s += dist(Q[i - 1], Q[i]);
    const o = amt * (0.75 * Math.sin(s * f1 + p1) + 0.35 * Math.sin(s * f2 + p2));
    out[i] = [Q[i][0] + nx / l * o + sx, Q[i][1] + ny / l * o + sy];
  }

}
function trace(P, closed) {
  ctx.beginPath();
  const n = P.length; if (n < 2) return;
  if (closed) {
    ctx.moveTo((P[n - 1][0] + P[0][0]) / 2, (P[n - 1][1] + P[0][1]) / 2);
    for (let i = 0; i < n; i++) { const p = P[i], q = P[(i + 1) % n]; ctx.quadraticCurveTo(p[0], p[1], (p[0] + q[0]) / 2, (p[1] + q[1]) / 2); }
    ctx.closePath();
  } else {
    ctx.moveTo(P[0][0], P[0][1]);
    for (let i = 1; i < n - 1; i++) { const p = P[i], q = P[i + 1]; ctx.quadraticCurveTo(p[0], p[1], (p[0] + q[0]) / 2, (p[1] + q[1]) / 2); }
    ctx.lineTo(P[n - 1][0], P[n - 1][1]);
  }

// sketchy stroke. o: closed, color, w, amt, key, alpha, frac (write-on), double
function ink(P, o = {}) {
  const closed = !!o.closed, key = o.key ?? 'ink';
  let Q = o.raw ? P : wobble(P, closed, o.amt ?? 1.8, key);
  let cl = closed;
  if (o.frac != null && o.frac < 1) { if (o.frac <= 0) return Q; Q = subPath(closed ? [...Q, Q[0]] : Q, o.frac); cl = false; }
  ctx.strokeStyle = o.color || C.ink; ctx.lineWidth = o.w ?? 3; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.globalAlpha = o.alpha ?? 1;
  trace(Q, cl); ctx.stroke();

    let Q2 = wobble(P, closed, (o.amt ?? 1.8) * 1.6 + 0.8, key + '~');
    if (!cl && closed) Q2 = subPath([...Q2, Q2[0]], o.frac ?? 1);
    ctx.lineWidth = (o.w ?? 3) * 0.4; ctx.globalAlpha = (o.alpha ?? 1) * 0.55; trace(Q2, cl); ctx.stroke();
  }

}
// filled shape + textures (clipped) + ink outline
function paint(P, o = {}) {
  const key = o.key || 'paint';
  const Q = o.raw ? P : wobble(P, true, o.amt ?? 1.6, key);
  ctx.save();
  trace(Q, true);
  if (o.fill) { ctx.globalAlpha = o.fillAl ?? 1; ctx.fillStyle = o.fill; ctx.fill(); ctx.globalAlpha = 1; }
  if (o.tex) { ctx.clip(); const bb = bbox(Q, 6); o.tex.forEach((t, i) => texture(bb, { key: key + ':' + i, ...t })); }
  ctx.restore();
  if (o.line !== false) {
    ctx.strokeStyle = o.line || C.ink; ctx.lineWidth = o.w ?? 3; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.globalAlpha = o.lineAl ?? 1; trace(Q, true); ctx.stroke(); ctx.globalAlpha = 1;

function texture(bb, t) {

// parallel hatching inside current clip. t: a angle, gap, c, w, al, dash [min,max], skip, dens(x,y)
function hatch(bb, t) {

  const cx = (bb.x0 + bb.x1) / 2, cy = (bb.y0 + bb.y1) / 2, rad = Math.hypot(bb.x1 - bb.x0, bb.y1 - bb.y0) / 2 + 4;
  const ca = Math.cos(a), sa = Math.sin(a), dens = t.dens, jit = t.jit ?? 0.9, dash = t.dash;
  ctx.beginPath();

    let u = -rad + (dash ? S.r(0, dash[1]) : 0);
    while (u < rad) {

      const mu = (u + u2) / 2, mx = cx + ca * mu - sa * dd, my = cy + sa * mu + ca * dd, p = S.f();

  const a = t.a ?? -0.95, L = t.len ?? 14, dens = t.dens;

  }

}
// square stipple dots
function stipple(bb, t) {
  const S = RNG('ss', t.key), R = RNG('sj', t.key, B);
  const n = t.n ?? 400, sz = t.s ?? 2.2, dens = t.dens, jit = t.jit ?? 0.8;

// screen-space paper grain, reseeded with the boil
function grain(o = {}) {
  ctx.save(); screen();

  ctx.fillStyle = o.dark || 'rgba(70,45,25,0.13)'; ctx.beginPath();
  for (let i = 0; i < n; i++) ctx.rect(R.r(0, W), R.r(0, H), 1.7, 1.7);
  ctx.fill();

  for (let i = 0; i < n; i++) ctx.rect(R.r(0, W), R.r(0, H), 1.9, 1.9);
  ctx.fill();

  ctx.strokeStyle = 'rgba(80,55,35,0.07)'; ctx.lineWidth = 1; ctx.beginPath();
  for (let i = 0; i < 90; i++) { const x = R.r(0, W), y = R.r(0, H), a = R.r(0, TAU), l = R.r(6, 22); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); }

// ---------------------------------------------------------------------
//  construction lines, rulers, sparks, bursts, rainbow contours
// ---------------------------------------------------------------------
function construct(cx, cy, r, o = {}) {

//  a serif HUD counter on the left and an italic serif caption in the lower third. Motion on 1s.

  serif: 'Georgia, Cambria, "Times New Roman", "DejaVu Serif", serif',

  text: '#fbf6ee', shade: 'rgba(30,22,18,0.55)',
  skin: ['#f1c9a5', '#d9a47c', '#b47a52', '#8a5636', '#5e3a26'],
  wear: ['#d94848', '#2f6fd1', '#f0c33c', '#2a9d8f', '#e86fa8', '#f4f1ea', '#7b4fc9', '#ef8a3a', '#1f2d3d'],

//  FIRE — the shared fire library. Everything is GPU-side: one instanced draw per system, so 3000 flames + 3000 embers +

//  API (signatures are a contract — keep them):

const HELL_U = { uT: { value: 0 }, uFogC: { value: lin('#7c3414') }, uFogD: { value: 0.0009 }, uHeat: { value: 0 }, uCam: { value: new THREE.Vector3() }, uSpk: { value: 1 } };
const hellSM = ({ u, ...o }) => new THREE.ShaderMaterial(Object.assign({ uniforms: Object.assign({}, HELL_U, u || {}) }, o));
const hellOUT = '#include <tonemapping_fragment>\n#include <encodings_fragment>\n';
const hellFog = 'float hFogK(float d){ return 1.0 - exp(-uFogD * uFogD * d * d); }\n';

// ---- the molten lake: flowing domain-warped heat, drifting crust plates with hot rims, open channels; cut at the chasm
function hellLake() { const g = new THREE.PlaneGeometry(9000, 6600, 1, 1).rotateX(-Math.PI / 2).translate(0, 0, 1500);
  const m = hellSM({ vertexShader: 'varying vec3 vW; void main(){ vec4 w = modelMatrix * vec4(position, 1.0); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }',
    fragmentShader: `uniform float uT, uFogD, uHeat; uniform vec3 uFogC; varying vec3 vW;\n${hellGL}${hellFog}
void main(){ float ez = hEdge(vW.x); if (vW.z < ez) discard;
  vec2 p = vW.xz; vec2 fw2 = fwidth(p); float d = length(vW - cameraPosition), px = sqrt(fw2.x * fw2.y) * 1.3;
  vec2 q = p * 0.011, wp = vec2(hFbm(q + vec2(0.0, uT * 0.012)), hFbm(q + vec2(5.2, 1.3) - uT * 0.01)), pw = p + (wp - 0.5) * 46.0;

  float flow = hFbm(vec2(pw.x * 0.09, pw.y * 0.025) + wp * 2.0 + vec2(0.0, uT * 0.15));
  float bub = mix(hVn(pw * 0.8 + vec2(0.0, uT * 0.5)), 0.5, lodA);
  float cover = smoothstep(0.3, 0.6, hFbm(pw * 0.0055 + 11.0)) * (0.6 + 0.4 * smoothstep(0.0, 30.0, vW.z - ez));
  vec3 v = hVor(pw / 9.0 + vec2(uT * 0.03, uT * 0.012), uT * 0.08);

  vec3 v3 = hVor(pw / 2.6 + 7.0 + uT * 0.05, uT * 0.3); float frag = smoothstep(0.2, 0.2 + px / 2.6 * 1.5 + 0.01, v3.x) * step(0.62, v3.y) * (1.0 - cover) * (1.0 - lodA);

  vec3 v4 = hVor(pw / 1.3 + vec2(flow * 2.0, uT * 0.15), uT * 0.4); float sk = smoothstep(0.05, 0.05 + px / 1.3 * 1.5 + 0.02, v4.x) * smoothstep(0.25, 0.5, hFbm3(pw * 0.09 + 2.0)) * (1.0 - smoothstep(0.015, 0.09, px));

  const L = new THREE.Mesh(g, m); L.frustumCulled = false; return L; }

// ---- the cave roof: basalt plates (lit from below by the lake), wide glowing cracks + fine cracks, embers stuck in it
function hellRoof() { const g = new THREE.PlaneGeometry(9000, 6300, 220, 160).rotateX(Math.PI / 2).translate(0, 0, 1650);
  const m = hellSM({ side: THREE.DoubleSide, vertexShader: `varying vec3 vW;\n${hellGL}\nvoid main(){ vec4 w = modelMatrix * vec4(position, 1.0); w.y = hCeil(w.xz) - 18.0 * hFbm3(w.xz * 0.012); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
    fragmentShader: `uniform float uT, uFogD, uHeat; uniform vec3 uFogC; varying vec3 vW;\n${hellGL}${hellFog}
void main(){ float rim = -1500.0 + 160.0 * hFbm3(vec2(vW.x * 0.008, 3.0)); if (vW.z < rim) discard;
  vec2 p = vW.xz; float d = length(vW - cameraPosition), px = length(fwidth(p));

  float tilt = 0.55 + 0.9 * v.y * (0.5 + 0.5 * smoothstep(0.0, 0.3, v.x));
  vec3 bas = vec3(0.03, 0.017, 0.014) * (0.45 + hFbm(p * 0.35)) * tilt;
  bas += vec3(0.13, 0.034, 0.008) * (0.25 + 0.75 * hFbm3(p * 0.04 + 7.0)) * tilt * (0.6 + 0.6 * halo);

${hellOUT}}` });
  const M = new THREE.Mesh(g, m); M.frustumCulled = false; return M; }

// ---- the chasm wall under the lake's edge: rough black rock, lava pouring over in falls, dark below
function hellCliff() { const NX = 900, NY = 40, pos = [], idx = [];
  for (let j = 0; j <= NY; j++) { const v = j / NY, y = -2800 * v * v * v; for (let i = 0; i <= NX; i++) { const x = -3200 + 6400 * i / NX; const k = Math.min(1, -y / 40); pos.push(x, y + 0.3, hellEdgeZ(x) + 0.5 + k * (-6 * Math.sin(x * 0.05 + y * 0.03) - 4 * Math.sin(x * 0.13 - y * 0.07) - 8) + y * 0.14); } }

  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx); g.computeVertexNormals();
  const m = hellSM({ side: THREE.DoubleSide, vertexShader: 'varying vec3 vW; void main(){ vec4 w = modelMatrix * vec4(position, 1.0); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }',

  float fallM = smoothstep(0.68, 0.8, hVn(vec2((vW.x - vW.z * 0.7) * 0.022, 1.0)));
  float u = vW.x - vW.z * 0.7, str = hFbm3(vec2(u * 0.12, y * 0.012 + uT * 0.9)), str2 = hVn(vec2(u * 0.5, y * 0.03 + uT * 1.8));

  rock += vec3(0.3, 0.06, 0.01) * exp(y / 25.0) * 0.12 * rt * ridge + hRamp(0.5) * exp(y / 1.5) * 0.5;                          // the lip, lit by the lake
  rock += vec3(0.25, 0.05, 0.01) * fallM * exp(y / 300.0) * 0.25 * (0.5 + rt);              // glow around the falls

  col = mix(col, vec3(0.012, 0.004, 0.002), smoothstep(-200.0, -2400.0, y) * 0.8);

${hellOUT}}` });

// ---- the sky beyond the roof's rim: fog colour near the horizon, black above, heaven's glow, the abyss below

void main(){ vec3 d = normalize(vD); float h = d.y, k = max(dot(d, normalize(vec3(0.0, 0.07, -1.0))), 0.0);
  vec3 col = mix(uFogC, uFogC * 0.18, smoothstep(0.0, 0.35, h));

// ---- flames: instanced camera-facing quads, a procedural licking flame each (noise tongues, hot core). Static fields
//      (set once) and dynamic sets (set each frame) share the shader. set(i, x, y, z, w, h, k)
function hellFlames(n, o = {}) { const g = new THREE.InstancedBufferGeometry(); const b = new THREE.PlaneGeometry(1, 1).translate(0, 0.5, 0); g.index = b.index; g.setAttribute('position', b.attributes.position);

    fragmentShader: `uniform float uT, uFogD, uGain; varying vec2 vUv; varying float vR, vK, vD;\n${hellGL}

  const mesh = new THREE.Mesh(g, m); mesh.frustumCulled = false; mesh.renderOrder = 3;

// ---- sparks: rising embers + a rain of falling fire streaks in a box that wraps around the camera (all in the shader)
function hellSparks(n, box) { const g = new THREE.InstancedBufferGeometry(), b = new THREE.PlaneGeometry(1, 1); g.index = b.index; g.setAttribute('position', b.attributes.position);
  const a = new Float32Array(n * 4), R = RNG('hellspk'); for (let i = 0; i < n; i++) a.set([R.f(), R.f(), R.f(), R.f()], i * 4); g.setAttribute('aP', new THREE.InstancedBufferAttribute(a, 4)); g.instanceCount = n;

    fragmentShader: `uniform float uSpk; varying vec2 vUv; varying float vA, vS;\n${hellGL}
void main(){ float x = (vUv.x - 0.5) * 2.0, k = exp(-x * x * 4.0) * smoothstep(0.0, 0.25, vUv.y) * smoothstep(1.0, 0.6, vUv.y);

  gl_FragColor = vec4(col, 1.0);
${hellOUT}}` });
  const mesh = new THREE.Mesh(g, m); mesh.frustumCulled = false; mesh.renderOrder = 4; return mesh; }

// ---- a smoke column: a tall camera-facing sheet of rising, curling smoke, lit orange from below

  const m = hellSM({ transparent: true, depthWrite: false, u: { uSeed: { value: seed }, uLit: { value: o.lit ?? 1 }, uDark: { value: o.dark ?? 1 }, uA: { value: o.a ?? 0.9 }, uFg: { value: o.abyss ? 0.25 : 0.85 } },

    fragmentShader: `uniform float uT, uSeed, uFogD, uLit, uDark, uA, uFg; uniform vec3 uFogC; varying vec2 vUv; varying vec3 vW;\n${hellGL}${hellFog}

// ---- drifting smoke clouds hanging under the roof (the camera falls through them): instanced soft billboards
function hellPuffs(spots, o = {}) { const g = new THREE.InstancedBufferGeometry(), b = new THREE.PlaneGeometry(1, 1); g.index = b.index; g.setAttribute('position', b.attributes.position);
