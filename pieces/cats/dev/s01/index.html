// ---- sound, light ------------------------------------------------------------------
// P_soundRings(x, y, r, u, o): the yowl spreading — concentric warm rings growing to radius r as u goes 0 → 1.
// anchor: CENTRE. o.n rings (4), o.col ('#ffd9a0'), o.squash y factor (1; ~0.35 for rings lying on the ground),
// o.loop speed: rings emitted forever instead of u (e.g. 0.6), o.dir + o.spread: only arcs toward an angle (a call), o.w line width
function P_soundRings(x, y, r, u = 1, o = {}) {
  const n = o.n ?? 4, col = o.col || '#ffd9a0', lw = o.w ?? Math.max(3, r * 0.022);

    const p = o.loop ? mod(TT * o.loop + i / n, 1) : clamp(u * (1 + 0.22 * (n - 1)) - i * 0.22); if (p <= 0.01) continue;
    const rr = r * EZ.o3(p), a = (1 - p) * (o.a ?? 1);
    const a0 = o.dir != null ? o.dir - (o.spread ?? 0.7) : 0, a1 = o.dir != null ? o.dir + (o.spread ?? 0.7) : TAU;
    ctx.save(); ctx.shadowColor = col; ctx.shadowBlur = lw * 3; ctx.globalAlpha *= a; ctx.beginPath(); ctx.arc(0, 0, Math.max(0.1, rr), a0, a1); ctx.lineWidth = lw * (1.4 - p * 0.6); ctx.strokeStyle = col; ctx.stroke(); ctx.restore();
    ctx.save(); ctx.globalAlpha *= a * 0.5; ctx.beginPath(); ctx.arc(0, 0, Math.max(0.1, rr - lw * 2.2), a0, a1); ctx.lineWidth = lw * 0.4; ctx.strokeStyle = '#fff6e6'; ctx.stroke(); ctx.restore();
  }
  ctx.restore();
}

// P_stringLights(x1, y1, x2, y2, o): festoon bulbs on a sagging wire between two points (world coords).

function P_stringLights(x1, y1, x2, y2, o = {}) {

// ---- the fair: stall --------------------------------------------------------------
// P_stall: a fair stall as a box — a counter (top + side toward the vanishing point), a dark booth, posts, a striped

function P_stall(x, y, s = 1, o = {}) {

  for (let i = 1; i < 6; i++) ivLine(-W2 / 2 + i * W2 / 6, -ch + 4, -W2 / 2 + i * W2 / 6, -2, 2, 'rgba(60,30,10,0.25)');

    prop_rim(prop_rr(130, top - 110, 90, 110, 16), 'rgba(250,236,150,0.92)', 1.6); ivRR(130, top - 116, 90, 14, 6, '#c9ced8'); ivDot(160, top - 60, 12, '#f2c230'); ivDot(190, top - 40, 10, '#f2c230'); }
  else if (g === 'toys') { ['#f2a7b8', '#b07a4a', '#7cc47a', '#f5c84c'].forEach((pc, i) => { const gx = -180 + i * 110; prop_rim(prop_circ(gx, top - 30, 26), pc, 1.6); prop_ball(prop_circ(gx, top - 30, 26), gx, top - 30, 26); ivDot(gx - 18, top - 54, 9, pc); ivDot(gx + 18, top - 54, 9, pc); ivDot(gx - 8, top - 34, 3, '#1a1a20'); ivDot(gx + 8, top - 34, 3, '#1a1a20'); }); }
  else if (g === 'balloons') { ['#e0393b', '#f2c230', '#5aa9e6', '#e05a7a', '#7cc47a'].forEach((bc, i) => P_balloon(W2 / 2 - 30, top, 0.9, { col: bc, len: 160 + i * 30, sway: Math.sin(TT * 1.2 + i) * 0.08 + (i - 2) * 0.16, key: 'st' + i })); }

  prop_rimDo((rc) => { ivPoly([af[0], af[1], ab[1], ab[0]], rc || c); ivPoly([af[1], ab[1], back(af[2]), af[2]], rc || c); ivPoly(af, rc || c); }, 2.4);

// SHOT — "are cats." — darkness; pairs of cat eyes open one after another, then all of them look at you
function s01_eyesDark(lt, n, o = {}) {
  ctx.fillStyle = '#04050a'; ctx.fillRect(0, 0, W, H);
  const r = RNG('s01eyes').f, cols = ['#c9e05a', '#e8c34a', '#7cf06a', '#5ab5e8', '#e8a84a'];
  for (let i = 0; i < n; i++) {
    const x = 120 + r() * 1680, y = 150 + r() * 760, s = 0.5 + r() * 1.1, t0 = r() * (o.spread ?? 0.6), c = cols[Math.floor(r() * cols.length)], ph = r() * 9;
    const open = EZ.o3(clamp((lt - t0) / 0.12)) * (mod(lt * 1.3 + ph, 4.2) < 0.12 ? 0.1 : 1);
    if (open <= 0.02) continue;
    for (const dx of [-22, 22]) {
      const ex = x + dx * s, eh = 15 * s * open;
      ivGlow(ex, y, 46 * s, ivHex(c, 0.35));
      ctx.beginPath(); ctx.ellipse(ex, y, 11 * s, eh, 0, 0, TAU); ctx.fillStyle = c; ctx.fill();
      ctx.beginPath(); ctx.ellipse(ex + (o.look ?? 0) * 4 * s, y, 2.6 * s, eh * 0.85, 0, 0, TAU); ctx.fillStyle = '#060406'; ctx.fill();
    }
  }
}

  for (const l of L.slice(1, 3)) { const d = l.draw; l.draw = () => { d(); ctx.save(); ctx.globalCompositeOperation = 'source-atop'; ctx.fillStyle = `rgba(255,140,90,${0.1 * u})`; ctx.fillRect(-3000, -1000, 7000, 3000); ctx.restore(); }; }

//  kit/morph.js — the renderer for pieces built from ERAS (scenes) joined by SHAPE MORPHS.
//
//  At each bridge time tc:
//    shrink [tc-d, tc-m]      the old era is seen through a window shaped like the bridge object (STYLE.window),
//                             shrinking onto the object while the backdrop fades to blank paper
//    morph  [tc-m, tc+m]      on blank paper, the object's outline blends into its counterpart's
//                             (both resampled by angle around their centroids; colour lerped). Hero-to-hero
//                             bridges draw the hero itself with blended position, size and ray count.
//    grow   [tc+m, tc+d]      the new era opens out of a window shaped like the counterpart
//    d = the bridge's half-length (default 0.6s, so a bridge costs 1.2s), m = the morph's half (default 0.2s, or d/3 when d is set).
//    Short pieces: { tc, d: 0.4 } (0.8s) or fewer bridges — see craft.md -> Transitions.
//  Era boundaries WITHOUT a bridge are hard cuts (keep at most one: the slam).
//
//  The piece defines (in its head / src):
//    ERA_LIST = [[t0, t1, () => drawScene()], ...]      scenes draw in world coords, call yearTag()/capStrip()
//    ERA_BG   = ['#hex', ...]                          each era's dominant colour (for the fade to paper)
//    BRIDGES  = [{ tc, A: () => shape, B: () => shape, d?, m? }]   shape = { P: points, c: '#hex' } or SP(x, y, r, rays)
//    function pieceCam(era, t) { return null | CAM }   optional; use push() / bump() below
//  Shapes are in each era's world coords; the bridge object must be in frame at tc (pull push-ins back first).
//  The look comes from the style kit's STYLE hooks (paper, backdrop, window, blob, hero, post, ones):
//  this file draws nothing itself, so the same piece structure works in any style.
