"use strict";
// =====================================================================
//  ¿QUÉ PASARÍA SI LLOVIERA DURANTE 2 MILLONES DE AÑOS? — 9:16, 70s, 24fps, motion on 1s.
//  F5 fixed place: a hillside balcony over a lakeside village in a mountain valley. A storm comes in and never stops: the

//  the rain stops, and a Herrerasaurus climbs up to the balcony (its roar at 63.3 s). The Carnian Pluvial Episode.
// =====================================================================

const BPM = 120, BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4;
const DURATION = 70.0;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const SAFE = { top: 240, bottom: 420, right: 140 };
const HAND = 'Georgia, Cambria, "Times New Roman", serif';
const CX = 540;

const ERA_LIST = [[0, 70, () => sceneRain()]];
const SHOTS = [
  ['storm',   0, 0.0,  5.0,  'the storm arrives'],
  ['starts',  0, 5.0,  10.0, 'it starts raining'],
  ['wont',    0, 10.0, 15.0, 'it will not stop'],
  ['rivers',  0, 15.0, 20.0, 'the streets become rivers'],
  ['lake',    0, 20.0, 25.0, 'the lake swallows the village'],
  ['roofs',   0, 25.0, 30.0, 'only the roofs are left'],
  ['gone',    0, 30.0, 34.0, 'the village is gone'],
  ['jungle',  0, 34.0, 39.0, 'the jungle takes over'],
  ['ferns',   0, 39.0, 43.0, 'ferns taller than houses'],
  ['carnian', 0, 43.0, 48.0, '232 million years ago'],
  ['volcano', 0, 48.0, 53.0, 'giant volcanoes'],
  ['stops',   0, 53.0, 57.0, 'the rain stops'],
  ['dino',    0, 57.0, 63.3, 'a dinosaur climbs to the balcony'],
  ['roar',    0, 63.3, 64.5, 'the roar'],
  ['card',    0, 64.5, 70.0, 'the Carnian Pluvial Episode'],
];
const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE,
  format: 'F5',

  morphs: [],
