<script>
"use strict";
// =====================================================================
//  REFLEJO — 9:16, 15.0s @ 120 BPM grid, 24fps, style "onebit". Hard cuts only (BRIDGES = []), every cut on the 8th grid.
//  Mirror shots: the frame is the glass, the person is a black hair mass in the foreground; the reflection faces camera.
// =====================================================================
const FPS = 24, W = 1080, H = 1920;
const BPM = 120, BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4;
const DURATION = 15.0;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const SAFE = { top: 240, bottom: 420, right: 140 };
const HAND = 'sans-serif';
const CX = 500;

// [t0, scene]
const SHOT_LIST = [
  [0.0, 'mirrorClose'],   // 1 the question
  [3.0, 'handLag'],       // 2 the reflection lags
  [6.0, 'selfBlink'],     // 3a the person blinks (camera = the mirror's view)
  [7.5, 'reflStare'],     // 3b the reflection doesn't
  [9.0, 'stepBack'],      // 4 hands on the glass, the smile; the light dies
  [12.5, 'grinXCU'],      // 5 the payoff
];
const SCENE = { mirrorClose: () => sceneMirrorClose(), handLag: () => sceneHandLag(), selfBlink: () => sceneSelfBlink(), reflStare: () => sceneReflStare(), stepBack: () => sceneStepBack(), grinXCU: () => sceneGrinXCU() };
const ERA_LIST = SHOT_LIST.map(([t0, sc], i) => [t0, i + 1 < SHOT_LIST.length ? SHOT_LIST[i + 1][0] : DURATION, SCENE[sc]]);
// the subtitles: typed on at 0.045 s per glyph (the score clicks on each glyph)
const SUBS = [
  { t0: 0.3, t1: 3.0, lines: ['¿Qué pasaría si tu reflejo', 'dejara de imitarte?'] },
  { t0: 3.25, t1: 6.0, lines: ['Al principio,', 'solo se retrasa.'] },
  { t0: 6.2, t1: 9.0, lines: ['Luego deja', 'de parpadear.'] },
  { t0: 10.3, t1: 12.5, lines: ['Y entonces sonríe.'] },
  { t0: 13.0, t1: 15.0, lines: ['…pero tú no.'] },
];
const CUE = { handUp: 3.6, reflHand: 4.45, blink: 6.55, stepBack: 9.15, press: 9.7, smile: 10.4, lightOff: 11.9, sting: 12.5 };
const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE,
  format: 'beat-cut',
  shots: SHOT_LIST.map(([t0, sc], i) => ({ id: i + 1, key: sc, era: i, t0, t1: ERA_LIST[i][1], title: sc })),
  cuts: SHOT_LIST.slice(1).map(([t0]) => t0),
  morphs: [],
  cues: CUE,
  acts: [
    { name: '1 Pregunta', role: 'build', t0: 0.0, t1: 3.0 },
    { name: '2 Retraso', role: 'journey', t0: 3.0, t1: 9.0 },
    { name: '3 Sonrisa', role: 'journey', t0: 9.0, t1: 11.9 },
    { name: '4 Silencio', role: 'silence', t0: 11.9, t1: 12.5 },
    { name: '5 Pero tú no', role: 'gift', t0: 12.5, t1: 15.0 },
  ],
  board: [
    { t: 2.4, title: 'la pregunta', sound: 'room tone, tube hum, drip, type clicks', next: 'hard cut' },
    { t: 4.9, title: 'el retraso', sound: 'cloth rustle, then a softer one from the glass', next: 'hard cut' },
    { t: 6.6, title: 'parpadea', sound: 'hum, drip', next: 'hard cut' },
    { t: 8.4, title: 'no parpadea', sound: 'hum thins', next: 'hard cut' },
    { t: 11.6, title: 'sonríe', sound: 'glass creaks; the lamp flickers', next: 'the lamp dies (same shot)' },
    { t: 12.2, title: 'se apaga la luz', sound: 'click, then silence', next: 'hard cut on the hit' },
    { t: 13.9, title: '…pero tú no', sound: 'impact + glass crack (loudest), ringing tail', next: 'end' },
  ],
  narration: [],
};
window.TIMELINE = TIMELINE;
// =====================================================================
//  kit/core.js — seeded RNG, math, easing, palette, geometry, the hand-drawn drawing kit
//  (wobble on the boil, ink, paint, hatch, pencil, stipple, grain), cameras, mono text.
//  Needs from the piece head: FPS, W, H. Render state: ctx, F (frame), B (boil = floor(F/2)).
// =====================================================================

// ---------------------------------------------------------------------
//  seeded RNG
// ---------------------------------------------------------------------
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;

}
function RNG(...xs) {

    f,
    r: (a, b) => a + (b - a) * f(),
    n: (amt) => (f() * 2 - 1) * amt,
    i: (a, b) => a + Math.floor(f() * (b - a + 1)),
    pick: (arr) => arr[Math.floor(f() * arr.length)],
  };
}

// ---------------------------------------------------------------------
//  math
// ---------------------------------------------------------------------
const TAU = Math.PI * 2, DEG = Math.PI / 180;
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
// has absolute time t reached cut time c? (cuts snap to the nearest frame, like shot boundaries)
const past = (t, c) => Math.round(t * FPS + 1e-6) >= Math.round(c * FPS);
const dist = (a, b) => Math.hypot(b[0] - a[0], b[1] - a[1]);
const EZ = {
  o2: (t) => 1 - (1 - clamp(t)) ** 2,
  o3: (t) => 1 - (1 - clamp(t)) ** 3,
  i2: (t) => clamp(t) ** 2,
  i3: (t) => clamp(t) ** 3,
  io: (t) => { t = clamp(t); return t < 0.5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2; },
  back: (t) => { t = clamp(t) - 1; return 1 + 2.70158 * t * t * t + 1.70158 * t * t; },
};

// ---------------------------------------------------------------------
//  render state
// ---------------------------------------------------------------------
let ctx = null;   // current 2d context
let F = 0;        // absolute frame index
let B = 0;        // boil index — reseeds every 2 frames (Math.floor(t*12))

const C = {
  ink: '#3a2417', cream: '#efe5cf', paper: '#f4ecd9', paperLine: 'rgba(90,130,190,0.32)',
  orange: '#e58a4e', orangeD: '#c3622e', orangeL: '#f4b27c', terra: '#d97757',
  rose: '#d98b8b', roseD: '#b0616a', roseL: '#efb9b0',
  wood: '#d6a466', woodD: '#a8773f', woodL: '#e9c48f',
  sky: '#9cc4d6', skyD: '#6f9fb8', skyL: '#c9e1ea',
  teal: '#3d9f96', tealL: '#86c9be',
  yellow: '#f0c55a', yellowL: '#f7dd92',
  green: '#5f9c5c', greenL: '#a3cf92',
  red: '#d4382c', redL: '#ea7a6c',
  skin: '#ebb68f', skinD: '#c7815d', skinL: '#f7d4b4',
  lav: 'rgba(104,112,214,0.7)', lavS: 'rgba(104,112,214,0.42)',
  navy: '#0c0d1c', navy2: '#15173a', peri: '#c8d0f0', periD: '#7c86c4', periS: 'rgba(150,164,230,0.20)',
  cyan: '#52d6c4', mag: '#e0368f', glow: '#5de37a', white: '#f4f6ff',
};
const RAINBOW = ['#f0d042', '#e050b8', '#46cde0', '#7ad866', '#a47ef0'];
const MONO = 'Consolas, "Cascadia Mono", Menlo, "DejaVu Sans Mono", "Courier New", monospace';   // Windows first, then macOS / Linux

// ---------------------------------------------------------------------
//  geometry
// ---------------------------------------------------------------------
function ellipsePts(cx, cy, rx, ry, rot = 0, n = 64, a0 = 0, a1 = TAU) {
  const P = [], c = Math.cos(rot), s = Math.sin(rot), full = Math.abs(a1 - a0 - TAU) < 1e-6;
  for (let i = 0; i < n; i++) {
    const a = a0 + (a1 - a0) * i / (full ? n : n - 1);
    const x = Math.cos(a) * rx, y = Math.sin(a) * ry;
    P.push([cx + x * c - y * s, cy + x * s + y * c]);
  }
  return P;
}
function rrectPts(x, y, w, h, r, n = 6) {
  r = Math.min(r, w / 2, h / 2);
  const P = [], cs = [[x + w - r, y + r, -Math.PI / 2], [x + w - r, y + h - r, 0], [x + r, y + h - r, Math.PI / 2], [x + r, y + r, Math.PI]];
  for (const [cx, cy, a0] of cs) for (let i = 0; i <= n; i++) { const a = a0 + (Math.PI / 2) * i / n; P.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); }
  return P;
}
function arcPts(cx, cy, r, a0, a1, n = 18, sy = 1) {
  const P = [];
  for (let i = 0; i <= n; i++) { const a = a0 + (a1 - a0) * i / n; P.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r * sy]); }
  return P;
}
function xform(P, tx, ty, rot = 0, sx = 1, sy = sx) {
  const c = Math.cos(rot), s = Math.sin(rot);
  return P.map(([x, y]) => [tx + x * sx * c - y * sy * s, ty + x * sx * s + y * sy * c]);
}
function bbox(P, pad = 0) {
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const [x, y] of P) { if (x < x0) x0 = x; if (y < y0) y0 = y; if (x > x1) x1 = x; if (y > y1) y1 = y; }
  return { x0: x0 - pad, y0: y0 - pad, x1: x1 + pad, y1: y1 + pad };
}
function resample(P, closed, step) {
  const out = [], n = P.length, m = closed ? n : n - 1;
  for (let i = 0; i < m; i++) {
    const a = P[i], b = P[(i + 1) % n], k = Math.max(1, Math.ceil(dist(a, b) / step));
    for (let j = 0; j < k; j++) out.push([a[0] + (b[0] - a[0]) * j / k, a[1] + (b[1] - a[1]) * j / k]);
  }
  if (!closed) out.push(P[n - 1]);
  return out;
}
function pathLen(P) { let L = 0; for (let i = 1; i < P.length; i++) L += dist(P[i - 1], P[i]); return L; }
function subPath(P, frac) {
  let want = pathLen(P) * clamp(frac);
  const out = [P[0]];
  for (let i = 1; i < P.length; i++) {
    const d = dist(P[i - 1], P[i]);
    if (want >= d) { out.push(P[i]); want -= d; }
    else { const k = want / (d || 1); out.push([lerp(P[i - 1][0], P[i][0], k), lerp(P[i - 1][1], P[i][1], k)]); break; }
  }
  return out;
}
function pointAt(P, frac) { const S = subPath(P, frac); return S[S.length - 1]; }

// ---------------------------------------------------------------------
//  drawing kit — boil, sketchy lines, hatching, stipple, pencil, grain
// ---------------------------------------------------------------------
// smooth hand wobble along the normal; reseeded every boil step
function wobble(P, closed, amt, key, step = 7) {
  const Q = resample(P, closed, step), n = Q.length;
  const R = RNG('wob', key, B);
  const f1 = R.r(0.012, 0.03), f2 = R.r(0.05, 0.1), p1 = R.r(0, TAU), p2 = R.r(0, TAU);
  const sx = R.n(amt * 0.5), sy = R.n(amt * 0.5);
  const out = new Array(n); let s = 0;
  for (let i = 0; i < n; i++) {
    const a = Q[closed ? (i - 1 + n) % n : Math.max(0, i - 1)], b = Q[closed ? (i + 1) % n : Math.min(n - 1, i + 1)];
    const nx = a[1] - b[1], ny = b[0] - a[0], l = Math.hypot(nx, ny) || 1;
    if (i) s += dist(Q[i - 1], Q[i]);
    const o = amt * (0.75 * Math.sin(s * f1 + p1) + 0.35 * Math.sin(s * f2 + p2));
    out[i] = [Q[i][0] + nx / l * o + sx, Q[i][1] + ny / l * o + sy];
  }
  return out;
}
function trace(P, closed) {
  ctx.beginPath();
  const n = P.length; if (n < 2) return;
  if (closed) {
    ctx.moveTo((P[n - 1][0] + P[0][0]) / 2, (P[n - 1][1] + P[0][1]) / 2);
    for (let i = 0; i < n; i++) { const p = P[i], q = P[(i + 1) % n]; ctx.quadraticCurveTo(p[0], p[1], (p[0] + q[0]) / 2, (p[1] + q[1]) / 2); }
    ctx.closePath();
  } else {
    ctx.moveTo(P[0][0], P[0][1]);
    for (let i = 1; i < n - 1; i++) { const p = P[i], q = P[i + 1]; ctx.quadraticCurveTo(p[0], p[1], (p[0] + q[0]) / 2, (p[1] + q[1]) / 2); }
    ctx.lineTo(P[n - 1][0], P[n - 1][1]);
  }
}
// sketchy stroke. o: closed, color, w, amt, key, alpha, frac (write-on), double
function ink(P, o = {}) {
  const closed = !!o.closed, key = o.key ?? 'ink';
  let Q = o.raw ? P : wobble(P, closed, o.amt ?? 1.8, key);
  let cl = closed;
  if (o.frac != null && o.frac < 1) { if (o.frac <= 0) return Q; Q = subPath(closed ? [...Q, Q[0]] : Q, o.frac); cl = false; }
  ctx.strokeStyle = o.color || C.ink; ctx.lineWidth = o.w ?? 3; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.globalAlpha = o.alpha ?? 1;
  trace(Q, cl); ctx.stroke();
  if (o.double) {
    let Q2 = wobble(P, closed, (o.amt ?? 1.8) * 1.6 + 0.8, key + '~');
    if (!cl && closed) Q2 = subPath([...Q2, Q2[0]], o.frac ?? 1);
    ctx.lineWidth = (o.w ?? 3) * 0.4; ctx.globalAlpha = (o.alpha ?? 1) * 0.55; trace(Q2, cl); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  return Q;
}
// filled shape + textures (clipped) + ink outline
function paint(P, o = {}) {
  const key = o.key || 'paint';
  const Q = o.raw ? P : wobble(P, true, o.amt ?? 1.6, key);
  ctx.save();
  trace(Q, true);
  if (o.fill) { ctx.globalAlpha = o.fillAl ?? 1; ctx.fillStyle = o.fill; ctx.fill(); ctx.globalAlpha = 1; }
  if (o.tex) { ctx.clip(); const bb = bbox(Q, 6); o.tex.forEach((t, i) => texture(bb, { key: key + ':' + i, ...t })); }
  ctx.restore();
  if (o.line !== false) {
    ctx.strokeStyle = o.line || C.ink; ctx.lineWidth = o.w ?? 3; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.globalAlpha = o.lineAl ?? 1; trace(Q, true); ctx.stroke(); ctx.globalAlpha = 1;
  }

}
function texture(bb, t) {
  if (t.k === 'hatch') hatch(bb, t);
  else if (t.k === 'cross') { hatch(bb, t); hatch(bb, { ...t, a: (t.a ?? 0.7) + (t.a2 ?? 1.25), key: t.key + 'x' }); }
  else if (t.k === 'pencil') pencil(bb, t);
  else if (t.k === 'stipple') stipple(bb, t);
  else if (t.k === 'fn') t.fn(bb);
}
// parallel hatching inside current clip. t: a angle, gap, c, w, al, dash [min,max], skip, dens(x,y)
function hatch(bb, t) {
  const a = t.a ?? 0.7, gap = t.gap ?? 7, S = RNG('hs', t.key), R = RNG('hj', t.key, B);
  const cx = (bb.x0 + bb.x1) / 2, cy = (bb.y0 + bb.y1) / 2, rad = Math.hypot(bb.x1 - bb.x0, bb.y1 - bb.y0) / 2 + 4;
  const ca = Math.cos(a), sa = Math.sin(a), dens = t.dens, jit = t.jit ?? 0.9, dash = t.dash;
  ctx.beginPath();
  for (let d = -rad; d <= rad; d += gap) {
    const dd = d + S.n(gap * 0.3);
    let u = -rad + (dash ? S.r(0, dash[1]) : 0);
    while (u < rad) {
      const len = dash ? S.r(dash[0], dash[1]) : rad * 2, u2 = Math.min(rad, u + len);
      const mu = (u + u2) / 2, mx = cx + ca * mu - sa * dd, my = cy + sa * mu + ca * dd, p = S.f();
      if (!dens || p < dens(mx, my)) {
        const e1 = R.n(jit), e2 = R.n(jit);
        ctx.moveTo(cx + ca * u - sa * (dd + e1), cy + sa * u + ca * (dd + e1));
        ctx.lineTo(cx + ca * u2 - sa * (dd + e2), cy + sa * u2 + ca * (dd + e2));

  ctx.stroke(); ctx.globalAlpha = 1;
}
// colored-pencil diagonal strokes
function pencil(bb, t) {
  const S = RNG('ps', t.key), R = RNG('pj', t.key, B);

  const n = Math.min(t.max ?? 6000, t.n ?? Math.floor(area / (t.per ?? 700)));
  const a = t.a ?? -0.95, L = t.len ?? 14, dens = t.dens;
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const x = S.r(bb.x0, bb.x1), y = S.r(bb.y0, bb.y1), p = S.f(), aa = a + S.n(0.22), l = L * (0.5 + S.f() * 0.7);

    const jx = R.n(1.1), jy = R.n(1.1), dx = Math.cos(aa) * l / 2, dy = Math.sin(aa) * l / 2;
    ctx.moveTo(x - dx + jx, y - dy + jy); ctx.lineTo(x + dx + jx, y + dy + jy);
  }
  ctx.strokeStyle = t.c; ctx.lineWidth = t.w ?? 1.4; ctx.globalAlpha = t.al ?? 0.45; ctx.lineCap = 'round';
  ctx.stroke(); ctx.globalAlpha = 1;
}
// square stipple dots
function stipple(bb, t) {
  const S = RNG('ss', t.key), R = RNG('sj', t.key, B);
  const n = t.n ?? 400, sz = t.s ?? 2.2, dens = t.dens, jit = t.jit ?? 0.8;
  ctx.fillStyle = t.c; ctx.globalAlpha = t.al ?? 1; ctx.beginPath();

    const x = S.r(bb.x0, bb.x1), y = S.r(bb.y0, bb.y1), p = S.f(), s = sz * (0.6 + S.f() * 0.8);
    if (dens && p > dens(x, y)) continue;

}
// screen-space paper grain, reseeded with the boil
function grain(o = {}) {
  ctx.save(); screen();
  const R = RNG('grain', B), n = o.n ?? 2600;
  ctx.fillStyle = o.dark || 'rgba(70,45,25,0.13)'; ctx.beginPath();
  for (let i = 0; i < n; i++) ctx.rect(R.r(0, W), R.r(0, H), 1.7, 1.7);
  ctx.fill();
  ctx.fillStyle = o.light || 'rgba(255,250,236,0.20)'; ctx.beginPath();
  for (let i = 0; i < n; i++) ctx.rect(R.r(0, W), R.r(0, H), 1.9, 1.9);
  ctx.fill();

  ctx.strokeStyle = 'rgba(80,55,35,0.07)'; ctx.lineWidth = 1; ctx.beginPath();
  for (let i = 0; i < 90; i++) { const x = R.r(0, W), y = R.r(0, H), a = R.r(0, TAU), l = R.r(6, 22); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); }

// ---------------------------------------------------------------------
//  construction lines, rulers, sparks, bursts, rainbow contours
// ---------------------------------------------------------------------
function construct(cx, cy, r, o = {}) {
  const R = RNG('con', o.key ?? 'c', B);
  ctx.save();
  ctx.strokeStyle = o.c || C.lav; ctx.lineWidth = o.w ?? 1.4; ctx.globalAlpha = o.al ?? 1; ctx.lineCap = 'round';
  const a0 = (o.a0 ?? R.r(0, TAU)), sw = o.sweep ?? 1.05;

    ctx.beginPath();
    for (let i = 0; i < o.ticks; i++) { const a = i / o.ticks * TAU + (o.rot ?? 0); ctx.moveTo(cx + Math.cos(a) * (r - 6), cy + Math.sin(a) * (r - 6)); ctx.lineTo(cx + Math.cos(a) * (r + 6), cy + Math.sin(a) * (r + 6)); }
    ctx.stroke();
  }
  ctx.restore();
}
function cline(x1, y1, x2, y2, o = {}) {
  const R = RNG('cl', o.key ?? 'l', B);
  ctx.save(); ctx.strokeStyle = o.c || C.lavS; ctx.lineWidth = o.w ?? 1.2; ctx.globalAlpha = o.al ?? 1;
  ctx.beginPath(); ctx.moveTo(x1 + R.n(1), y1 + R.n(1)); ctx.lineTo(x2 + R.n(1), y2 + R.n(1)); ctx.stroke(); ctx.restore();
}

    // the iris: grey with a black limbal ring, the lid's shadow over its top, a pupil (a pinpoint when staring), a glint
    const ir = s * 0.118 * (1 - 0.25 * st), icx = cx + lx * ew * 0.4, icy = ey + eh * 0.08 + ly * eh * 0.3;
    obMask(GR, (g) => { almond(g); g.clip(); obEll(g, icx, icy, ir, ir); g.fill(); });
    obMask(K, (g) => { almond(g); g.clip(); obEll(g, icx, icy, ir, ir); g.lineWidth = 1; g.stroke(); });
    obMask(K, (g) => { almond(g); g.clip(); g.beginPath(); g.rect(icx - ir - 1, ey - eh * 1.3, ir * 2 + 2, eh * (0.62 - 0.5 * st)); g.fill(); });
    const pr = Math.max(0.55, ir * 0.45 * (1 - 0.85 * st));
    obFill(K, (g) => obEll(g, icx, icy, pr, pr));
    const gx = Math.round(icx - sh * ir * 0.4), gy = Math.round(icy - ir * 0.45), gs = s > 50 ? 2 : 1;
    obRect(gx, gy, gs, gs, WH, { emit: !!o.glow });
    // the shadow under the upper lid, the heavy lid line thickening outward, lashes, the lower lid
    obMask(GR, (g) => { almond(g); g.clip(); g.lineWidth = 1.4; obPoly(g, upper.map(([a, b]) => [a, b + 1]), false); g.stroke(); }, { thr: 0.4 });
    obInk((g) => obPoly(g, upper, false), Math.max(1, s * 0.045));
    obInk((g) => obPoly(g, upper.slice(Math.floor(upper.length * 0.45)), false), Math.max(1.4, s * 0.075));
    obInk((g) => { const n = big ? 3 : 1; for (let i = 0; i < n; i++) { const p = upper[upper.length - 1 - i * 2]; g.moveTo(p[0], p[1]); g.lineTo(p[0] + e * s * (0.08 - i * 0.015), p[1] - s * (0.05 + i * 0.02)); } }, 1);
    obInk((g) => obPoly(g, lower.slice(0, Math.ceil(lower.length * 0.75)), false), 1, ten > 0.4 || !big ? K : GR);
  }
  // front hair over everything: the mass, separations between locks, gloss on the lit side, stray strands
  obHairMass(frontHair, { rim: -1 });
  if (big) obInk((g) => { for (const [u0, v0, u1, v1] of [[0.5, -1.25, 0.64, -0.2], [-0.15, -1.4, -0.05, -0.38], [0.95, -0.9, 1.1, 0.85]]) { const a = S(u0, v0), b = S(u1, v1); g.moveTo(a[0], a[1]); g.quadraticCurveTo((a[0] + b[0]) / 2 + sh * s * 0.05, (a[1] + b[1]) / 2, b[0], b[1]); } }, 1, GR);
  obInk((g) => { for (const [u0, v0, u1, v1, b] of [[-0.85, -0.85, -0.3, -1.3, -0.12], [-0.7, -0.6, -0.15, -1.15, -0.1]]) { const a = S(u0, v0), c = S(u1, v1); g.moveTo(a[0], a[1]); g.quadraticCurveTo((a[0] + c[0]) / 2 + s * b * sh, (a[1] + c[1]) / 2 + s * b, c[0], c[1]); } }, 1, big ? WH : GR, { emit: !!o.glow, thr: 0.45 });   // gloss on the lit side of the crown
  obInk((g) => { for (const [u0, v0, u1, v1, b] of [[0.1, -0.64, 0.24, -0.12, 0.06], [-0.32, -0.6, -0.4, -0.2, -0.05]]) { const a = S(u0, v0), c = S(u1, v1); g.moveTo(a[0], a[1]); g.quadraticCurveTo((a[0] + c[0]) / 2 + s * b, (a[1] + c[1]) / 2, c[0], c[1]); } }, 1, K, { thr: 0.42 });
  // eye glints on top in a dark scene (the only lit thing in the face)
  if (o.glow && bl <= 0.5) for (const e of [-1, 1]) { const gx = Math.round(x + e * 0.4 * s + lx * 0.1 * s), gy = Math.round(y); obRect(gx, gy, s > 30 ? 2 : 1, 1, WH, { emit: true }); obRect(gx + (s > 30 ? 2 : 1), gy, 1, 1, GR, { emit: true }); }
  // the silhouette's rim: all round, or only on the lit side; emissive in a dark scene
  if (o.glow || o.rimDir) obMask(-1, (g) => { sil(g); g.fill(); }, { rim: WH, rimDir: o.rimDir, rim8: !o.rimDir, rimEmit: !!o.glow });
  OB.pre = prevPre;
}

// the grin: corners pulled up and out (unevenly), the opening black, gums, irregular separate teeth in two rows,
// a thin stretched upper lip, a lower lip edge, deep nasolabial folds, bunched cheeks, corner creases
function obGrin(P, s, u, o = {}) {
  const R = RNG('grin', o.key ?? 'g'), big = s >= 26;
  const Lc = P(-0.3 - 0.34 * u, 0.93 - 0.2 * u), Rc = P(0.3 + 0.38 * u, 0.93 - 0.27 * u);
  const top = obCR([Lc, P(-0.18 - 0.2 * u, 0.885 - 0.1 * u), P(0, 0.885 - 0.015 * u), P(0.2 + 0.22 * u, 0.875 - 0.13 * u), Rc], 8);
  const bot = obCR([Rc, P(0.22 + 0.2 * u, 0.96 + 0.07 * u), P(0, 0.99 + 0.2 * u), P(-0.2 - 0.2 * u, 0.97 + 0.08 * u), Lc], 8);
  const mouth = [...top, ...bot], open = (g) => obPoly(g, mouth);
  // folds and cheeks first (the mouth draws over their ends)
  for (const e of [-1, 1]) {
    obSpl([P(e * 0.2, 0.5), P(e * (0.4 + 0.2 * u), 0.7 - 0.05 * u), P(e * (0.55 + 0.24 * u), 0.98), P(e * (0.5 + 0.22 * u), 1.16)], 1, K);
    if (big) obFill(obHatchF(K, e > 0 ? 30 : 150, 3), (g) => obPoly(g, obCR([P(e * 0.22, 0.52), P(e * (0.4 + 0.2 * u), 0.72 - 0.05 * u), P(e * (0.55 + 0.24 * u), 0.98), P(e * (0.6 + 0.24 * u), 0.96), P(e * (0.47 + 0.2 * u), 0.7), P(e * 0.26, 0.5)], 3, true)));   // the fold's shadow
    if (big) obSpl([P(e * (0.6 + 0.2 * u), 0.42), P(e * (0.74 + 0.15 * u), 0.56), P(e * (0.76 + 0.12 * u), 0.72)], 1, GR);   // the bunched cheek's edge
  }
  if (u < 0.3) {   // a closed, too-long smile
    obInk((g) => obPoly(g, top, false), Math.max(1, s * 0.04));
    return;
  }
  obFill(K, open);
  obMask(GR, (g) => { open(g); g.clip(); g.lineWidth = Math.max(1.6, s * 0.075 * u); obPoly(g, top, false); g.stroke(); });   // gums
  // teeth: one subpath each, irregular widths, lengths and tilts; gaps stay black
  const teeth = (curve, n, len0, gum, key) => {
    const T = RNG('teeth', o.key ?? 'g', key), Lc0 = obAlong(curve, 0).L, sp = Lc0 / n;
    return (g) => {
      g.beginPath();
      for (let i = 0; i < n; i++) {
        const t = (i + 0.5 + T.n(0.12)) / n, a = obAlong(curve, t), dx = -a.ty, dy = a.tx, tx = a.tx, ty = a.ty;
        const mid = 1 - Math.abs(t - 0.5) * 2, tw = sp * T.r(0.62, 0.92) * (0.75 + 0.35 * mid), th = s * len0 * u * (0.65 + 0.5 * mid) * T.r(0.8, 1.2), tilt = T.n(0.25);
        const ddx = dx + tx * tilt, ddy = dy + ty * tilt, b0 = s * gum * u;
        const bx = a.x + dx * b0, by = a.y + dy * b0;
        obPolyAdd(g, [[bx - tx * tw / 2, by - ty * tw / 2], [bx + tx * tw / 2, by + ty * tw / 2], [bx + tx * tw * 0.42 + ddx * th, by + ty * tw * 0.42 + ddy * th], [bx + ddx * th * 1.08, by + ddy * th * 1.08], [bx - tx * tw * 0.42 + ddx * th, by - ty * tw * 0.42 + ddy * th]]);
      }
    };
  };
  const up = teeth(top, big ? 12 : 8, 0.15, 0.055, 'u'), lo = teeth(bot, big ? 11 : 7, 0.1, 0.03, 'l');
  obMask(WH, (g) => { open(g); g.clip(); up(g); g.fill(); lo(g); g.fill(); }, { emit: !!o.glow });
  if (big) obMask(GR, (g) => { open(g); g.clip(); lo(g); g.lineWidth = 1; g.stroke(); }, { thr: 0.6 });   // the lower row sits in shadow
  // lips: the stretched upper lip a thin grey band, the lower lip's edge, its shadow, creases at the corners
  obInk((g) => obPoly(g, top.map(([a, b]) => [a, b - 1.2]), false), 1, GR);
  obInk((g) => obPoly(g, top, false), 1, K);
  obInk((g) => obPoly(g, bot.map(([a, b]) => [a, b + 2.2]), false), 1, K);
  obInk((g) => obPoly(g, bot.slice(4, -4).map(([a, b]) => [a, b + 3.4]), false), 1, GR);
  for (const [c, e] of [[Lc, -1], [Rc, 1]]) obInk((g) => { g.moveTo(c[0], c[1]); g.quadraticCurveTo(c[0] + e * s * 0.07, c[1] - s * 0.01, c[0] + e * s * 0.1, c[1] - s * 0.08); g.moveTo(c[0], c[1]); g.lineTo(c[0] + e * s * 0.05, c[1] + s * 0.07); }, 1, K);
  if (big) obInk((g) => { for (const e of [-1, 0.4]) { const a = P(e * 0.12, 1.24 + 0.15 * u); g.moveTo(a[0], a[1]); g.lineTo(a[0] + s * 0.03, a[1] + s * 0.05); } }, 1, GR);   // a tense chin
}

// a hand, fingers up. o.side 'palm' (seen in the mirror) | 'back' (seen from behind: knuckles, nails), o.mirror (thumb on
// the other side), o.flat (palm pressed on glass: a breath smudge around it), o.arm (forearm length in s), o.glow
function obHand(x, y, s, o = {}) {
  const th = o.mirror ? -1 : 1, spread = o.flat ? 0.3 : 0.2, fing = [-1.5, -0.5, 0.5, 1.5], len = [0.82, 1.0, 1.06, 0.92];
  const tips = fing.map((f, i) => { const a = f * spread, L = s * len[th > 0 ? 3 - i : i]; const bx = x + f * s * 0.23, by = y - s * 0.42; return [bx, by, bx + Math.sin(a) * L, by - Math.cos(a) * L]; });
  const shape = (g) => {
    g.beginPath(); g.moveTo(x - s * 0.52, y - s * 0.45); g.lineTo(x + s * 0.52, y - s * 0.45); g.lineTo(x + s * 0.48, y + s * 0.4); g.quadraticCurveTo(x, y + s * 0.62, x - s * 0.48, y + s * 0.4); g.closePath(); g.fill();
    g.lineWidth = s * 0.25; g.beginPath(); for (const [bx, by, ex, ey] of tips) { g.moveTo(bx, by); g.lineTo(ex, ey); }
    g.moveTo(x + th * s * 0.42, y + s * 0.15); g.lineTo(x + th * s * 0.88, y - s * 0.3);   // the thumb
    g.stroke();
    if (o.arm) { g.lineWidth = s * 0.62; g.beginPath(); g.moveTo(x, y + s * 0.3); g.lineTo(x + (o.armDx ?? 0) * s, y + s * (0.3 + o.arm)); g.stroke(); }
  };
  if (o.flat) obFill(obDith(-1, WH, 0.35), (g) => obEll(g, x, y - s * 0.2, s * 1.05, s * 1.15));
  obMask(WH, shape, { rim: K, thr: 0.5 });
  // shading: the far side of the hand hatched (the light comes from the -th side)
  if (s >= 14) obMask(obHatchF(GR, 60, 3), (g) => { g.beginPath(); g.rect(x + th * s * 0.25 - (th > 0 ? 0 : s * 1.6), y - s * 1.5, s * 1.6, s * 3 + (o.arm ?? 0) * s); g.clip(); shape(g); });
  obInk((g) => { for (let i = 0; i < 3; i++) { const a = tips[i], b = tips[i + 1], mx = (a[0] + b[0]) / 2, my = a[1]; g.moveTo(mx, my + 0.5); g.lineTo(mx + ((a[2] + b[2]) / 2 - mx) * 0.3, my - s * 0.3); } }, 1, K, { thr: 0.4 });   // the clefts between fingers
  if (o.side === 'back') {
    obInk((g) => { for (const [bx, by] of tips) { g.moveTo(bx - s * 0.06, by + s * 0.05); g.lineTo(bx + s * 0.06, by + s * 0.03); } }, 1, GR);   // knuckles
    obInk((g) => { for (const [bx, by, ex, ey] of tips) { const k = 0.55; g.moveTo(lerp(bx, ex, k) - s * 0.05, lerp(by, ey, k)); g.lineTo(lerp(bx, ex, k) + s * 0.05, lerp(by, ey, k)); } }, 1, GR);
    obMask(GR, (g) => { for (const [bx, by, ex, ey] of tips) { const k = 0.86, cx = lerp(bx, ex, k), cy = lerp(by, ey, k); g.moveTo(cx + s * 0.07, cy); g.ellipse(cx, cy, s * 0.07, s * 0.09, 0, 0, TAU); } g.fill(); });   // nails
  } else {
    obSpl([[x - th * s * 0.45, y - s * 0.12], [x, y - s * 0.02], [x + th * s * 0.35, y - s * 0.25]], 1, K);    // the heart line
    obSpl([[x + th * s * 0.35, y - s * 0.3], [x + th * s * 0.12, y + s * 0.1], [x + th * s * 0.18, y + s * 0.42]], 1, GR);  // the life line
    obInk((g) => { for (const [bx, by, ex, ey] of tips) for (const k of [0.35, 0.68]) { g.moveTo(lerp(bx, ex, k) - s * 0.07, lerp(by, ey, k)); g.lineTo(lerp(bx, ex, k) + s * 0.07, lerp(by, ey, k)); } }, 1, GR);
  }
  if (o.glow) obMask(-1, shape, { rim: WH, rimEmit: true });
}

// ---------------------------------------------------------------------
//  the person from behind (over-the-shoulder foreground): bob hair with gloss, the nape, a white tee, a rim light
//  obBackOfHead(x, y, s, o): (x, y) = the head's centre, s = half the head's width. o.glow (dark scene), o.rimDir
// ---------------------------------------------------------------------
function obBackOfHead(x, y, s, o = {}) {
  const P = (u, v) => [x + u * s, y + v * s], pts = (A) => A.map(([u, v]) => P(u, v));
  const body = pts([[-0.5, 1.2], [-1.5, 1.5], [-2.4, 1.95], [-2.9, 3.0], [-3.1, 6], [3.1, 6], [2.9, 3.0], [2.4, 1.95], [1.5, 1.5], [0.5, 1.2]]);
  const nape = pts([[-0.42, 0.7], [-0.5, 1.55], [0.5, 1.55], [0.42, 0.7]]);
  const hair = [...obCR(pts([[-1.12, 0.55], [-1.12, -0.35], [-0.8, -0.95], [0, -1.18], [0.8, -0.95], [1.12, -0.35], [1.12, 0.55]]), 5), ...obCR(pts([[1.16, 0.95], [0.9, 1.02], [0.62, 0.95], [0.32, 1.04], [0, 0.97], [-0.32, 1.05], [-0.62, 0.96], [-0.9, 1.03], [-1.16, 0.93]]), 3)];
  obFill(o.shirt ?? WH, (g) => obPoly(g, body), { rim: o.glow ? null : WH, rim8: true });
  obHatch((g) => { obPoly(g, body); g.clip(); g.beginPath(); g.rect(x - s * 3.2, y + s * 1.2, s * 1.6, s * 5); }, { ang: 60, sp: 3 });
  obInk((g) => obPoly(g, body), 1);
  obInk((g) => { for (const e of [-1, 1]) { const a = P(e * 1.0, 2.0), b = P(e * 1.25, 2.9), c = P(e * 1.05, 3.8); g.moveTo(a[0], a[1]); g.quadraticCurveTo(b[0], b[1], c[0], c[1]); } const d = P(0, 2.3), f = P(0.05, 4.2); g.moveTo(d[0], d[1]); g.lineTo(f[0], f[1]); }, 1, GR);   // shoulder blades, spine fold
  obFill(K, (g) => obPoly(g, [...obCR(pts([[-0.75, 1.25], [0, 1.45], [0.75, 1.25]]), 4), ...obCR(pts([[0.62, 1.4], [0, 1.6], [-0.62, 1.4]]), 4)]));   // collar band
  obFill(WH, (g) => obPoly(g, nape));
  obFill(obDith(-1, GR, 0.7), (g) => { obPoly(g, nape); g.clip(); g.beginPath(); g.rect(x - s, y, s * 2, s * 1.2); g.fill(); g.beginPath(); });
  obSpl(pts([[-0.12, 1.0], [-0.08, 1.3], [-0.1, 1.5]]), 1, GR); obSpl(pts([[0.14, 1.0], [0.1, 1.3], [0.12, 1.5]]), 1, GR);
  obHairMass(hair, { rim: o.glow ? -1 : WH });
  obInk((g) => { for (const [u0, v0, u1, v1, b] of [[-0.6, -0.9, -0.9, 0.95, -0.1], [-0.15, -1.1, -0.25, 0.9, -0.05], [0.3, -1.05, 0.45, 0.95, 0.06], [0.75, -0.8, 0.95, 1.0, 0.1]]) { const a = P(u0, v0), c = P(u1, v1); g.moveTo(a[0], a[1]); g.quadraticCurveTo((a[0] + c[0]) / 2 + s * b, (a[1] + c[1]) / 2, c[0], c[1]); } }, 1, DK);
  obInk((g) => { for (let i = 0; i < 6; i++) { const t = i / 5, a = P(lerp(-0.7, 0.7, t), -0.7 + 0.25 * (t - 0.5) ** 2 * 4 * 0.3); g.moveTo(a[0], a[1]); g.lineTo(a[0] + s * 0.05, a[1] + s * 0.18); } }, 1, GR, { emit: !!o.glow });
  if (o.glow || o.rimDir) obMask(-1, (g) => { obPolyAdd(g, hair); obPolyAdd(g, body); g.fill(); }, { rim: WH, rimDir: o.rimDir, rimEmit: !!o.glow });
}

// a face in profile, facing screen-right (the foreground of a two-shot): a black silhouette rim-lit on its front edge,
// faint night-grey form, and an eye that is a glint when open and a lash line when closed. o.blink, o.glow
function obProfile(x, y, s, o = {}) {
  const P = (u, v) => [x + u * s, y + v * s], pts = (A) => A.map(([u, v]) => P(u, v));
  const front = obCR(pts([[0.15, -1.45], [0.5, -1.05], [0.62, -0.55], [0.64, -0.3], [0.56, -0.12], [0.62, 0.05], [0.84, 0.32], [0.62, 0.42], [0.68, 0.55], [0.62, 0.63], [0.67, 0.74], [0.52, 0.88], [0.56, 1.05], [0.32, 1.22], [0.24, 1.6], [0.3, 2.4]]), 4);
  const head = [...front, ...pts([[0.4, 2.5], [-2.5, 2.5], [-2.5, -1.6], [-0.6, -1.75]])];
  obFill(K, (g) => obPoly(g, head));
  obFill(obDith(-1, DK, 0.5), (g) => obPoly(g, obCR(pts([[0.3, -0.5], [0.5, -0.2], [0.55, 0.5], [0.35, 1.0], [0.0, 0.8], [0.0, -0.2]]), 4, true)));
  obInk((g) => obPoly(g, obCR(pts([[-0.1, -1.4], [0.3, -1.1], [0.42, -0.62], [0.3, -0.3]]), 4), false), Math.max(1, s * 0.12), K);   // hair over the forehead
  obMask(-1, (g) => { obPoly(g, head); g.fill(); }, { rim: WH, rimDir: [1, 0], rimEmit: true });
  obMask(-1, (g) => { obPoly(g, head); g.fill(); }, { rim: GR, rimDir: [0, -1], rimEmit: true });
  const ex = x + s * 0.48, ey = y - s * 0.08;
  if ((o.blink ?? 0) > 0.5) obInk((g) => { g.moveTo(ex - s * 0.08, ey); g.lineTo(ex + s * 0.06, ey + s * 0.03); g.moveTo(ex + s * 0.02, ey + s * 0.02); g.lineTo(ex + s * 0.07, ey + s * 0.08); }, 1, GR, { emit: true });
  else { obRect(Math.round(ex), Math.round(ey), 2, 1, WH, { emit: true }); obInk((g) => { g.moveTo(ex - s * 0.04, ey - s * 0.05); g.lineTo(ex + s * 0.1, ey - s * 0.07); }, 1, GR, { emit: true }); }
}

// ---------------------------------------------------------------------
//  the bathroom: tiles (in perspective), a lamp with a dithered glow, a sink with taps, drain and pipes, a shelf
//  with bottles and a toothbrush cup, a towel on a rail, a door, the mirror with wear, spots and glints
// ---------------------------------------------------------------------
const obAt = (Q, u, v) => [lerp(lerp(Q[0][0], Q[1][0], u), lerp(Q[3][0], Q[2][0], u), v), lerp(lerp(Q[0][1], Q[1][1], u), lerp(Q[3][1], Q[2][1], u), v)];
// a tiled quad Q = [tl, tr, br, bl] of nx x ny tiles: base fill, grout, a bevel highlight, stains, drips, a cracked tile
function obTiles(Q, nx, ny, o = {}) {
  const R = RNG('tiles', o.key ?? 't');
  obFill(o.base ?? WH, (g) => obPoly(g, Q), { noCam: o.noCam });
  const tile = (i, j) => [obAt(Q, i / nx, j / ny), obAt(Q, (i + 1) / nx, j / ny), obAt(Q, (i + 1) / nx, (j + 1) / ny), obAt(Q, i / nx, (j + 1) / ny)];
  for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
    const r = R.f(), T = tile(i, j), tw = dist(T[0], T[1]), tz = dist(T[0], T[3]);
    if (r < (o.stain ?? 0.16)) {   // a stain: a dithered grey blot, heavier near the bottom of the wall
      const c = obAt(T, R.r(0.25, 0.75), R.r(0.35, 0.85)), d = R.r(0.2, 0.55);
      obFill(obDith(-1, R.f() < 0.3 ? K : GR, d), (g) => { obPoly(g, T); g.clip(); obEll(g, c[0], c[1], tw * R.r(0.15, 0.4), tz * R.r(0.1, 0.3)); }, { noCam: o.noCam });
    } else if (r < (o.stain ?? 0.16) + 0.05) {   // a drip streak from the grout line down
      const a = obAt(T, R.r(0.2, 0.8), 0), L = tz * R.r(0.5, 1.6);
      obFill(obDith(-1, GR, 0.4), (g) => { g.beginPath(); g.rect(a[0], a[1], 1, L); }, { noCam: o.noCam });
    } else if (r < (o.stain ?? 0.16) + 0.08) {   // a crack
      let p = obAt(T, R.r(0.1, 0.4), R.r(0.1, 0.4)); const Pc = [p];
      for (let k = 0; k < 3; k++) { p = [p[0] + tw * R.r(0.1, 0.3), p[1] + tz * R.r(0.1, 0.3)]; Pc.push(p); }
      obLine(Pc, 1, K, { noCam: o.noCam });

// =====================================================================
//  kit/morph.js — the renderer for pieces built from ERAS (scenes) joined by SHAPE MORPHS.

//                             shrinking onto the object while the backdrop fades to blank paper
//    morph  [tc-m, tc+m]      on blank paper, the object's outline blends into its counterpart's
//                             (both resampled by angle around their centroids; colour lerped). Hero-to-hero

//    grow   [tc+m, tc+d]      the new era opens out of a window shaped like the counterpart
//    d = the bridge's half-length (default 0.6s, so a bridge costs 1.2s), m = the morph's half (default 0.2s, or d/3 when d is set).
//    Short pieces: { tc, d: 0.4 } (0.8s) or fewer bridges — see craft.md -> Transitions.
//  Era boundaries WITHOUT a bridge are hard cuts (keep at most one: the slam).

//    ERA_BG   = ['#hex', ...]                          each era's dominant colour (for the fade to paper)

//  The look comes from the style kit's STYLE hooks (paper, backdrop, window, blob, hero, post, ones):

  rustle(cu.handUp - 0.05, 0.55, 0.16, -0.25, 0.05);
  rustle(cu.reflHand - 0.05, 0.6, 0.07, 0.3, 0.45);

  noiseHit(cu.stepBack + 0.05, 0.12, 'lowpass', 350, 0.8, 0.22, -0.2, 0.2); noiseHit(cu.stepBack + 0.4, 0.1, 'lowpass', 320, 0.8, 0.16, -0.25, 0.2);
  const creak = (t0, dur, f0, f1, vel, pan) => { const n = Math.round(dur / 0.018); for (let i = 0; i < n; i++) { const u = i / n; noiseHit(t0 + i * 0.018 + ((i * 11) % 3) * 0.002, 0.016, 'bandpass', f0 * (f1 / f0) ** u, 14, vel * Math.sin(u * Math.PI) * (0.6 + 0.4 * ((i * 5) % 3) / 2), pan, 0.25); } };

  creak(cu.press + 0.3, 0.45, 820, 1300, 0.18, 0.3);
  creak(10.9, 0.7, 600, 980, 0.2, 0.05);

  sweep(cu.smile, OFF - 0.02, 0.05, 120, 700, 0);

  // ---- the sting on the cut: sub + distorted impact + glass crack (bursts across the stereo field) + a ringing tail
  sub(HIT, 1.0);
  impact(HIT, 0.9);
  for (let i = 0; i < 14; i++) noiseHit(HIT + i * 0.017 + ((i * 7) % 4) * 0.004, 0.05, 'bandpass', 3000 + ((i * 53) % 6) * 900, 1.6, 0.55 * (1 - i / 16), ((i * 29) % 11 - 5) / 5, 0.4);
  noiseHit(HIT, 0.25, 'highpass', 2500, 0.7, 0.4, 0, 0.5);
  ring(HIT + 0.02, 2.4, 0.22);

  bed(HIT + 0.3, LOOP_T - 0.05, 'lowpass', 140, 0.7, 0.16, 0, 0.2, 0.3);
  // =====================================================================
  //  kit/score-tail.js — render, fold the tail over the loop point, loudness stage

  // =====================================================================
