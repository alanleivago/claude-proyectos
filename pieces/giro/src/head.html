// =====================================================================
//  ¿QUE PASARÍA SI LA TIERRA DEJARA DE GIRAR? — 9:16, 70s, 24fps, motion on 1s.

//  street, the houses and the towers across the bay fly apart; the planet stops and the ocean comes up the street.
// =====================================================================

const BPM = 120, BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4;
const DURATION = 70.0;

const LOOP_T = NFRAMES / FPS;
const SAFE = { top: 240, bottom: 420, right: 140 };
const HAND = 'Georgia, Cambria, "Times New Roman", serif';
const CX = 540;

const ERA_LIST = [[0, 70, () => sceneSpin()]];
const SHOTS = [

  ['ecuador', 0, 5.0,  11.0, 'estás sobre el ecuador: 1.670 km/h'],
  ['frena',   0, 11.0, 17.0, 'la Tierra frena: sacudida, grietas, la gente cae'],

  ['vuela',   0, 25.0, 33.0, 'todo lo suelto sale volando'],

  ['golpe',   0, 61.8, 63.0, 'la ola golpea el cristal'],
