<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alcibiades</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b0c0f; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { height: min(100vh, calc(100vw * 16 / 9)); width: auto; aspect-ratio: 9 / 16; display: block; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
"use strict";
// =====================================================================
//  ALCIBIADES — the man who switched sides three times. 9:16, voice-led (~70s), 24fps, style amphora.
//  Fixed-hero journey (F5): one young Athenian carried through Athens, the fleet, Sparta, Persia and back;
//  his shield's emblem is the device (owl -> lambda -> winged disc -> owl). The map is the recurring station.
// =====================================================================
const FPS = 24, W = 1080, H = 1920;
const BPM = 120, BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4, GRID0 = 0;
const VL = (id) => VOICE.lines.find((l) => l.id === id);
const VW = (id, w, n = 1) => { const L = VL(id); let k = 0; for (const x of L.words) if (x.w.toLowerCase().replace(/[^a-z0-9']/g, '') === w.toLowerCase() && ++k === n) return x.t0; return L.t0; };
const DURATION = Math.round(VOICE.duration * FPS) / FPS;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const SAFE = { top: 240, bottom: 420, right: 140 };
const HAND = 'Georgia, serif';
const CX = 540;
const onBeat = (t) => t;

const S = (id) => (id === 'hook' ? 0 : VL(id).t0 - 0.25);       // a beat starts just before its line
const IDS = ['hook', 'pericles', 'socrates', 'sicily', 'fleet', 'herms', 'flee', 'advice', 'queen', 'persia', 'gold', 'general', 'hero', 'fire', 'name', 'sign'];
const SIGN_T = VL('name').t1 + 0.35;
const HIT = VL('name').t0 - 0.45;                                // the payoff: in the pause before "His name was"
const TB = IDS.map((id) => (id === 'sign' ? SIGN_T : id === 'name' ? HIT : S(id)));
const SUB = (id) => TB[IDS.indexOf(id)], SUBEND = (id) => (IDS.indexOf(id) + 1 < IDS.length ? TB[IDS.indexOf(id) + 1] : DURATION);
const ERA_LIST = [[0, DURATION, () => sceneStage()]];
const SHOTS = IDS.map((id, i) => [id, 0, TB[i], i + 1 < IDS.length ? TB[i + 1] : DURATION, id]);
const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, gridOffset: GRID0, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE, aspect: '9:16',
  format: 'fixed-hero-journey',
  shots: SHOTS.map(([key, era, t0, t1, title], i) => ({ id: i + 1, key, era, t0, t1, title })),
  cuts: TB.slice(1),
  morphs: [],
  cues: { hit: HIT },
  acts: [
    { name: '1 Hook',    role: 'build',   t0: 0, t1: SUB('pericles') },
    { name: '2 Athens',  role: 'build',   t0: SUB('pericles'), t1: SUB('herms') },
    { name: '3 Turns',   role: 'peak',    t0: SUB('herms'), t1: SUB('fire') },
    { name: '4 Fire',    role: 'build',   t0: SUB('fire'), t1: VL('fire').t1 + 0.05 },
    { name: '5 Silence', role: 'silence', t0: VL('fire').t1 + 0.05, t1: HIT },
    { name: '6 Name',    role: 'gift',    t0: HIT, t1: SIGN_T },
    { name: '7 Sign',    role: 'goodbye', t0: SIGN_T, t1: DURATION },
  ],
  board: IDS.map((id, i) => ({ t: i + 1 === IDS.length ? DURATION - 0.6 : Math.min(id === 'name' ? VL('name').t1 : VL(id).t1 - 0.2, TB[i + 1] - 0.1), title: id, sound: '', next: '' })),
  narration: VOICE.lines.map((l) => ({ id: l.id, t0: l.t0, t1: l.t1, text: l.text })),
};
window.TIMELINE = TIMELINE;
