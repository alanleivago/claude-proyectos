9.16},{"w":"and","t0":29.16,"t1":29.4},{"w":"isn't","t0":29.4,"t1":29.7},{"w":"magnetic.","t0":29.7,"t1":30.14},{"w":"The","t0":30.52,"t1":30.6},{"w":"field","t0":30.6,"t1":30.88},{"w":"passes","t0":30.88,"t1":31.28},{"w":"straight","t0":31.28,"t1":31.58},{"w":"through","t0":31.58,"t1":31.84},{"w":"it.","t0":31.84,"t1":32.26}]},{"id":"eddy","text":"Above it sits the bottom of the pan. A changing field inside a metal pushes its electrons in circles. These are eddy currents.","t0":32.458,"t1":39.218,"words":[{"w":"Above","t0":32.48,"t1":32.72},{"w":"it","t0":32.72,"t1":32.94},{"w":"sits","t0":32.94,"t1":33.12},{"w":"the","t0":33.12,"t1":33.38},{"w":"bottom","t0":33.38,"t1":33.58},{"w":"of","t0":33.58,"t1":33.78},{"w":"the","t0":33.78,"t1":33.92},{"w":"pan.","t0":33.92,"t1":34.16},{"w":"A","t0":34.36,"t1":34.46},{"w":"changing","t0":34.46,"t1":34.8},{"w":"field","t0":34.8,"t1":35.18},{"w":"inside","t0":35.18,"t1":35.52},{"w":"a","t0":35.52,"t1":35.7},{"w":"metal","t0":35.7,"t1":35.9},{"w":"pushes","t0":35.9,"t1":36.22},{"w":"its","t0":36.22,"t1":36.5},{"w":"electrons","t0":36.5,"t1":36.94},{"w":"in","t0":36.94,"t1":37.18},{"w":"circles.","t0":37.18,"t1":37.58},{"w":"These","t0":38.08,"t1":38.18},{"w":"are","t0":38.18,"t1":38.36},{"w":"eddy","t0":38.36,"t1":38.68},{"w":"currents.","t0":38.68,"t1":39.04}]},{"id":"resist","text":"And iron resists letting them flow. That resistance is heat.","t0":39.618,"t1":43.249,"words":[{"w":"And","t0":39.618,"t1":39.8,"est":true},{"w":"iron","t0":39.8,"t1":40.06},{"w":"resists","t0":40.06,"t1":40.46},{"w":"letting","t0":40.46,"t1":40.82},{"w":"them","t0":40.82,"t1":41.06},{"w":"flow.","t0":41.06,"t1":41.34},{"w":"That","t0":41.82,"t1":42.04},{"w":"resistance","t0":42.04,"t1":42.52},{"w":"is","t0":42.52,"t1":42.86},{"w":"heat.","t0":42.86,"t1":43.12}]},{"id":"is","text":"The heat doesn't travel to the pan. The pan is the resistance.","t0":43.749,"t1":47.184,"words":[{"w":"The","t0":43.74,"t1":43.86},{"w":"heat","t0":43.86,"t1":44.06},{ // ---- the cloud: a cumulonimbus — a cauliflower dome, bulging sides, a scalloped flat base,

// ---- bolts: a seeded stepped path from (x0,y0) toward (x1,y1); each step drifts a little, branches split off
function vaBoltPath(key, x0, y0, x1, y1, steps = 14, o = {}) {
  const R = RNG('bolt', key), main = [[x0, y0]], branches = [];
  const jit = o.jit ?? 0.55, bp = o.branch ?? 0.35;
  for (let i = 1; i <= steps; i++) {
    const u = i / steps, px = lerp(x0, x1, u), py = lerp(y0, y1, u);
    const spread = (1 - Math.pow(u, 3)) * Math.abs(y1 - y0) / steps * jit * 2.2;

    const g = clamp((k - b.at) / 3);
    if (g <= 0) continue;
    const fade = o.branchFade ?? 1;
    if (glow) vaGlow(vaPart(b.pts, g), c, w * 0.6, glow * 0.6, { a: 0.75 * fade }); else vaStroke(vaPart(b.pts, g), c, w * 0.6, { a: 0.75 * fade });

// ---- captions & tags, at screen size (DEFER)

// =====================================================================
//  STYLE — the renderer's hooks

// =====================================================================
//  SCENES — Why doesn't an induction stove burn your hand? (voltamps). World 1080x1920, TT on 1s.
//  cyan = current (coil, eddy currents), magenta = the magnetic field, amber = heat, cream = big numbers.
//  Every free text is centred (x 540); titles and big text in serif.
// =====================================================================
const CXT = 540;
const fadeIn = (t, d = 0.35) => EZ.o2(ev(t, d));
const fadeOut = (t, d = 0.35) => 1 - EZ.i2(ev(t, d));
const win = (t0, t1, d = 0.35) => fadeIn(t0, d) * fadeOut(t1, d);

function cap(str, y, t0, c = VA.cream, size = 60, o = {}) {
  const a = (o.a ?? 1) * fadeIn(t0 - 0.05, 0.25);

  const push = 0.13 * (i % 2 ? 1 - u : u);

    duck.gain.setValueAtTime(DUCK, L.t1 + 0.03); duck.gain.linearRampToValueAtTime(1, L.t1 + 0.18);
    dip.gain.setValueAtTime(0, Math.max(0, L.t0 - 0.1)); dip.gain.linearRampToValueAtTime(-6, L.t0);
    dip.gain.setValueAtTime(-6, L.t1 + 0.03); dip.gain.linearRampToValueAtTime(0, L.t1 + 0.18);
  }
  const mkVerb = (dest, sec = 1.6, decay = 2.8, level = 0.3) => { const v = ac.createConvolver(); v.buffer = makeImpulse(ac, sec, decay); const g = ac.createGain(); g.gain.value = level; v.connect(g); g.connect(dest); return v; };
  const verbs = { m: mkVerb(duck), s: mkVerb(sfxBus) }, shortVerb = verbs.m, longVerb = mkVerb(duck, 3.6, 1.6, 0.55);
  const noise = makeNoise(ac, 3.0);
  let to = 'm';   // which bus the helpers below write to

  // the gain is silent until the envelope starts (a GainNode defaults to 1: a note whose oscillator starts first would click)
  const env = (g, t, a, peak, d) => { g.gain.value = 0.0001; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); };
  const out = (node, pan = 0, send = 0) => {
    const p = ac.createStereoPanner(); p.pan.value = clamp(pan, -1, 1); node.connect(p); p.connect(to === 'm' ? duck : sfxBus);
    if (send) { const s = ac.createGain(); s.gain.value = send; node.connect(s); s.connect(verbs[to]); }
  };
  const osc = (type, f, t, stop) => { const o = ac.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t); o.start(t); o.stop(stop); return o; };
  function pluck(t, f, vel, pan = 0, dur = 0.32, bright = 3200, send = 0.25) {
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 2.5;
    lp.frequency.setValueAtTime(bright, t); lp.frequency.exponentialRampToValueAtTime(380, t + dur);
    const g = ac.createGain(); env(g, t, 0.003, vel, dur);
    const g2 = ac.createGain(); g2.gain.value = 0.3;
    osc('triangle', f, t, t + dur + 0.05).connect(lp);
    osc('sine', f * 2.004, t, t + dur + 0.05).connect(g2); g2.connect(lp);
    lp.connect(g); out(g, pan, send);
  }
  function noiseHit(t, dur, type, freq, q, vel, pan = 0, send = 0, sweepTo = 0) {
    const src = ac.createBufferSource(); src.buffer = noise;
    const f = ac.createBiquadFilter(); f.type = type; f.Q.value = q; f.frequency.setValueAtTime(freq, t);
    if (sweepTo) f.frequency.exponentialRampToValueAtTime(sweepTo, t + dur);
    const g = ac.createGain(); env(g, t, Math.min(0.004, dur * 0.3), vel, dur);
    src.connect(f); f.connect(g); out(g, pan, send);
    src.start(t, (t * 7.31) % 2.0); src.stop(t + dur + 0.05);
  }
  function sub(t, vel) {
    const o = osc('sine', 120, t, t + 0.8); o.frequency.exponentialRampToValueAtTime(36, t + 0.3);
    const g = ac.createGain(); env(g, t, 0.004, vel, 0.6); o.connect(g); out(g);
    noiseHit(t, 0.07, 'lowpass', 1100, 0.7, vel * 0.45);
  }
  function sweep(t0, t1, vel, f0, f1, pan = 0) {
    const src = ac.createBufferSource(); src.buffer = noise; src.loop = true;
    const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.1;
    f.frequency.setValueAtTime(f0, t0); f.frequency.exponentialRampToValueAtTime(f1, t1);
    const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vel, t1 - 0.03); g.gain.linearRampToValueAtTime(0.0001, t1 + 0.005);
    src.connect(f); f.connect(g); out(g, pan, 0.2); src.start(t0, (t0 * 3.1) % 1.0); src.stop(t1 + 0.05);
  }
  function riser(t0, t1, vel) {
    const o = osc('sawtooth', 110, t0, t1 + 0.02); o.frequency.exponentialRampToValueAtTime(1320, t1);
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 6; lp.frequency.setValueAtTime(300, t0); lp.frequency.exponentialRampToValueAtTime(5000, t1);
    const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vel, t1 - 0.01); g.gain.linearRampToValueAtTime(0.0001, t1 + 0.01);
    o.connect(lp); lp.connect(g); out(g, 0, 0.3);
    sweep(t0, t1, vel * 0.9, 400, 7000);
  }
  function chime(t, freqs, vel, pan = 0) {
    freqs.forEach((f, i) => { const g = ac.createGain(), ti = t + i * 0.012; env(g, ti, 0.002, vel / (1 + i * 0.4), 1.3); osc('sine', f, ti, ti + 1.5).connect(g); out(g, pan + (i - 1) * 0.25, 0.6); });
  }
  function bass(t, f, vel) { const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 320; const g = ac.createGain(); env(g, t, 0.006, vel, 0.28); osc('triangle', f, t, t + 0.35).connect(lp); lp.connect(g); out(g); }
  function blip(t, f0, f1, dur, vel, pan = 0) { const o = osc('sine', f0, t, t + dur + 0.05); o.frequency.exponentialRampToValueAtTime(f1, t + dur); const g = ac.createGain(); env(g, t, 0.002, vel, dur); o.connect(g); out(g, pan, 0.2); }

  // ---- v2 instruments built from the helpers above
  function pad(t0, t1, notes, peak, o = {}) {
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = o.cut ?? 1200; lp.Q.value = 0.7;
    const g = ac.createGain(), hold = o.swellTo ?? peak;
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(peak, t0 + (o.att ?? 0.4));
    if (o.swellTo) g.gain.linearRampToValueAtTime(o.swellTo, o.swellAt);
    g.gain.setValueAtTime(hold, t1 - (o.rel ?? 0.3)); g.gain.exponentialRampToValueAtTime(0.0001, t1);
    notes.forEach((n, i) => { for (const det of [-7, 7]) { const oo = osc(o.type ?? 'sawtooth', nz(n), t0, t1 + 0.05); oo.detune.value = det + i; oo.connect(lp); } });
    lp.connect(g); out(g, o.pan ?? 0, o.send ?? 0.4);
  }
  function drone(t0, t1, f, peak, o = {}) {
    const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(peak, t0 + (o.att ?? 0.5));
    g.gain.setValueAtTime(peak, t1 - (o.rel ?? 0.4)); g.gain.exponentialRampToValueAtTime(0.0001, t1);
    osc('sine', f, t0, t1 + 0.05).connect(g); out(g, 0, 0);
  }
  const claudeMotif = (t, notes, vel) => notes.forEach(([n, dt], i) => pluck(t + dt, nz(n), vel, -0.15 + i * 0.1, 0.6, 1300, 0.35));
  const childMotif = (t, notes, vel, bright = 5200, send = 0.3) => notes.forEach(([n, dt], i) => pluck(t + dt, nz(n), vel, 0.2 - i * 0.1, 0.32, bright, send));
  // SCORE BODY — Why doesn't an induction stove burn your hand? Music = the user's track (piece.json "music");
  // this body is the sound effects only (sfx bus), loud and present: switches, heat, electrons and photons.
  to = 's';
  // ---- instruments
  const rumble = (t, dur, vel, pan = 0, cut = 180) => {   // a long low roll of thunder: looped noise, lowpassed, slow swells
    const src = ac.createBufferSource(); src.buffer = noise; src.loop = true;
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 0.9; lp.frequency.setValueAtTime(cut * 2.5, t); lp.frequency.exponentialRampToValueAtTime(cut, t + dur);
    const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vel, t + 0.08);
    const R = RNG('rum', t);
    for (let k = 1; k <= 6; k++) g.gain.linearRampToValueAtTime(vel * R.r(0.35, 1), t + dur * k / 7);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(lp); lp.connect(g); out(g, pan, 0.5); src.start(t, (t * 1.7) % 2); src.stop(t + dur + 0.05);
  };
  const crackle = (t, dur, vel, pan = 0, key = 'c') => {   // dry electric crackle: a burst of tiny high clicks
    const R = RNG('crk', key, t), n = Math.max(3, Math.round(dur * 60));
    for (let i = 0; i < n; i++) noiseHit(t + R.r(0, dur), 0.012, 'highpass', 2500 + R.r(0, 4000), 0.8, vel * R.r(0.4, 1), pan + R.r(-0.2, 0.2), 0.05);
  };
  const zap = (t, vel, pan = 0, f0 = 2600, f1 = 300) => {   // an electric zap: a fast falling buzz + crackle
    const o = osc('sawtooth', f0, t, t + 0.2); o.frequency.exponentialRampToValueAtTime(f1, t + 0.16);
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1800; bp.Q.value = 0.8;
    const g = ac.createGain(); env(g, t, 0.002, vel * 0.5, 0.16); o.connect(bp); bp.connect(g); out(g, pan, 0.15);
    crackle(t, 0.12, vel * 0.7, pan, 'z');
  };
  const crack = (t, vel, pan = 0) => {   // the strike itself: a sharp broadband crack, a sub punch, a roll
    noiseHit(t, 0.05, 'highpass', 1200, 0.6, vel, pan, 0.4);
    noiseHit(t + 0.01, 0.22, 'bandpass', 2400, 0.7, vel * 0.7, pan, 0.5, 600);
    crackle(t, 0.2, vel * 0.8, pan, 'k');
    sub(t, vel * 0.9);
  };
  const tick = (t, vel = 0.12, pan = 0, f = 3000) => { noiseHit(t, 0.015, 'bandpass', f, 4, vel, pan); blip(t, f * 0.7, f * 0.5, 0.03, vel * 0.25, pan); };
  const ice = (t, vel, pan = 0) => { blip(t, 3400, 2600, 0.05, vel * 0.5, pan); noiseHit(t, 0.03, 'highpass', 5000, 1, vel * 0.6, pan, 0.2); };
  const pop = (t, vel, pan = 0, f = 900) => blip(t, f, f * 1.6, 0.06, vel, pan);
  const typing = (t0, n, cps, vel = 0.05, pan = 0) => { for (let i = 0; i < n; i++) tick(t0 + i / cps, vel, pan, 2200 + (i % 3) * 400); };
  const hum = (t0, t1, vel) => {   // a mains-like buzz: 100 Hz saw, bandpassed, tremolo
    const o = osc('sawtooth', 100, t0, t1 + 0.05), bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 400; bp.Q.value = 1.5;
    const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vel, t0 + 0.4); g.gain.setValueAtTime(vel, t1 - 0.4); g.gain.exponentialRampToValueAtTime(0.0001, t1);
    o.connect(bp); bp.connect(g); out(g, 0, 0.1);
  };
  const whoosh = (t, d, vel, f0 = 300, f1 = 3000, pan = 0) => sweep(t - d, t, vel, f0, f1, pan);

  // (no rain bed: a constant hiss pumps audibly in every pause of the voice)


  const drop = (t, vel, f = 900, pan = 0.2) => blip(t, f * 1.6, f * 0.5, 0.18, vel, pan);
  const pew = (t, vel, f = 1800, pan = 0.4) => { blip(t, f * 0.6, f * 1.8, 0.22, vel, pan); noiseHit(t, 0.08, 'highpass', 5000, 0.8, vel * 0.3, pan, 0.3); };

  const sub2 = (t, v) => sub(t, v * 0.4);   // every other low hit sits well under the payoff
  const click = (t, vel, pan = 0) => { tick(t, vel, pan, 1600); noiseHit(t, 0.04, 'bandpass', 800, 2, vel * 0.7, pan); };

  const sizzle = (t, dur, vel, pan = 0) => { crackle(t, dur, vel, pan, 'sz' + t); noiseHit(t, Math.min(1.2, dur), 'bandpass', 3500, 0.8, vel * 1.4, pan, 0.2); };
  const buzz = (t0, t1, vel) => hum(t0, t1, vel);
  // ---- title, the cold hand, the hot pan
  pop(VL('title').t0, 0.08, 0, 420);
  typing(VL('title').t0, 24, 26, 0.03, -0.2); typing(VW('title', 'stove') - 0.05, 21, 22, 0.03, 0.2);
  { const t = VW('hand', 'switched') - 0.1; click(t, 0.35, 0); buzz(t + 0.05, SUB('pan'), 0.02); }
  chime(VW('hand', 'cold') - 0.1, [1760, 2637], 0.05, -0.2);
  { const t = VW('pan', 'iron') - 0.1; noiseHit(t + 0.35, 0.12, 'bandpass', 700, 1.5, 0.11, 0); sub2(t + 0.35, 0.25); sizzle(VW('pan', 'seconds'), 2.4, 0.07, 0.1); }
  noiseHit(VW('nothing', 'nothing') - 0.1, 0.4, 'lowpass', 600, 0.7, 0.08, 0, 0.3);
  // ---- the coil, the current, the field
  whoosh(SUB('coil') + 0.6, 0.6, 0.09, 3000, 400, 0); riser(SUB('coil') + 0.2, SUB('coil') + 1.4, 0.03);
  { const t = VW('ac', 'alternating') - 0.1; buzz(t, SUB('skin'), 0.035); for (let x = t; x < SUB('field'); x += 1 / (2 * ACF)) blip(x, 1400, 1300, 0.05, 0.03, Math.sin(x * TAU * ACF) > 0 ? 0.3 : -0.3); }
  sweep(VW('ac', 'hear') - 0.4, VW('ac', 'hear') + 0.8, 0.05, 3000, 12000, 0);
  { const t = VW('field', 'magnetic') - 0.1; sweep(t, t + 0.8, 0.07, 300, 2000, 0); for (let x = t; x < SUB('eddy'); x += 1 / (2 * ACF)) noiseHit(x, 0.18, 'bandpass', 500, 2, 0.04, Math.sin(x * TAU * ACF) > 0 ? 0.4 : -0.4); }
  { const t = VW('glass', 'conduct') - 0.3; pop(t, 0.08, 0, 700); whoosh(VW('glass', 'passes') + 0.4, 0.5, 0.08, 500, 4000, 0); }
  // ---- eddy currents, resistance, heat
  { const t = VW('eddy', 'bottom') - 0.2; noiseHit(t + 0.3, 0.1, 'bandpass', 700, 1.5, 0.18, 0); }
  { const t = VW('eddy', 'circles') - 0.3; for (let i = 0; i < 16; i++) blip(t + i * 0.12, 900 + (i % 4) * 200, 1300, 0.08, 0.04, Math.sin(i) * 0.6); }
  chime(VW('eddy', 'eddy') - 0.1, [1046.5, 1568], 0.05, 0);
  { const t = VW('resist', 'heat') - 0.2; sizzle(t, 3.6, 0.08, 0); sub2(t, 0.4); }
  { const t = VW('is', 'pan', 2) - 0.2; sub2(t, 0.4); chime(t, [880, 1318.5, 1760], 0.06, 0); }
  // ---- the skin of the metal
  whoosh(SUB('skin') + 0.6, 0.6, 0.09, 4000, 400, 0);
  { const t = VW('skin', 'crowds') - 0.2; sweep(t, t + 0.8, 0.06, 2000, 600, 0); }
  { const t = VW('iron', 'iron') - 0.2; pop(t, 0.08, -0.3, 500); sizzle(t + 0.6, 2.6, 0.07, -0.2); }
  { const t = VW('alu', 'aluminum') - 0.2; pop(t, 0.08, 0.3, 900); sweep(t + 0.2, t + 1.4, 0.05, 600, 4000, 0.3); }
  { const t = VW('magnet', 'magnet') - 0.3; noiseHit(t + 0.15, 0.06, 'bandpass', 2500, 2, 0.3, -0.2); tick(t + 0.15, 0.3, -0.2, 3200); sweep(t + 0.7, t + 1.4, 0.05, 1500, 300, 0.4); }
  // ---- Litz
  whoosh(SUB('litz') + 0.6, 0.6, 0.08, 300, 2500, 0);
  { const t = VW('litz', 'solid') - 0.2; sizzle(t, 1.6, 0.05, 0); }
  { const t = VW('litz', 'hundreds') - 0.2; for (let i = 0; i < 29; i++) blip(t + i * 0.035, 2000 + (i % 6) * 250, 1800, 0.03, 0.03, -0.6 + (i % 7) * 0.2); chime(t + 1.1, [1568, 2093], 0.04, 0); }
  { const t = VW('enemy', 'effect') - 0.1; sub2(t + 0.5, 0.3); }
  // ---- the hand
  whoosh(SUB('hand2') + 0.6, 0.6, 0.08, 400, 3000, 0); sizzle(SUB('hand2') + 0.8, 3.0, 0.05, -0.4);
  { const t = VW('hand2', 'ten') - 0.2; for (let i = 0; i < 8; i++) tick(t + i * 0.06, 0.06, 0.3, 2200 + i * 100); }
  { const t = VW('zero', 'zero') - 0.2; sub2(t, 0.4); pop(t, 0.14, 0.4, 300); }
  // ---- detect, contact, knife
  { const t = VW('detect', 'detects') - 0.2; for (let i = 0; i < 3; i++) blip(t + i * 0.25, 1200, 1200, 0.08, 0.05, 0); }
  { const t = VW('contact', 'later'); sizzle(t, 2.5, 0.04, 0); pop(VW('contact', 'leftover') - 0.2, 0.1, -0.5, 900); }
  { const t = VW('knife', 'knife') - 0.2; noiseHit(t + 0.2, 0.08, 'highpass', 4000, 1, 0.15, 0.5); tick(t + 0.2, 0.2, 0.5, 4500); sizzle(VW('knife', 'heats'), 1.6, 0.05, 0.5); }
  chime(VW('knife', 'materials') - 0.2, [1318.5, 1975.5], 0.05, 0);
  // ---- THE PAYOFF: the heat born inside the pan (the loudest moment, after a silence)
  sub(HIT, 1.0); sub(HIT + 0.03, 0.7); noiseHit(HIT, 1.0, 'lowpass', 3200, 0.7, 0.8, 0, 0.6, 180);
  [['D3', 0], ['A3', 0.01], ['D4', 0.02], ['Fs4', 0.03], ['A4', 0.04]].forEach(([n, dt], i) => pluck(HIT + dt, nz(n), 0.22 - i * 0.02, (i - 2) * 0.2, 0.9, 3000, 0.6));
  sizzle(HIT + 0.2, VL('end').t1 - HIT, 0.06, 0);
  chime(VW('end', 'born') - 0.3, [1046.5, 1568], 0.05, 0);
  chime(VL('end').t1 + 0.2, [1760, 2637, 3520], 0.06, 0);   // Bitvolts
  // =====================================================================
  //  kit/score-tail.js — render, fold the tail over the loop point, loudness stage
  //  (RMS-normalise to -17 dBFS, look-ahead limiter at -1 dBFS; stems share the mix gain curve)
  // =====================================================================
  const buf = await ac.startRendering();
  // fold the tail over the loop point so the loop is seamless
  const N = Math.round(LOOP_T * sampleRate), L = new Float32Array(N), Rr = new Float32Array(N);
  const c0 = buf.getChannelData(0), c1 = buf.getChannelData(1);
  for (let i = 0; i < N; i++) { L[i] = c0[i] + (i + N < len ? c0[i + N] : 0); Rr[i] = c1[i] + (i + N < len ? c1[i + N] : 0); }
  // loudness for a phone (subagents-short): RMS-normalise to -17 dBFS, then a look-ahead limiter at -1 dBFS.
  // Stems reuse the mix's gain and gain curve, so they sum back to the mix.
  let k = normIn?.k, g = normIn?.g;
  if (!g) {
    let sum = 0; for (let i = 0; i < N; i++) sum += (L[i] * L[i] + Rr[i] * Rr[i]) / 2;
    k = 10 ** (-17 / 20) / Math.sqrt(sum / N || 1e-12);
    const ceil = 0.89; g = new Float32Array(N);
    for (let i = 0; i < N; i++) { const p = Math.max(Math.abs(L[i]), Math.abs(Rr[i])) * k; g[i] = p > ceil ? ceil / p : 1; }
    const att = Math.exp(-1 / (0.0015 * sampleRate)), rel = Math.exp(-1 / (0.09 * sampleRate));
    for (let i = N - 2; i >= 0; i--) g[i] = Math.min(g[i], 1 - (1 - g[i + 1]) * att);
    let r = 1; for (let i = 0; i < N; i++) { r = Math.min(g[i], 1 - (1 - r) * rel); g[i] = r; }
  }
  for (let i = 0; i < N; i++) { L[i] *= k * g[i]; Rr[i] *= k * g[i]; }
  return { left: L, right: Rr, sampleRate, norm: { k, g } };
}
function wavB64(s) {
  const bytes = encodeWav(s.left, s.right, s.sampleRate);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
async function renderAudioWav() { return wavB64(await buildScore(48000, 'mix')); }
async function renderAudioStems() {
  const mix = await buildScore(48000, 'mix');
  const music = await buildScore(48000, 'music', mix.norm), sfx = await buildScore(48000, 'sfx', mix.norm);
  return { music: wavB64(music), sfx: wavB64(sfx) };
}
window.renderAudioWav = renderAudioWav;
window.renderAudioStems = renderAudioStems;
</script>
