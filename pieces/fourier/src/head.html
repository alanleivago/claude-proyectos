<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fourier Circles</title>
<style>
  html, body { margin: 0; height: 100%; background: #06101a; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { height: min(100vh, calc(100vw * 16 / 9)); width: auto; aspect-ratio: 9 / 16; display: block; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
"use strict";
// =====================================================================
//  WHAT IF ANY DRAWING CAN BE MADE WITH SPINNING CIRCLES? — 9:16, voice-led (~62s), 24fps, style bitstory.
//  A π drawn by 45 epicycles (a real DFT of its outline), one circle → a wave, odd circles → a square wave,
//  Fourier, back to the π, only the big circles → a rough π, JPEG and MP3.
// =====================================================================
const FPS = 24, W = 1080, H = 1920;
const BPM = 120, BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4, GRID0 = 0;
const VL = (id) => VOICE.lines.find((l) => l.id === id);
const VW = (id, w, n = 1) => { const L = VL(id); let k = 0; for (const x of L.words) if (x.w.toLowerCase().replace(/[^a-z0-9']/g, '') === w.toLowerCase() && ++k === n) return x.t0; return L.t0; };
const DURATION = Math.round(VOICE.duration * FPS) / FPS;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const SAFE = { top: 240, bottom: 420, right: 140 };
const VMONO = '"SF Mono", Menlo, "JetBrains Mono", "DejaVu Sans Mono", Consolas, monospace';
const HAND = VMONO;
const CX = 520;
const onBeat = (t) => t;

const S = (id) => VL(id).t0 - 0.3;                    // a beat starts ~0.3s before its line
const HIT = VL('fourier').t0 - 0.3;                  // the payoff: in the pause before "That's what Fourier showed."
const IDS = ['title', 'letter', 'parts', 'point', 'wave', 'hook', 'smooth', 'adding', 'corners', 'fourier', 'signal', 'free', 'knows', 'pace', 'big', 'jpeg', 'end'];
const TB = IDS.map((id, i) => (i === 0 ? 0 : id === 'fourier' ? HIT : S(id)));
const SUB = (id) => TB[IDS.indexOf(id)], SUBEND = (id) => (IDS.indexOf(id) + 1 < IDS.length ? TB[IDS.indexOf(id) + 1] : DURATION);
const ERA_LIST = [[0, DURATION, () => sceneStage()]];
const SHOTS = IDS.map((id, i) => [id, 0, TB[i], i + 1 < IDS.length ? TB[i + 1] : DURATION, id]);
const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, gridOffset: GRID0, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE, aspect: '9:16',
  format: 'fixed-stage',
  shots: SHOTS.map(([key, era, t0, t1, title], i) => ({ id: i + 1, key, era, t0, t1, title })),
  cuts: [],
  morphs: [],
  cues: { hit: HIT },
  acts: [
    { name: '1 Hook',    role: 'build',   t0: 0, t1: S('parts') },
    { name: '2 Wave',    role: 'peak',    t0: S('parts'), t1: VL('corners').t1 + 0.05 },
    { name: '3 Silence', role: 'silence', t0: VL('corners').t1 + 0.05, t1: HIT - 0.1 },
    { name: '4 Fourier', role: 'gift',    t0: HIT, t1: S('free') },
    { name: '5 Drawing', role: 'build',   t0: S('free'), t1: S('end') },
    { name: '6 End',     role: 'goodbye', t0: S('end'), t1: DURATION },
  ],
  board: IDS.map((id, i) => ({ t: i + 1 === IDS.length ? DURATION - 0.4 : Math.min(VL(id).t1 - 0.2, TB[i + 1] - 0.1), title: id, sound: '', next: '' })),
  narration: VOICE.lines.map((l) => ({ id: l.id, t0: l.t0, t1: l.t1, text: l.text })),
};
window.TIMELINE = TIMELINE;
