<title>Gira más rápido</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0d14; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }

<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
"use strict";
// =====================================================================
//  ¿QUÉ PASARÍA SI LA TIERRA GIRARA CADA VEZ MÁS RÁPIDO? — 9:16, 80 s, 24 fps.
//  Brighton's pier at midday. The spin speeds up: the sea slides south toward the equator and leaves the seabed bare;
//  days and nights flash past; the air follows the water; at noon the sky is black; "down" tilts south, people slide,
//  the Ferris wheel rolls away; you are still holding on to the railing.
// =====================================================================
const FPS = 24, W = 1080, H = 1920;
const BPM = 120, BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4;
const DURATION = 80.0;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const SAFE = { top: 240, bottom: 420, right: 140 };
const HAND = 'Georgia, Cambria, "Times New Roman", serif';
const CX = 540;

const ERA_LIST = [[0, 80, () => sceneMain()]];
const SHOTS = [
  ['walk',   0,    5,    'caminas por el muelle'],
  ['plane',  5,    10,   'avioneta con pancarta'],
  ['sea',    10,   12,   'el mar bajo el muelle'],
  ['beach',  12,   17,   'la playa, la noria, la torre'],
  ['recede', 17,   23,   'el mar se retira hacia el sur'],
  ['bed',    23,   28,   'el fondo al descubierto'],
  ['beyond', 28,   34,   'el océano más allá del horizonte'],
  ['days',   34,   40,   'días y noches cada vez más cortos'],
  ['air',    40,   43,   'el aire sigue al agua'],
  ['thin',   43,   46,   'más fino que en el Everest'],
  ['noon',   46,   52,   'mediodía, cielo negro'],
  ['grip',   52,   56,   'abajo ya no es abajo'],
  ['lean',   56,   60,   'todo se inclina al sur'],
  ['slide',  60,   64,   'pesas menos'],
  ['wheel',  64,   70,   'la noria se suelta'],
  ['hold',   70,   74,   'sigues agarrado'],
  ['card',   74,   80,   'tarjeta final'],
];
const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE,
  format: 'F5',
  shots: SHOTS.map(([key, t0, t1, title], i) => ({ id: i + 1, key, era: 0, t0, t1, title })),
  cuts: SHOTS.slice(1).map((s) => s[1]), morphs: [],
  cues: { spinup: 12.0, wheel: 64.0 },
  acts: [
    { name: '1 El muelle', role: 'build', t0: 0, t1: 12 },
    { name: '2 El mar se va', role: 'journey', t0: 12, t1: 40 },
    { name: '3 Sin aire', role: 'peak', t0: 40, t1: 63.6 },
    { name: '4 Silencio', role: 'silence', t0: 63.6, t1: 63.98 },
    { name: '5 La noria', role: 'gift', t0: 63.98, t1: 70 },
    { name: '6 Agarrado', role: 'goodbye', t0: 70, t1: 80 },
  ],
  board: [[2.5, 'título, el muelle'], [7.5, 'avioneta'], [11, 'el mar'], [14.5, 'playa y noria'], [20, 'el mar se va'], [25.5, 'fondo al aire'], [31, 'más allá del horizonte'], [37, 'días rápidos'], [41.5, 'el aire'], [44.5, 'Everest'], [49, 'cielo negro'], [54, 'agarrado'], [58, 'se inclina'], [62, 'resbalan'], [67, 'la noria rueda'], [72, 'grietas'], [77, 'tarjeta']].map(([t, title]) => ({ t, title, sound: '', next: '' })),
  narration: [],
};
window.TIMELINE = TIMELINE;
