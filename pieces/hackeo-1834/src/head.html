<title>El primer hackeo</title>
<style>

  body { display: flex; align-items: center; justify-content: center; }
  canvas { height: min(100vh, calc(100vw * 16 / 9)); width: auto; aspect-ratio: 9 / 16; display: block; cursor: pointer; image-rendering: pixelated; }

<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
"use strict";
// =====================================================================
//  EL PRIMER HACKEO — 9:16, 70s @ 120 BPM, 24fps, style pixdoc. 1834: the Blanc brothers hide a market
//  signal inside France's state telegraph using its own "error" sign. The fake symbol is always RED.
//  One era per beat, hard cuts (BRIDGES = []); loupes (docIris) open inside scenes instead of cuts.
// =====================================================================
const FPS = 24, W = 1080, H = 1920;
const BPM = 120, BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4;
const DURATION = 70.0;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const SAFE = { top: 240, bottom: 420, right: 140 };
const HAND = '"Helvetica Neue", Arial, sans-serif';   // storyboard sheet only
const CX = 540;

// [t0, scene, title, o0, oDur, k]: each shot is drawn in its own "story time" (o0 .. o0 + oDur, the times the scenes,
// CAPS and cues are written in), played from t0 at speed k (k < 1 = slower, so nothing rushes). A shot may run past
// oDur (it simply keeps living); its captions are the CAPS entries in [o0, o0 + oDur).
const SHOT_LIST = [
  [0.0,  'roof',   '1 la torre: hackeada en 1834',            0.0,  3.5, 1],
  [3.5,  'arms',   '2 cada postura, un número',               3.5,  3.5, 1],
  [7.0,  'book',   '3 el libro de códigos',                   7.0,  3.5, 1],
  [10.5, 'hills',  '4 cada torre copia sin entender',         10.5, 3.5, 1],
  [14.0, 'map',    '5 cruza Francia en minutos; solo el Estado', 14.0, 4.0, 1],
  [18.0, 'bourse', '6 los gemelos Blanc; saber antes = rico',  18.0, 4.0, 0.667],
  [24.0, 'coach',  '7 la diligencia: días tarde',             22.0, 3.5, 1],
  [27.5, 'error',  '8 la señal de error',                     25.5, 3.5, 1],
  [31.0, 'trick',  '9 símbolo rojo + error',                  29.0, 4.0, 0.8],
  [36.0, 'bribe',  '10 soborno en Tours; el paquete',         33.0, 4.0, 0.8],
  [41.0, 'relay',  '11 cada torre lo copió; el espía',        37.0, 4.0, 0.727],
  [46.5, 'buy',    '12 compran antes que la noticia',         41.0, 3.5, 0.875],
  [50.5, 'years',  '13 dos años; el operador confiesa',       44.5, 3.5, 1],
  [54.0, 'court',  '14 juicio en Tours; el jurado',           48.0, 1.5, 1],
  [57.5, 'black',  '14b no era delito',                       49.5, 1.5, 1],
  [60.0, 'law',    '15 la ley de 1837',                       51.0, 4.0, 0.8],
  [65.0, 'today',  '16 el truco sigue vivo + título',         55.0, 5.0, 1],
];
let CUR_SHOT = 0;
// run fn in shot i's story time; overlays queued during it (DEFER) run later in the same story time
function warp(i, fn) {
  const [t0, , , o0, , k] = SHOT_LIST[i], st = o0 + (TT - t0) * k, keepT = TT, keepE = E0, n0 = DEFER ? DEFER.length : 0;
  CUR_SHOT = i; TT = st; E0 = o0;
  try { fn(); } finally { TT = keepT; E0 = keepE; }
  if (DEFER) for (let j = n0; j < DEFER.length; j++) { const f = DEFER[j]; DEFER[j] = () => { const a = TT, e = E0; TT = st; E0 = o0; try { f(); } finally { TT = a; E0 = e; } }; }
}
// a story time (as in the scenes and CAPS) -> real time in the video
function NT(t) { for (let i = SHOT_LIST.length - 1; i >= 0; i--) { const [t0, , , o0, oDur, k] = SHOT_LIST[i]; if (t >= o0 - 1e-6 && t < o0 + oDur + (i === SHOT_LIST.length - 1 ? 1e9 : 0)) return t0 + (t - o0) / k; } return t; }
const ERA_LIST = SHOT_LIST.map(([t0, sc], i) => [t0, i + 1 < SHOT_LIST.length ? SHOT_LIST[i + 1][0] : DURATION, () => warp(i, () => SCENES[sc](i))]);
const SHOTS = SHOT_LIST.map(([t0, sc, title], i) => [sc, i, t0, ERA_LIST[i][1], title]);

// subtitles in story time: [t0, text]; each shows until the next one in its shot (or a null entry clears it)
const CAPS = [
  [0.6,  'ESTA TORRE FUE HACKEADA.'], [1.9, 'ESTA TORRE FUE HACKEADA. EN 1834.'],
  [3.7,  'CADA POSTURA DE SUS BRAZOS ERA UN NÚMERO.'],
  [7.2,  'UN LIBRO SECRETO CONVERTÍA LOS NÚMEROS EN PALABRAS.'],
  [10.7, 'CADA TORRE COPIABA A LA ANTERIOR...'], [12.4, 'SIN ENTENDER NADA.'],
  [14.2, 'UN MENSAJE CRUZABA FRANCIA EN MINUTOS.'], [16.4, 'PERO SOLO EL ESTADO PODÍA USARLA.'],
  [18.2, 'LOS GEMELOS BLANC JUGABAN A LA BOLSA EN BURDEOS.'], [20.2, 'QUIEN SUPIERA EL PRECIO ANTES, SE HACÍA RICO.'],
  [22.2, 'LAS NOTICIAS DE PARÍS LLEGABAN EN DILIGENCIA.'], [24.0, 'DÍAS TARDE.'],
  [25.7, 'LA RED TENÍA UNA SEÑAL PARA BORRAR ERRORES.'],
  [28.0, null],
  [29.6, 'UN SÍMBOLO FALSO... Y LUEGO, ERROR.'], [31.3, 'LA COPIA OFICIAL QUEDABA LIMPIA.'],
  [33.2, 'SOBORNARON AL OPERADOR DE TOURS.'], [35.0, 'UN SOCIO EN PARÍS LE MANDABA PAQUETES.'],
  [37.2, 'CADA TORRE LO COPIÓ SIN SABER POR QUÉ.'], [39.2, 'Y EN BURDEOS, UN ESPÍA LO LEÍA.'],
  [41.2, 'COMPRABAN ANTES DE QUE LLEGARA LA NOTICIA.'],
  [44.6, 'DURÓ DOS AÑOS.'], [45.7, 'HASTA QUE EL OPERADOR ENFERMÓ Y LO CONTÓ.'],
  [48.05, 'JUICIO EN TOURS, 1837.'], [49.3, 'EL JURADO DIO POR PROBADOS LOS SOBORNOS.'],
  [51.2, 'POCO DESPUÉS, YA LO ERA.'],
  [55.2, 'UN INFILTRADO Y UNA SEÑAL ESCONDIDA.'], [57.0, null],
];
const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE,
  format: 'beat-cut',
  shots: SHOTS.map(([key, era, t0, t1, title], i) => ({ id: i + 1, key, era, t0, t1, title })),
  cuts: SHOT_LIST.slice(1).map(([t0]) => t0),
  morphs: [],
  // cues in story time (the scenes use them as is; the score maps them with NT)
  cues: { hook: 0.6, red: 1.0, arms: 4.2, book: 7.4, op: 11.6, stamp: 16.6, brothers: 18.6, rich: 20.4, coach: 22.4, err: 26.4, drop: 28.0, hit: 29.0, clean: 31.4,
          bribe: 33.6, parcel: 35.2, relay: 37.4, spy: 39.2, buy: 41.6, sick: 46.2, gavel: 48.4, jury: 49.3, nolaw: 49.6, law: 51.6, morph: 53.5, title: 57.2 },
  acts: [
    { name: '1 La red',    role: 'build',   t0: 0.0,  t1: 18.0 },
    { name: '2 Los Blanc', role: 'journey', t0: 18.0, t1: 27.5 },
    { name: '3 La idea',   role: 'peak',    t0: 27.5, t1: 30.0 },
    { name: '4 Silencio',  role: 'silence', t0: 30.0, t1: 31.0 },
    { name: '5 El truco',  role: 'gift',    t0: 31.0, t1: 50.5 },
    { name: '6 La caída',  role: 'goodbye', t0: 50.5, t1: 70.0 },
  ],
  board: SHOT_LIST.map(([t0, , title], i) => ({ t: Math.min((i + 1 < SHOT_LIST.length ? SHOT_LIST[i + 1][0] : DURATION) - 0.3, t0 + 2.4), title, sound: '', next: '' })),
  narration: [],
};
window.TIMELINE = TIMELINE;
