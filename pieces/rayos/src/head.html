<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lightning Seeks Ground</title>
<style>
  html, body { margin: 0; height: 100%; background: #04031a; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { height: min(100vh, calc(100vw * 16 / 9)); width: auto; aspect-ratio: 9 / 16; display: block; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
"use strict";
// =====================================================================
//  WHY DOES LIGHTNING SEEK THE GROUND? — 9:16, voice-led (~143s), 24fps, style voltamps.
//  One fixed stage (F5): a storm over a little town (pylon, house, lamp, tree). The camera pushes into the
//  cloud for the charging, follows the leader down, and pulls back for the strike; later beats (types,
//  positive bolts, rods, the Empire State) are their own small stages.
// =====================================================================
const FPS = 24, W = 1080, H = 1920;
const BPM = 120, BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4, GRID0 = 0;
const VL = (id) => VOICE.lines.find((l) => l.id === id);
const VW = (id, w, n = 1) => { const L = VL(id); let k = 0; for (const x of L.words) if (x.w.toLowerCase().replace(/[^a-z0-9']/g, '') === w.toLowerCase() && ++k === n) return x.t0; return L.t0; };
const DURATION = Math.round(VOICE.duration * FPS) / FPS;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const SAFE = { top: 240, bottom: 420, right: 140 };
const VMONO = '"SF Mono", Menlo, "JetBrains Mono", "DejaVu Sans Mono", Consolas, monospace';
const HAND = VMONO;
const CX = 520;
const onBeat = (t) => t;

const S = (id) => VL(id).t0 - 0.3;                    // a beat starts ~0.3s before its line
const HIT = VL('return').t0 - 0.3;                     // the payoff: the circuit closes, in the pause after "where it strikes"
const IDS = ['title', 'open', 'up', 'charge', 'layers', 'shadow', 'volts', 'leader', 'streamers', 'connect', 'return', 'numbers', 'flicker', 'thunder', 'types', 'positive', 'upward', 'rod', 'twice', 'end'];
const TB = IDS.map((id, i) => (i === 0 ? 0 : id === 'return' ? HIT : S(id)));
const SUB = (id) => TB[IDS.indexOf(id)], SUBEND = (id) => (IDS.indexOf(id) + 1 < IDS.length ? TB[IDS.indexOf(id) + 1] : DURATION);
const ERA_LIST = [[0, DURATION, () => sceneStage()]];
const SHOTS = IDS.map((id, i) => [id, 0, TB[i], i + 1 < IDS.length ? TB[i + 1] : DURATION, id]);
const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, gridOffset: GRID0, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE, aspect: '9:16',
  format: 'fixed-stage',
  shots: SHOTS.map(([key, era, t0, t1, title], i) => ({ id: i + 1, key, era, t0, t1, title })),
  cuts: [S('types'), S('positive'), S('upward'), S('rod'), S('twice'), S('end')],
  morphs: [],
  cues: { hit: HIT },
  acts: [
    { name: '1 Hook',     role: 'build',   t0: 0, t1: S('charge') },
    { name: '2 Charge',   role: 'build',   t0: S('charge'), t1: S('leader') },
    { name: '3 Leader',   role: 'peak',    t0: S('leader'), t1: VL('connect').t1 },
    { name: '4 Silence',  role: 'silence', t0: VL('connect').t1 + 0.05, t1: HIT },
    { name: '5 Strike',   role: 'gift',    t0: HIT, t1: S('types') },
    { name: '6 Kinds',    role: 'build',   t0: S('types'), t1: S('end') },
    { name: '7 End',      role: 'goodbye', t0: S('end'), t1: DURATION },
  ],
  board: IDS.map((id, i) => ({ t: Math.min(VL(id).t1 - 0.2, (i + 1 < IDS.length ? TB[i + 1] : DURATION) - 0.1), title: id, sound: '', next: '' })),
  narration: VOICE.lines.map((l) => ({ id: l.id, t0: l.t0, t1: l.t1, text: l.text })),
};
window.TIMELINE = TIMELINE;
