<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Ship of Theseus</title>
<style>
  html, body { margin: 0; height: 100%; background: #05080a; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { height: min(100vh, calc(100vw * 16 / 9)); width: auto; aspect-ratio: 9 / 16; display: block; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
"use strict";
// =====================================================================
//  THE SHIP OF THESEUS — 9:16, voice-led (~65s), 24fps, style bitpix. One fixed stage (F2): the ship on the water.
//  Every plank is replaced (yellow = original matter, mint = new matter); Hobbes rebuilds the old planks into a
//  second ship; both ships burst into the dots of a person whose cells turn over; the word "same" splits into
//  matter and story; the ship returns with the person as its reflection.
// =====================================================================
const FPS = 24, W = 1080, H = 1920;
const BPM = 120, BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4, GRID0 = 0;
const VL = (id) => VOICE.lines.find((l) => l.id === id);
const VW = (id, w, n = 1) => { const L = VL(id); let k = 0; for (const x of L.words) if (x.w.toLowerCase().replace(/[^a-z0-9']/g, '') === w.toLowerCase() && ++k === n) return x.t0; return L.t0; };
const DURATION = Math.round(VOICE.duration * FPS) / FPS;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const SAFE = { top: 240, bottom: 420, right: 140 };
const HAND = 'Georgia, Cambria, "Times New Roman", "DejaVu Serif", serif';
const CX = 540;
const onBeat = (t) => t;

// beat boundaries: each starts ~0.3s before its line
const T1 = 0, T2 = VL('athens').t0 - 0.3, T3 = VL('hobbes').t0 - 0.3, T4 = VL('which').t0 - 0.3;
const HIT = VL('you').t0 - 0.32;                       // the payoff hit, in the pause before "You are that ship"
const T5 = HIT, T6 = VL('younger').t0 - 0.3, T7 = VL('trap').t0 - 0.3, T8 = VL('daily').t0 - 0.3;
const ERA_LIST = [[0, DURATION, () => sceneStage()]];
const SHOTS = [
  ['planks',  0, T1, T2, 'one plank, then all 38: yellow becomes mint'],
  ['athens',  0, T2, T3, 'centuries of repair; the philosophers argue'],
  ['hobbes',  0, T3, T4, 'the old planks come back as a second ship'],
  ['which',   0, T4, T5, 'which one? silence'],
  ['you',     0, T5, T6, 'both ships burst into the dots of a person; cells turn over'],
  ['cortex',  0, T6, T7, 'almost: the cortex stays original'],
  ['same',    0, T7, T8, 'the word same splits into matter and story'],
  ['end',     0, T8, DURATION, 'the ship again; its reflection is you'],
];
const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, gridOffset: GRID0, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE, aspect: '9:16',
  format: 'morph-chain',
  shots: SHOTS.map(([key, era, t0, t1, title], i) => ({ id: i + 1, key, era, t0, t1, title })),
  cuts: [],
  morphs: [],
  cues: { hit: HIT },
  acts: [
    { name: '1 Planks',  role: 'build',   t0: T1, t1: T3 },
    { name: '2 Hobbes',  role: 'peak',    t0: T3, t1: VL('which').t1 },
    { name: '3 Silence', role: 'silence', t0: VL('which').t1 + 0.1, t1: HIT },
    { name: '4 You',     role: 'gift',    t0: HIT, t1: T7 },
    { name: '5 Same',    role: 'goodbye', t0: T7, t1: DURATION },
  ],
  board: [
    { t: VL('open').t1 - 0.2, title: 'one plank swapped', sound: 'a wooden knock, piano enters', next: 'the swaps speed up' },
    { t: VL('more').t1 + 0.2, title: '38 / 38', sound: 'knocks accelerate', next: 'pull back' },
    { t: VL('plut').t1 - 0.3, title: 'Athens, Plutarch', sound: 'pad', next: 'Hobbes' },
    { t: VL('two').t1 - 0.3, title: 'two ships', sound: 'full', next: 'the question' },
    { t: HIT - 0.4, title: 'which one?', sound: 'silence', next: 'the burst' },
    { t: VL('cells').t1 - 0.5, title: 'you are that ship', sound: 'the loudest hit', next: 'push in to the head' },
    { t: VL('younger').t1 - 0.4, title: 'the cortex', sound: 'a held note', next: 'dots rise into the word' },
    { t: VL('apart').t1 - 0.2, title: 'same: matter / story', sound: 'two notes', next: 'merge' },
    { t: DURATION - 0.6, title: 'never the planks', sound: 'resolve', next: 'loops to the yellow ship' },
  ],
  narration: VOICE.lines.map((l) => ({ id: l.id, t0: l.t0, t1: l.t1, text: l.text })),
};
window.TIMELINE = TIMELINE;
