<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kratos</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b0c0f; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { height: min(100vh, calc(100vw * 16 / 9)); width: auto; aspect-ratio: 9 / 16; display: block; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
"use strict";
// =====================================================================
//  KRATOS — the god of war, as a black-figure vase frieze. 9:16, voice-led (~69s), 24fps, style amphora-bf.
//  Nano Banana layers (Flow) animated in code; the friezes are fixed, the picture slides right panel to panel.
// =====================================================================
const FPS = 24, W = 1080, H = 1920;
const BPM = 120, BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4, GRID0 = 0;
const VL = (id) => VOICE.lines.find((l) => l.id === id);
const VW = (id, w, n = 1) => { const L = VL(id); let k = 0; for (const x of L.words) if (x.w.toLowerCase().replace(/[^a-z0-9']/g, '') === w.toLowerCase() && ++k === n) return x.t0; return L.t0; };
const DURATION = Math.round(VOICE.duration * FPS) / FPS;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const SAFE = { top: 240, bottom: 420, right: 140 };
const HAND = 'Georgia, serif';
const CX = 540;
const onBeat = (t) => t;

const S = (id) => (id === 'ares' ? 0 : VL(id).t0 - 0.25);       // a beat starts just before its line
// caption chunks for bfCaptions: [t0, text, word times], a new chunk after punctuation or every 4 words
const CAPS = [];
for (const L of VOICE.lines) { const ws = L.text.split(/\s+/); let cur = null;
  ws.forEach((w, i) => { const t = L.words[i] ? L.words[i].t0 : L.t0; if (!cur) { cur = [t, [], []]; CAPS.push(cur); } cur[1].push(w); cur[2].push(t); if (/[.,:;?!]$/.test(w) || cur[1].length >= 4) cur = null; }); }
CAPS.forEach((c) => (c[1] = c[1].join(' ')));
const IDS = ['ares', 'ghost', 'hydra', 'trick', 'family', 'hunt', 'olympus', 'zeus', 'past', 'north', 'question', 'norse', 'lesson', 'blood', 'sign'];
const SIGN_T = VL('blood').t1 + 0.35;
const HIT = VL('blood').t0 - 0.45;                                // the payoff: in the pause before "Now that throne"
const TB = IDS.map((id) => (id === 'sign' ? SIGN_T : id === 'blood' ? HIT : S(id)));
const SUB = (id) => TB[IDS.indexOf(id)], SUBEND = (id) => (IDS.indexOf(id) + 1 < IDS.length ? TB[IDS.indexOf(id) + 1] : DURATION);
const ERA_LIST = [[0, DURATION, () => sceneStage()]];
const SHOTS = IDS.map((id, i) => [id, 0, TB[i], i + 1 < IDS.length ? TB[i + 1] : DURATION, id]);
const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, gridOffset: GRID0, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE, aspect: '9:16',
  format: 'black-figure-strip',
  shots: SHOTS.map(([key, era, t0, t1, title], i) => ({ id: i + 1, key, era, t0, t1, title })),
  cuts: TB.slice(1),
  morphs: [],
  cues: { hit: HIT },
  acts: [
    { name: '1 Pact',    role: 'build',   t0: 0, t1: SUB('trick') },
    { name: '2 Fall',    role: 'build',   t0: SUB('trick'), t1: SUB('hunt') },
    { name: '3 War',     role: 'peak',    t0: SUB('hunt'), t1: SUB('north') },
    { name: '4 North',   role: 'build',   t0: SUB('north'), t1: VL('lesson').t1 + 0.05 },
    { name: '5 Silence', role: 'silence', t0: VL('lesson').t1 + 0.05, t1: HIT },
    { name: '6 Blood',   role: 'gift',    t0: HIT, t1: SIGN_T },
    { name: '7 Sign',    role: 'goodbye', t0: SIGN_T, t1: DURATION },
  ],
  board: IDS.map((id, i) => ({ t: i + 1 === IDS.length ? DURATION - 0.6 : Math.min(VL(id).t1 - 0.2, TB[i + 1] - 0.5), title: id, sound: '', next: '' })),
  narration: VOICE.lines.map((l) => ({ id: l.id, t0: l.t0, t1: l.t1, text: l.text })),
};
window.TIMELINE = TIMELINE;
