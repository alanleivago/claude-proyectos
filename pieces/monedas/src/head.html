<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coin Rotation</title>
<style>
  html, body { margin: 0; height: 100%; background: #06101a; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { height: min(100vh, calc(100vw * 16 / 9)); width: auto; aspect-ratio: 9 / 16; display: block; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
"use strict";
// =====================================================================
//  HOW MANY TIMES DOES A COIN TURN WHEN IT ROLLS AROUND ANOTHER ONE? — 9:16, voice-led (~147s), 24fps, style bitstory.
//  One table: two gold coins seen at a tilt, the arrow on the rolling one, the centre's path, the edge unrolled into a
//  line and curled back, the Sun and the Earth, the 1982 SAT sheet, the coins in your pocket.
// =====================================================================
const FPS = 24, W = 1080, H = 1920;
const BPM = 120, BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4, GRID0 = 0;
const VL = (id) => VOICE.lines.find((l) => l.id === id);
const VW = (id, w, n = 1) => { const L = VL(id); let k = 0; for (const x of L.words) if (x.w.toLowerCase().replace(/[^a-z0-9']/g, '') === w.toLowerCase() && ++k === n) return x.t0; return L.t0; };
const DURATION = Math.round(VOICE.duration * FPS) / FPS;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const SAFE = { top: 240, bottom: 420, right: 140 };
const VMONO = '"SF Mono", Menlo, "JetBrains Mono", "DejaVu Sans Mono", Consolas, monospace';
const HAND = VMONO;
const CX = 520;
const onBeat = (t) => t;

const S = (id) => VL(id).t0 - 0.3;                    // a beat starts ~0.3s before its line
const HIT = VL('its2').t0 - 0.3;                     // the payoff: in the pause before "It's two."
const IDS = ['title', 'two', 'rolls', 'silly', 'broke', 'one', 'edge', 'whole', 'clean', 'its2', 'arrow', 'half', 'full', 'trick', 'center', 'radii', 'circle', 'twice', 'fav', 'unroll', 'once', 'real', 'plus', 'daily', 'earth', 'orbit', 'back', 'sat', 'four', 'choices', 'students', 'pocket', 'try', 'comments', 'end'];
const TB = IDS.map((id, i) => (i === 0 ? 0 : id === 'its2' ? HIT : S(id)));
const SUB = (id) => TB[IDS.indexOf(id)], SUBEND = (id) => (IDS.indexOf(id) + 1 < IDS.length ? TB[IDS.indexOf(id) + 1] : DURATION);
const ERA_LIST = [[0, DURATION, () => sceneStage()]];
const SHOTS = IDS.map((id, i) => [id, 0, TB[i], i + 1 < IDS.length ? TB[i + 1] : DURATION, id]);
const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, gridOffset: GRID0, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE, aspect: '9:16',
  format: 'fixed-stage',
  shots: SHOTS.map(([key, era, t0, t1, title], i) => ({ id: i + 1, key, era, t0, t1, title })),
  cuts: [],
  morphs: [],
  cues: { hit: HIT },
  acts: [
    { name: '1 Hook',    role: 'build',   t0: 0, t1: S('one') },
    { name: '2 One?',    role: 'build',   t0: S('one'), t1: VL('clean').t1 + 0.05 },
    { name: '3 Silence', role: 'silence', t0: VL('clean').t1 + 0.05, t1: HIT },
    { name: '4 Two',     role: 'gift',    t0: HIT, t1: S('trick') },
    { name: '5 Centre',  role: 'peak',    t0: S('trick'), t1: S('daily') },
    { name: '6 Earth',   role: 'build',   t0: S('daily'), t1: S('back') },
    { name: '7 SAT',     role: 'build',   t0: S('back'), t1: S('pocket') },
    { name: '8 Try',     role: 'build',   t0: S('pocket'), t1: S('end') },
    { name: '9 End',     role: 'goodbye', t0: S('end'), t1: DURATION },
  ],
  board: IDS.map((id, i) => ({ t: i + 1 === IDS.length ? DURATION - 0.4 : Math.min(VL(id).t1 - 0.2, TB[i + 1] - 0.1), title: id, sound: '', next: '' })),
  narration: VOICE.lines.map((l) => ({ id: l.id, t0: l.t0, t1: l.t1, text: l.text })),
};
window.TIMELINE = TIMELINE;
