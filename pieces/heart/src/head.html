<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Heart in the Times Table</title>
<style>
  html, body { margin: 0; height: 100%; background: #05080a; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { height: min(100vh, calc(100vw * 16 / 9)); width: auto; aspect-ratio: 9 / 16; display: block; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
"use strict";
// =====================================================================
//  THE HEART IN THE TIMES TABLE — Bitstory #4. 9:16, voice-led (~75s), 24fps, style bitpix. One stage (F2).
//  Dots on a circle, each joined to its double: only straight lines, and a cardioid appears (the envelope).
//  Tables 3..13 give k-1 points; k melts continuously; a coin rolls the cardioid; a cup's caustic (real reflections).
//  Mint = the straight lines; yellow = numbers, the multiplier, light; magenta = the curve nobody drew.
// =====================================================================
const FPS = 24, W = 1080, H = 1920;
const BPM = 120, BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4, GRID0 = 0;
const VL = (id) => VOICE.lines.find((l) => l.id === id);
const VW = (id, w, n = 1) => { const L = VL(id); let k = 0; for (const x of L.words) if (x.w.toLowerCase().replace(/[^a-z0-9']/g, '') === w.toLowerCase() && ++k === n) return x.t0; return L.t0; };
const DURATION = Math.round(VOICE.duration * FPS) / FPS;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const SAFE = { top: 240, bottom: 420, right: 140 };
const HAND = 'Georgia, Cambria, "Times New Roman", "DejaVu Serif", serif';
const CX = 540;
const onBeat = (t) => t;

// sections: each starts ~0.3s before its first line
const B0 = (id) => VL(id).t0 - 0.3;
const HIT = VL('there').t0 - 0.32;                      // the payoff hit: the heart appears, in the pause after "Watch."
const ERA_LIST = [[0, DURATION, () => sceneStage()]];
const SHOTS = [
  ['circle', 0, 0,            B0('fill'),   'the circle, the dots, each joined to its double'],
  ['fill',   0, B0('fill'),   HIT,          '400 dots; watch'],
  ['heart',  0, HIT,          B0('three'),  'there it is; only straight lines'],
  ['tables', 0, B0('three'),  B0('melt'),   'k = 3..13: k - 1 points'],
  ['melt',   0, B0('melt'),   B0('name'),   'the multiplier melts'],
  ['coin',   0, B0('name'),   B0('cup'),    'a cardioid: a coin rolling around a coin'],
  ['cup',    0, B0('cup'),    B0('cta'),    'the coffee cup: nephroid, then the heart'],
  ['cta',    0, B0('cta'),    DURATION,     'look at your coffee; Bitstory'],
];
const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, gridOffset: GRID0, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE, aspect: '9:16',
  format: 'morph-chain',
  shots: SHOTS.map(([key, era, t0, t1, title], i) => ({ id: i + 1, key, era, t0, t1, title })),
  cuts: [], morphs: [],
  cues: { hit: HIT },
  acts: [
    { name: '1 Circle',  role: 'build',   t0: 0, t1: B0('fill') },
    { name: '2 Fill',    role: 'peak',    t0: B0('fill'), t1: VL('fill').t1 },
    { name: '3 Silence', role: 'silence', t0: VL('fill').t1 + 0.1, t1: HIT - 0.1 },
    { name: '4 Heart',   role: 'gift',    t0: HIT, t1: B0('melt') },
    { name: '5 Coffee',  role: 'goodbye', t0: B0('name'), t1: DURATION },
  ],
  board: [
    { t: VL('join').t1 - 0.2, title: '1 to 2, 2 to 4', sound: 'a tick per line', next: 'past the end' },
    { t: VL('fill').t1 - 0.3, title: '400 dots', sound: 'lines rushing', next: 'silence' },
    { t: VL('there').t1 + 0.3, title: 'there it is', sound: 'the loudest hit', next: 'zoom in' },
    { t: VL('look').t1 - 0.3, title: 'only straight lines', sound: 'quiet', next: 'back out' },
    { t: VL('four').t1 - 0.2, title: 'x5: 4 points', sound: 'a step per table', next: 'the rule' },
    { t: VL('seven').t1 - 0.2, title: 'x13: 12 points', sound: 'a step', next: 'melt' },
    { t: VL('melt').t1 - 0.4, title: 'melting', sound: 'a swell', next: 'back to the heart' },
    { t: VL('coin').t1 - 0.3, title: 'a coin rolls', sound: 'a soft roll', next: 'the cup' },
    { t: VL('cup').t1 - 0.3, title: 'nephroid in the cup', sound: 'a shimmer', next: 'the light moves' },
    { t: DURATION - 0.6, title: 'Bitstory', sound: 'keys', next: 'loops' },
  ],
  narration: VOICE.lines.map((l) => ({ id: l.id, t0: l.t0, t1: l.t1, text: l.text })),
};
window.TIMELINE = TIMELINE;
