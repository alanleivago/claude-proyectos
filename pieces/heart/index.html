// a loose plank (sinking, flying): a slightly bowed bar of length len, angle rot
function bpLoosePlank(x, y, len, rot, c, a = 1, th = 0.22) {

// ---- a torn plank: the plank's own outline P (9 top points, then 9 bottom points reversed, world coords, centre cx, cy),
//  drawn at (x, y) turned by rot, with splintered ends (jag 0..1) and a grain line. key seeds the teeth.
function bpSplinter(P, cx, cy, x, y, rot, c, a = 1, jag = 1, key = 'sp') {
  const R = RNG('splinter', key), n = P.length / 2, top = P.slice(0, n), bot = P.slice(n);
  const ax = top[n - 1][0] - top[0][0], ay = top[n - 1][1] - top[0][1], al = Math.hypot(ax, ay) || 1, dx = ax / al, dy = ay / al;
  const teeth = (p, q, sgn) => { const out = []; for (let k = 1; k <= 4; k++) { const f = k / 5, d = sgn * jag * al * (k % 2 ? R.r(0.05, 0.13) : R.r(-0.06, 0.0)); out.push([lerp(p[0], q[0], f) + dx * d, lerp(p[1], q[1], f) + dy * d]); } return out; };
  const Q = [...top, ...teeth(top[n - 1], bot[0], 1), ...bot, ...teeth(bot[n - 1], top[0], -1)];
  ctx.save(); ctx.globalAlpha = clamp(a); ctx.translate(x, y); ctx.rotate(rot); ctx.translate(-cx, -cy);
  ctx.beginPath(); Q.forEach(([u, v], i) => (i ? ctx.lineTo(u, v) : ctx.moveTo(u, v))); ctx.closePath();
  ctx.fillStyle = c; ctx.fill(); ctx.lineJoin = 'miter'; ctx.lineWidth = 1.6; ctx.strokeStyle = bpMix(c, BP.ground, 0.6); ctx.stroke();

  ctx.restore();
}
// chips: thin slivers thrown off where a plank is torn out (u = 0..1 over their flight)
function bpChips(x, y, u, c, key, n = 7) {
  if (u <= 0 || u >= 1) return;
  for (let i = 0; i < n; i++) {
    const R = RNG('chip', key, i), an = R.r(-Math.PI * 0.95, -Math.PI * 0.05), sp = R.r(160, 420), t = u * R.r(0.5, 0.9);
    const px = x + Math.cos(an) * sp * t, py = y + Math.sin(an) * sp * t + 900 * t * t, len = R.r(12, 26), w = R.r(2.5, 4.5), r = an + t * R.r(-14, 14);
    ctx.save(); ctx.globalAlpha = clamp(1 - u); ctx.translate(px, py); ctx.rotate(r);
    ctx.beginPath(); ctx.moveTo(-len / 2, 0); ctx.lineTo(len * 0.1, -w / 2); ctx.lineTo(len / 2, 0); ctx.lineTo(len * 0.05, w / 2); ctx.closePath();

}

// ---- a human figure as dots on a hex grid: head, neck, torso, arms, legs. Cached per (size); returns local points.
function bpPersonDots(h, gap) {
  const k = h + ':' + gap; bpPersonDots.c = bpPersonDots.c || {}; if (bpPersonDots.c[k]) return bpPersonDots.c[k];
  const u = h / 100, inside = (x, y) => {   // x, y in units of h/100, origin top-centre
    if (Math.hypot(x, y - 10) < 9.6) return 'head';
    if (Math.abs(x) < 3.6 && y >= 19 && y < 24) return 'body';
    if (y >= 23 && y < 57) { const half = Math.min(11, 11 - (27 - y) * 1.1); if (Math.abs(x) < half) return 'body'; }
    if (y >= 25 && y < 58) { const ax = 17 + (y - 25) * 0.06, aw = y < 28 ? 2.8 - (28 - y) * 0.5 : 2.9; if (Math.abs(Math.abs(x) - ax) < aw) return 'body'; }
    if (y >= 57 && y < 100) { if (Math.abs(Math.abs(x) - 5.8) < 4.1) return 'body'; }
    return null;
  };
  const out = [], dy = gap * Math.sqrt(3) / 2;
  for (let r = 0, y = 0; y <= h; r++, y += dy) for (let x = -h * 0.3 + (r % 2) * gap / 2; x <= h * 0.3; x += gap) {
    const part = inside(x / u, y / u); if (part) out.push({ x, y, part });
  }
  return (bpPersonDots.c[k] = out);
}

// ---- a horizontal timeline with end ticks and labels; u = fill 0..1
function bpTimeline(x0, x1, y, u, la, lb, c = BP.mint, a = 1) {
  ctx.save(); ctx.globalAlpha = clamp(a); ctx.lineCap = 'round';
  ctx.strokeStyle = BP.dim; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
  for (const x of [x0, x1]) { ctx.beginPath(); ctx.moveTo(x, y - 24); ctx.lineTo(x, y + 24); ctx.stroke(); }
  if (u > 0) { const xu = lerp(x0, x1, clamp(u)); ctx.strokeStyle = c; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(xu, y); ctx.stroke(); bpGlow(xu, y, 54, c, 0.6); bpDot(xu, y, 13, c); }

//  STYLE — the renderer's hooks

const STYLE = {

  },
  blob(P, c) { ctx.save(); trace(P, true); ctx.fillStyle = c; ctx.fill(); ctx.restore(); },

// =====================================================================

const SHIFT = 0;   // centred (the user prefers a centred frame)
const OV = (f) => { const g = () => { ctx.save(); ctx.translate(SHIFT, 0); f(); ctx.restore(); }; DEFER ? DEFER.push(g) : g(); };
const fadeIn = (t, d = 0.35) => EZ.o2(ev(t, d));

const win = (t0, t1, d = 0.35) => fadeIn(t0, d) * fadeOut(t1, d);

const caption = (lines, a, y = 1400, size = 74, o = {}) => { if (a > 0) OV(() => bpLines(lines, 540, y, size, BP.text, a, o)); };
const commas = (n) => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
const line = (x0, y0, x1, y1, c, w, a) => { ctx.save(); ctx.globalAlpha = clamp(a); ctx.strokeStyle = c; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke(); ctx.restore(); };

// ---- the circle and the times table
const CIR = { cx: 540, cy: 880, r: 390 };
const A0 = Math.PI / 2;                                    // point 0 at the bottom, so the heart's point is at the top
const angOf = (x, N) => A0 + TAU * x / N;                 // x may be fractional (k·i)
const cPt = (x, N, r = CIR.r) => [CIR.cx + Math.cos(angOf(x, N)) * r, CIR.cy + Math.sin(angOf(x, N)) * r];
// draw the chords i -> k·i for i < m (m may be fractional: the last one grows in), N dots, multiplier k
function drawTable(N, k, m, a, o = {}) {
  if (a <= 0) return;
  ctx.save(); ctx.lineCap = 'round';

// the envelope nobody drew: P(θ) = (k·e^{iθ} + e^{ikθ}) / (k + 1), an epicycloid with k - 1 cusps

// the cusps (the "points") of the k table: where the chord collapses to a point, θ = 2πj / (k - 1)
const cusps = (k) => { const n = Math.round(k - 1), out = []; for (let j = 0; j < n; j++) out.push(envPt((2 * j + 1) * Math.PI / n, k)); return out; };   // where (k-1)θ = π (mod 2π): the envelope's sharp points

// =====================================================================
//  S1 — the circle: 20 numbered dots, each joined to its double; 400 dots; the heart; the tables; melting
// =====================================================================
// the multiplier over time: 2, then each table on the word that names it, then a slow melt, then back to 2
function kAt(t) {
  const step = (t0, a, b) => lerp(a, b, EZ.io(seg(t, t0 - 0.1, t0 + 0.45)));
  let k = 2;
  k = step(VW('three', 'three'), k, 3);
  k = step(VW('four', 'four'), k, 4);
  k = step(VW('four', 'five'), k, 5);
  k = step(VW('seven', 'seven'), k, 7);
  k = step(VW('seven', 'thirteen'), k, 13);
  if (t > VL('melt').t0 - 0.2) k = lerp(13, 2, EZ.io(seg(t, VL('melt').t0 - 0.2, VW('melt', 'raise')))) ;
  if (t > VW('melt', 'raise')) k = 2 + 16 * EZ.i2(seg(t, VW('melt', 'raise'), VL('melt').t1 + 0.6));
  if (t > VL('melt').t1 + 0.6) k = lerp(18, 2, EZ.io(seg(t, VL('melt').t1 + 0.6, VW('name', 'heart'))));
  return k;
}
// how many dots: 20, then 400 on "fill"
const NAt = (t) => (t < VW('fill', 'four') ? 20 : 400);
// how many chords are drawn
function mAt(t) {
  const N = NAt(t);
  if (N === 20) {
    const tj = VW('join', 'join'), a = [VW('join', 'one'), VW('join', 'two', 2), VW('join', 'three')];
    if (t < tj) return 0;
    if (t < a[0]) return 1 * seg(t, tj, a[0]);                        // 0 -> 0 is a point; start with 1 -> 2 on "One"
    if (t < VL('wrap').t0) return 1 + [0, 1, 2].reduce((s, i) => s + seg(t, a[i], a[i] + 0.5), 0);
    return 4 + 16 * EZ.io(seg(t, VL('wrap').t0 + 0.4, VL('wrap').t1 + 0.4));
  }
  return 400 * EZ.i2(seg(t, VW('fill', 'four'), HIT - 0.05));
}

function beatCircle() {
  const a = fadeOut(B0('name') + 6, 0.5) * (1 - 0.8 * win(B0('coin') + 0.4, B0('cup') + 0.3, 0.6));
  if (a <= 0) return;
  const tableA = a * fadeOut(B0('cup') - 0.2, 0.5);
  drawCircle(tableA * fadeIn(0.2, 0.6));
  const N = NAt(TT), k = kAt(TT), m = mAt(TT);
  drawTable(N, k, m, tableA);
  // the 20 numbered dots
  const da = fadeIn(VW('dots', 'dots') - 0.1, 0.4) * fadeOut(VW('fill', 'four') , 0.5) * tableA;
  if (da > 0) for (let i = 0; i < 20; i++) {
    const s = EZ.back(seg(TT, VW('dots', 'dots') - 0.1 + i * 0.04, VW('dots', 'dots') + 0.2 + i * 0.04)), [x, y] = cPt(i, 20), [lx, ly] = cPt(i, 20, CIR.r + 46);
    bpDot(x, y, 9 * s, BP.text, da);
    OV(() => bpText(String(i), lx, ly + 12, 32, BP.yellow, { font: BP.mono, alpha: da * clamp(s) * fadeIn(VW('dots', 'number') - 0.1, 0.3) }));
  }
  // each chord, as it's drawn: a pill "i -> 2i" and a light running along it
  if (N === 20 && TT < VL('wrap').t0 + 0.3) for (let i = 1; i <= Math.min(3, Math.floor(m + 0.001)); i++) {
    const [x0, y0] = cPt(i, 20), [x1, y1] = cPt(2 * i, 20), u = mod((TT - VW('join', 'one')) / 0.9 + i * 0.3, 1);
    bpGlow(lerp(x0, x1, u), lerp(y0, y1, u), 26, BP.yellow, tableA * 0.7); bpDot(lerp(x0, x1, u), lerp(y0, y1, u), 7, BP.yellow, tableA);
    OV(() => bpPill(`${i} → ${2 * i}`, (x0 + x1) / 2, (y0 + y1) / 2, 34, BP.yellow, tableA * fadeOut(VL('wrap').t0 + 0.2, 0.3)));
  }
  // the wrap: 11 -> 22 -> 2 (past the end, keep counting)
  const wa = win(VL('wrap').t0 - 0.1, VL('wrap').t1 + 0.3, 0.3) * tableA;
  if (wa > 0) { const [x0, y0] = cPt(11, 20), [x1, y1] = cPt(2, 20); line(x0, y0, x1, y1, BP.yellow, 6, wa); bpGlow(x1, y1, 40, BP.yellow, wa * 0.7);
    OV(() => bpPill('11 × 2 = 22 → 2', 540, 1420, 44, BP.yellow, wa)); }
  // the 400 dots appear as a ring
  const ra = fadeIn(VW('fill', 'four'), 0.6) * tableA;
  if (ra > 0) for (let i = 0; i < 400; i += 1) { const [x, y] = cPt(i, 400); bpDot(x, y, 2.2, BP.text, ra * 0.7); }
  // the heart: the envelope lights up on the hit
  const ea = TT < HIT ? 0 : fadeIn(HIT, 0.25) * (TT < B0('three') ? 1 : 0.6) * tableA;
  drawEnvelope(k, ea * (TT > B0('look') && TT < B0('nobody') ? 0.35 : 1) * (TT > VL('melt').t0 - 0.2 && TT < VW('name', 'heart') ? 0 : 1), EZ.io(seg(TT, HIT, HIT + 0.6)));
  // a light running along the edge nobody drew
  if (ea > 0.3 && !(TT > VL('melt').t0 - 0.2 && TT < VW('name', 'heart'))) { const [x, y] = envPt(mod(TT * 1.1, TAU), k); bpGlow(x, y, 46, '#ffffff', ea * 0.6); bpDot(x, y, 8, '#ffffff', ea); }
  // the cusps, counted, on each table
  const ca = win(VW('three', 'three') - 0.1, VL('melt').t0 - 0.3, 0.3) * tableA;

    OV(() => { if (settled && kk > 2) { bpText(`${kk - 1}`, 540, 1440, 120, BP.magenta, { font: BP.mono, weight: 700, alpha: ca, glow: 20 }); bpText(kk - 1 === 1 ? 'point' : 'points', 540, 1500, 40, BP.soft, { font: BP.mono, alpha: ca }); } });
  }
  // the multiplier, top
  const ka = fadeIn(0.3, 0.4) * tableA;
  OV(() => {
    const melting = TT > VW('melt', 'raise') && TT < VL('melt').t1 + 0.6;
    bpText(`× ${melting ? k.toFixed(2) : Math.round(k)}`, 540, 330, 92, BP.mint, { font: BP.mono, weight: 700, alpha: ka, glow: 14 });
    const ru = win(VW('rule', 'number') - 0.2, VL('melt').t0 - 0.2, 0.3) * tableA;
    if (ru > 0) bpText('points = × − 1', 540, 410, 50, BP.yellow, { font: BP.mono, alpha: ru });
  });
  // captions
  caption([{ t: 'only the 2 times table', c: BP.text, i: true }], win(0.4, VL('dots').t0 - 0.1), 1440, 66);
  caption([{ t: 'each number → its double', c: BP.mint, i: true }], win(VW('join', 'join') - 0.1, VL('wrap').t0 - 0.55), 1440, 66);
  caption([{ t: 'There it is.', c: BP.magenta, i: true }], win(HIT + 0.2, B0('look') + 0.2), 1460, 92);
  caption([{ t: 'not one curved line', c: BP.text, i: true }], win(VW('look', 'curved') - 0.2, VL('nobody').t0 - 0.4), 1460, 70);
  caption([{ t: 'nobody drew it', c: BP.magenta, i: true }], win(VW('nobody', 'nobody') - 0.1, VL('three').t0 - 0.1), 1460, 76);
  caption([{ t: 'forever', c: BP.mint, i: true }], win(VW('melt', 'forever') - 0.1, VL('name').t0 - 0.1), 1460, 80);
}
// =====================================================================
//  S2 — the cardioid's name and the rolling coin, the coffee cup's caustic, the comments; stage, camera, cues
// =====================================================================
// the coin: a coin of radius a rolls around a fixed coin of radius a; a point on it traces the cardioid.
// Fitted to the circle's heart: the cardioid (k=2 envelope) spans 2/3 r... we place the coins so their trace overlays it.
function beatCoin() {
  const a = win(VW('name', 'cardioid') - 0.3, B0('cup') + 0.3, 0.5); if (a <= 0) return;
  OV(() => bpText('cardioid', 540, 430, 92, BP.magenta, { italic: true, alpha: a, glow: 16 }));
  const ca = win(VL('coin').t0 - 0.1, B0('cup') + 0.3, 0.4); if (ca <= 0) return;
  // the k=2 envelope: centre of its fixed generating circle and radius from envPt (cusp at the top)
  const r = CIR.r / 3, c = [CIR.cx, CIR.cy];                             // fixed coin at the centre, radius r/3: the rolling coin's point traces envPt(θ, 2) exactly
  const ph = TAU * EZ.io(seg(TT, VL('coin').t0 + 0.2, VL('coin').t1 + 0.2));   // one full turn
