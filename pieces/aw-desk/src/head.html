// =====================================================================
//  "You sold 10% of Apple for $800" — cartoon3d, 9:16, 30 fps, 46 s. You are Ron Wayne, Apple's third co-founder:
//  you sign the partnership in April 1976, draw the first logo, and 12 days later sell your 10% back for $800.
//  Brief and shot list: brief.md. Voice: the user's, trimmed (voice/), words in src/words.js.
// =====================================================================
const FPS = 30, W = 1080, H = 1920;
const BPM = 120, BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4;
const DURATION = 47.6;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const SAFE = { top: 240, bottom: 420, right: 140 };
const HAND = '"Segoe UI", Arial, sans-serif';
const CX = 540;
const ERA_LIST = [[0, DURATION, () => sceneApple()]];
const SHOTS = [['all', 0, 0.0, DURATION, 'look check: kitchen 1976, byte shop, LED']];
const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE,
  gpu: true, format: 'F-true-story',
  shots: SHOTS.map(([key, era, t0, t1, title], i) => ({ id: i + 1, key, era, t0, t1, title })),
  cuts: [], morphs: [],
  cues: {},
  acts: [{ name: 'all', role: 'build', t0: 0, t1: DURATION }],
  board: [],   // filled from SHOT_LIST below (one panel per shot, at its middle)
  narration: [],
};
window.TIMELINE = TIMELINE;
TIMELINE.boardFromShots = true;
