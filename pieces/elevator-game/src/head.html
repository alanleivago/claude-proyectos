<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Elevator Game</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { height: min(100vh, calc(100vw * 16 / 9)); width: auto; aspect-ratio: 9 / 16; display: block; cursor: pointer; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
"use strict";
// =====================================================================
//  THE ELEVATOR GAME — 9:16, 24fps, style "onebit" + Flow layers (src/scenes.js: flowShot quantizes them to the 1-bit ramp).
//  F5 fixed-hero journey: the heroine stays in the elevator, the world outside the doors changes. Voice-clocked.
// =====================================================================
const FPS = 24, W = 1080, H = 1920;
const BPM = 120, BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4;
const DURATION = 12.0;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const SAFE = { top: 240, bottom: 420, right: 140 };
const HAND = 'sans-serif';
const CX = 540;

// [t0, scene] — look stage: the four most different beats
const SHOT_LIST = [
  [0.0, 'stare'],     // 6  eyes locked forward
  [3.0, 'other'],     // 9  the tenth floor of another world, the red cross
  [6.0, 'only'],      // 10 "the only person there" - she is at the end of the hall
  [9.0, 'reveal'],    // 11 the face
];
const SCENE = { stare: () => sceneStare(), other: () => sceneOther(), only: () => sceneOnly(), reveal: () => sceneReveal() };
const ERA_LIST = SHOT_LIST.map(([t0, sc], i) => [t0, i + 1 < SHOT_LIST.length ? SHOT_LIST[i + 1][0] : DURATION, SCENE[sc]]);
const SUBS = [
  { t0: 0.3, t1: 3.0, lines: ['Do not look at her.', 'Do not speak to her.'] },
  { t0: 3.3, t1: 6.0, lines: ['Through the window,', 'a red cross.'] },
  { t0: 6.3, t1: 9.0, lines: ['And you are the only', 'person there.'] },
];
const CUE = { sting: 9.0 };
const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE,
  format: 'F5',
  shots: SHOT_LIST.map(([t0, sc], i) => ({ id: i + 1, key: sc, era: i, t0, t1: ERA_LIST[i][1], title: sc })),
  cuts: SHOT_LIST.slice(1).map(([t0]) => t0),
  morphs: [],
  cues: CUE,
  acts: [
    { name: 'look', role: 'build', t0: 0, t1: DURATION },
  ],
  board: [
    { t: 2.5, title: 'do not look', sound: 'hum, breath', next: 'cut' },
    { t: 5.5, title: 'red cross', sound: 'dead air', next: 'cut' },
    { t: 8.5, title: 'only person', sound: 'silence', next: 'cut on the hit' },
    { t: 10.5, title: 'the face', sound: 'loudest hit', next: 'end' },
  ],
  narration: [],
};
window.TIMELINE = TIMELINE;
