<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
"use strict";
// =====================================================================
//  ¿QUÉ PASARÍA SI LOS HOMBRES TUVIERAN EL PERIODO DURANTE 24 HORAS? — 9:16, 62 s, 24 fps.
//  A day, hour by hour, with a "male pain level" HUD: the gym, the street, a ballpark, a building site, the supermarket,
//  parliament's emergency session; meanwhile women have a normal Tuesday; at hour 24 it stops — "That wasn't so bad."
// =====================================================================
const FPS = 24, W = 1080, H = 1920;
const BPM = 120, BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4;
const DURATION = 62.0;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const SAFE = { top: 240, bottom: 420, right: 140 };
const HAND = 'Georgia, Cambria, "Times New Roman", serif';
const CX = 540;

const ERA_LIST = [[0, 62, () => sceneMain()]];
const SHOTS = [
  ['gym',     0,  6,  'gimnasio: un hombre con mancuernas se dobla de dolor'],
  ['street',  6,  11, 'la calle: todos los hombres a la vez'],
  ['ball',    11, 19, 'estadio de béisbol: jugadores tirados; partido suspendido'],
  ['site',    19, 26, 'obra: obreros acurrucados con bolsas de agua caliente'],
  ['market',  26, 34, 'supermercado: analgésicos y chocolate agotados'],
  ['parl',    34, 43, 'Parlamento: ley de compresas gratis aprobada en 4 s'],
  ['office',  43, 50, 'mientras tanto, las mujeres: un martes normal'],
  ['dusk',    50, 56, 'hora 24: el dolor cae a 0; "No fue para tanto"'],
  ['card',    56, 62, 'tarjeta final'],
];
const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE,
  format: 'F5',
  shots: SHOTS.map(([key, t0, t1, title], i) => ({ id: i + 1, key, era: 0, t0, t1, title })),
  cuts: [], morphs: [],
  cues: { quiet: 50.0, look: 52.6 },
  acts: [
    { name: '1 Empieza', role: 'build', t0: 0, t1: 11 },
    { name: '2 El caos', role: 'journey', t0: 11, t1: 34 },
    { name: '3 Ley', role: 'peak', t0: 34, t1: 50 },
    { name: '4 Silencio', role: 'silence', t0: 50, t1: 50.8 },
    { name: '5 No fue para tanto', role: 'gift', t0: 50.8, t1: 56 },
    { name: '6 Final', role: 'goodbye', t0: 56, t1: 62 },
  ],
  board: [[2.5, 'título, gimnasio'], [4.8, 'se dobla'], [8.5, 'todos a la vez'], [13, 'estadio'], [17, 'partido suspendido'], [22.5, 'la obra'], [29, 'supermercado'], [32, 'chocolate agotado'], [37, 'Parlamento'], [41, 'aprobada en 4 s'], [46.5, 'un martes normal'], [51.5, 'hora 24'], [54, 'no fue para tanto'], [59.5, 'tarjeta']].map(([t, title]) => ({ t, title, sound: '', next: '' })),
  narration: [],
};
window.TIMELINE = TIMELINE;
