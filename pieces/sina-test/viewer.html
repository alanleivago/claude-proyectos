<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>char viewer</title>
<style>html,body{margin:0;background:#000}canvas{display:block;image-rendering:pixelated}</style>
<script type="importmap">{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }</script>
</head>
<body>
<script type="module">
// Character turnaround: frame f = one of 4 angles. Low-res render, nearest upscale, hemisphere + key + rim lights.
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const LW = 240, LH = 400, S = 3;
const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(LW * S, LH * S, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const rt = new THREE.WebGLRenderTarget(LW, LH, { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter });
rt.texture.colorSpace = THREE.SRGBColorSpace;
const blit = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.MeshBasicMaterial({ map: rt.texture }));
const blitScene = new THREE.Scene(); blitScene.add(blit); const blitCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

const scene = new THREE.Scene(); scene.background = new THREE.Color(0x5a7a9a);
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8070, 1.5));
const key = new THREE.DirectionalLight(0xfff2e0, 1.2); key.position.set(-1.5, 2.5, 2); scene.add(key);
const rim = new THREE.DirectionalLight(0x9fd0ff, 2.4); rim.position.set(1.5, 2, -2.5); scene.add(rim);
const floor = new THREE.Mesh(new THREE.CircleGeometry(0.6, 12), new THREE.MeshLambertMaterial({ color: 0x3a4a5a }));
floor.rotation.x = -Math.PI / 2; scene.add(floor);
const cam = new THREE.PerspectiveCamera(38, LW / LH, 0.05, 20);

const gltf = await new GLTFLoader().loadAsync(new URLSearchParams(location.search).get('m') || 'models/sina.glb');
const char = gltf.scene;
char.traverse((o) => {
  if (!o.isMesh) return;
  const s = o.material;
  if (s.map) { s.map.minFilter = s.map.magFilter = THREE.NearestFilter; s.map.generateMipmaps = false; }
  o.material = new THREE.MeshLambertMaterial({ map: s.map || null, color: s.map ? 0xffffff : s.color, alphaTest: 0.5, side: THREE.DoubleSide });
});
scene.add(char);
const ANG = [0, 0.8, Math.PI / 2, Math.PI];
window.renderFrame = (f) => {
  const a = ANG[f % 4], zoom = f >= 4;
  const r = zoom ? 1.0 : 3.1, h = zoom ? 1.42 : 0.85;
  cam.position.set(Math.sin(a) * r, h + (zoom ? 0.05 : 0.15), Math.cos(a) * r);
  cam.lookAt(0, h, 0);
  renderer.setRenderTarget(rt); renderer.render(scene, cam);
  renderer.setRenderTarget(null); renderer.render(blitScene, blitCam);
};
window.READY = true;
</script>
</body>
</html>
