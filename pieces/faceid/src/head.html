//  projected dots, depth map, photo vs face, mesh match, unlock. Shots authored in REFERENCE time R = refT(TT).
// =====================================================================
const FPS = 30, W = 1080, H = 1920;
const BPM = 120, BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4;
const VL = (id) => VOICE.lines.find((l) => l.id === id);
const DURATION = Math.round(VOICE.duration * FPS) / FPS;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const SAFE = { top: 240, bottom: 420, right: 0 };
const HAND = '"FreeSans", Helvetica, Arial, sans-serif';
const CX = 540;

// [reference time, Spanish time] — line starts and ends of both voices
const ANCH = [
  [0.0, 0.0], [3.34, 3.64], [3.8, 3.84], [6.36, 6.34], [7.12, 6.94], [8.04, 8.3], [8.4, 8.78], [12.5, 13.08],
  [13.04, 13.38], [15.16, 15.46], [15.86, 16.06], [20.02, 20.14], [20.62, 20.34], [22.34, 22.66], [23.0, 22.92], [25.08, 25.36],
  [30.34, 31.14], [30.98, 31.4], [33.56, 34.18], [37.16, 37.86], [37.82, 38.22], [40.46, 41.76], [41.16, 41.9], [43.5, 44.06],
  [44.04, 44.3], [47.04, 46.82], [47.72, 47.46], [52.8, 52.48], [56.82, 57.16], [59.88, 59.72], [60.58, 60.46], [62.92, 63.68],
  [63.46, 63.94], [65.92, 66.56], [66.5, 66.86], [68.64, 69.1], [69.14, 69.48], [71.64, 71.98], [75.8, 75.9], [76.5, DURATION]
];
function refT(t) {
  if (t <= 0) return 0;
  for (let i = 1; i < ANCH.length; i++) { const [r0, s0] = ANCH[i - 1], [r1, s1] = ANCH[i]; if (t <= s1) return r0 + (r1 - r0) * (t - s0) / (s1 - s0); }
  return ANCH[ANCH.length - 1][0];
}
function esT(r) {
  for (let i = 1; i < ANCH.length; i++) { const [r0, s0] = ANCH[i - 1], [r1, s1] = ANCH[i]; if (r <= r1) return s0 + (s1 - s0) * (r - r0) / (r1 - r0); }
  return DURATION;
}
